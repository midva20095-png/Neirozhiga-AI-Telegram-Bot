async function api(body) {
  if (!API_URL) return null;
  const ac = new AbortController(), tm = setTimeout(() => ac.abort(), 25000);
  try {
    const r = await fetch(API_URL, { method: "POST", signal: ac.signal, headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(Object.assign({ launch: initData }, body)) });
    const txt = await r.text();
    try { return JSON.parse(txt); } catch (e) { return { ok: false, error: "Сервер вернул не тот ответ: " + txt.slice(0, 120) }; }
  } finally { clearTimeout(tm); }
}

}

// видео подгружается и играет только пока видно на экране (экономит трафик и ускоряет загрузку)
const io = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => {
  const v = e.target;
  if (e.isIntersecting) {
    if (!v.getAttribute("src")) { v.src = v.dataset.src; v.onerror = () => { v.removeAttribute("src"); v.load(); }; }
    v.play().catch(() => {});
  } else v.pause();
}), { threshold: 0.4 }) : null;
function lazyVideos() {
  document.querySelectorAll("video[data-src]").forEach(v => {
    if (io) io.observe(v); else if (!v.getAttribute("src")) { v.src = v.dataset.src; v.play().catch(() => {}); }
  });
}
function rt(im) { const n = Number(im.dataset.n || 0); if (n >= 2) { im.remove(); return; } im.dataset.n = n + 1; setTimeout(() => { im.src = im.src + (im.src.indexOf("?") >= 0 ? "&" : "?") + "r=" + (n + 1); }, 1200 * (n + 1)); }

const readImg = file => new Promise(ok => {
  const img = new Image(), u = URL.createObjectURL(file);
  img.onload = () => {
    const k = Math.min(1, 1024 / Math.max(img.width, img.height));
    const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(u); ok(c.toDataURL("image/jpeg", 0.82));
  };
  img.onerror = () => { URL.revokeObjectURL(u); toast("Не удалось открыть фото. Выберите снимок в формате JPG или PNG"); ok(null); };
  img.src = u;
});
function renderMulti(i) {
  const f = S.cur.fields[i], arr = S.photos[i] || (S.photos[i] = []);
  $("up" + i).innerHTML = arr.map((src, k) => '<div class="th"><img src="' + src + '"><b>' + (k + 1) + '</b><i onclick="delPh(' + i + ',' + k + ')">✕</i></div>').join("") +
    (arr.length < f.multi ? '<label class="add">➕<span>Добавить фото<br>' + arr.length + " из " + f.multi + '</span><input type="file" accept="image/*" multiple hidden onchange="pickMulti(event,' + i + ')"></label>' : "");
}
async function pickMulti(e, i) {
  const f = S.cur.fields[i], arr = S.photos[i] || (S.photos[i] = []);
  for (const file of Array.from(e.target.files)) { if (arr.length >= f.multi) break; const d = await readImg(file); if (d) arr.push(d); }
  renderMulti(i);
}
function delPh(i, k) { S.photos[i].splice(k, 1); renderMulti(i); }

async function pick(e, i) {
  const file = e.target.files[0]; if (!file) return;
  const d = await readImg(file); if (!d) return;
  S.photos[i] = d; $("up" + i).innerHTML = upHtml(i, d, S.cur.fields[i].label);
}

async function run() {
  const t = S.cur; if (!t) return;
  if (t.type === "layout") return layRun(t);
  const ans = {}, photos = [], fl = t.fields || [];
  document.querySelectorAll("#qs [data-k]").forEach(el => { ans[el.dataset.k] = el.value.trim(); });
  for (let i = 0; i < fl.length; i++) {
    const f = fl[i];
    if (f.type === "фото") {
      const got = f.multi ? (S.photos[i] || []) : (S.photos[i] ? [S.photos[i]] : []);
      if (!got.length && !f.optional) { toast("Добавьте фото: " + f.label); return; }
      got.forEach(x => photos.push(x));
    } else if (!ans[f.key]) { toast("Заполните: " + f.label); return; }
  }
  if (S.balance < t.price) { toast("Недостаточно средств. Пополните баланс в чате с ботом 💳"); return; }
  $("go").disabled = true; $("go").textContent = "Запускаем…";
  try {
    const r = await api({ action: "run", templateId: t.id, answers: ans, photos: photos });
    if (r === null) toast("Демо-режим: подключите API_URL");
    else if (r.ok) {
      if (typeof r.balance === "number") S.balance = r.balance;
      recAdd(t.id); draw(); closeP(); toast(r.message || "Готово! Результат придёт в чат с ботом 🍓");
      return;
    } else toast(r.error || "Ошибка, попробуйте ещё раз");
  } catch (e) { toast("Нет связи, попробуйте ещё раз"); }
  $("go").disabled = false; $("go").textContent = "Сгенерировать за " + t.price + " ₽";
}

S.lay = [];
const readLay = file => new Promise(ok => {
  const img = new Image(), u = URL.createObjectURL(file), png = file.type !== "image/jpeg";
  img.onload = () => {
    const k = Math.min(1, (png ? 1200 : 1600) / Math.max(img.width, img.height));
    const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(u); ok(png ? c.toDataURL("image/png") : c.toDataURL("image/jpeg", 0.88));
  };
  img.onerror = () => { URL.revokeObjectURL(u); toast("Не удалось открыть файл. Выберите PNG или JPG"); ok(null); };
  img.src = u;
});
function layDraw() {
  const L = S.lay;
  $("lay").innerHTML = L.map((it, i) => '<div class="lr"><div class="lt"><img src="' + it.src + '"></div><div class="lf"><label>Размер, см<input type="number" inputmode="decimal" min="1" max="27" step="0.5" value="' + it.size + '" oninput="S.lay[' + i + '].size=this.value"></label><label>Кол-во<input type="number" inputmode="numeric" min="1" max="10" value="' + it.qty + '" oninput="S.lay[' + i + '].qty=this.value"></label></div><i onclick="layDel(' + i + ')">✕</i></div>').join("") +
    (L.length < 12 ? '<label class="add" style="min-height:70px">➕<span>Добавить элементы (' + L.length + ' из 12)</span><input type="file" accept="image/*" multiple hidden onchange="layAdd(event)"></label>' : "");
}
async function layAdd(e) {
  for (const f of Array.from(e.target.files)) { if (S.lay.length >= 12) break; const d = await readLay(f); if (d) S.lay.push({ src: d, size: 5, qty: 1 }); }
  layDraw();
}
function layDel(i) { S.lay.splice(i, 1); layDraw(); }
async function layRun(t) {
  if (!S.lay.length) { toast("Добавьте хотя бы один элемент"); return; }
  const num = v => Number(String(v).replace(",", "."));
  for (const it of S.lay) { const s = num(it.size); if (!(s >= 1 && s <= 27)) { toast("Укажите размер каждого элемента: от 1 до 27 см"); return; } }
  if (S.balance < t.price) { toast("Недостаточно средств. Пополните баланс в чате с ботом 💳"); return; }
  $("go").disabled = true; $("go").textContent = "Отправляем…";
  try {
    const r = await api({ action: "run", templateId: t.id, items: S.lay.map(it => ({ photo: it.src, size: num(it.size), qty: Math.max(1, Math.min(10, parseInt(it.qty, 10) || 1)) })) });
    if (r && r.ok) { if (typeof r.balance === "number") S.balance = r.balance; draw(); closeP(); toast(r.message || "Готово! Листы придут в чат с ботом 🍓"); return; }
    toast((r && r.error) || "Ошибка, попробуйте ещё раз");
  } catch (e) { toast("Нет связи, попробуйте ещё раз"); }
  $("go").disabled = false; $("go").textContent = "Собрать листы A4 за " + t.price + " ₽";
}

  let body, btn = "";
  if (!d.payer) { body = "🔒 <b>Ежедневный бонус</b>: заходи каждый день и получай рубли в подарок. Откроется после первого пополнения баланса."; btn = '<a class="btnl" target="_blank" href="' + CHAT_LINK + '">Пополнить в чате</a>'; }

    if (r && r.ok) { S.balance = r.balance; S.daily = r.daily; $("bal").textContent = S.balance + " ₽"; dailyDraw(); toast("🎁 +" + r.reward + " ₽ на баланс!"); }
    else toast((r && r.error) || "Ошибка, попробуйте ещё раз");
  } catch (e) { toast("Нет связи, попробуйте ещё раз"); }
}

// ---------- раздел «Создать»: генерация картинок и видео прямо в приложении ----------
// ---------- GPT Image 2.5: выбор версии, качества, разрешения и режима ----------
function gptFix(g) { if (g.c && g.q === "low") g.c = false; if (g.c && g.v === "flare" && (g.q === "xhigh" || g.q === "max")) g.q = "high"; }
function mkGset(k, v) { S.mk.g[k] = v; gptFix(S.mk.g); mkDraw(); }
function gch(items, key, cur) {
  return '<div class="chips w">' + items.map(it => '<button class="chip' + (it[0] === cur ? " on" : "") + '" onclick="mkGset(\'' + key + '\',' + (typeof it[0] === "boolean" ? it[0] : "\'" + it[0] + "\'") + ')">' + it[1] + "</button>").join("") + "</div>";
}
function gptOpts() {
  const m = S.mk; if (m.kind !== "img" || m.model !== "gpt") return "";
  const g = m.g;
  return '<label class="q">Версия</label>' + gch([["flare", "Flare · быстрая"], ["sunburst", "Sunburst · точная"]], "v", g.v) +
    '<label class="q">Качество</label>' + gch([["low", "Low"], ["medium", "Medium"], ["high", "High"], ["xhigh", "XHigh"], ["max", "Max"]], "q", g.q) +
    '<label class="q">Разрешение</label>' + gch([["1k", "1K"], ["2k", "2K"], ["4k", "4K · для печати"]], "r", g.r) +
    '<label class="q">Режим</label>' + gch([[false, "Обычный"], [true, "Экономный"]], "c", g.c) +
    '<small style="display:block;color:var(--mut);margin:-4px 0 12px;font-size:12px;line-height:1.35">Экономный режим: качество Medium и выше по сниженной цене (недоступен для Low). У Flare в экономном режиме нет XHigh и Max.</small>';
}

// ---------- Seedance 2.5: фото, видео и аудио-образцы ----------
function sdPrice(m) {
  const V = Math.ceil(m.vids.reduce((a, v) => a + v.dur, 0)), rate = m.res === "720p" ? 28 : 14, vref = m.res === "720p" ? 16 : 8, base = 180 * (m.dur / 5) * (m.res === "720p" ? 2 : 1);
  const refs = !(m.photos.length === 1 && !m.vids.length && !m.auds.length);
  const extra = (refs && m.vids.length) ? Math.max(0, m.dur * vref + V * vref - m.dur * rate) : 0;
  return Math.ceil(base + extra * 2.5);
}
function sdDraw() {
  const m = S.mk, el = $("msd"); if (!el) return;
  if (m.kind !== "sd") { el.innerHTML = ""; return; }
  const row = (it, i, k) => '<div class="lr"><div style="flex:1;font-size:13px;word-break:break-all">' + (k === "v" ? "🎥 " : "🎙 ") + esc(it.name) + '<br><small style="color:var(--mut)">' + (it.dur ? it.dur.toFixed(1) + " сек · " : "") + (it.size / 1048576).toFixed(1) + ' МБ</small></div><i onclick="sdDel(\'' + k + "'," + i + ')">✕</i></div>';
  el.innerHTML = '<label class="q">Видео-образцы (по желанию: до 2, суммарно до 30 сек, каждое до 50 МБ)</label>' + m.vids.map((it, i) => row(it, i, "v")).join("") +
    (m.vids.length < 2 ? '<label class="add" style="min-height:56px;margin-bottom:12px">🎥<span>Добавить видео (' + m.vids.length + ' из 2)</span><input type="file" accept="video/mp4,video/quicktime,.mp4,.mov" hidden onchange="sdAddV(event)"></label>' : "") +
    '<label class="q">Аудио-образцы (по желанию: до 2)</label>' + m.auds.map((it, i) => row(it, i, "a")).join("") +
    (m.auds.length < 2 ? '<label class="add" style="min-height:56px;margin-bottom:12px">🎙<span>Добавить аудио (' + m.auds.length + ' из 2)</span><input type="file" accept="audio/*,.mp3,.m4a,.wav,.aac,.ogg" hidden onchange="sdAddA(event)"></label>' : "");
}
function sdDel(k, i) { (k === "v" ? S.mk.vids : S.mk.auds).splice(i, 1); mkDraw(); }
const vidDur = f => new Promise(ok => {
  const v = document.createElement("video"), u = URL.createObjectURL(f);
  v.preload = "metadata"; v.onloadedmetadata = () => { URL.revokeObjectURL(u); ok(v.duration || 0); }; v.onerror = () => { URL.revokeObjectURL(u); ok(0); }; v.src = u;
});
async function sdAddV(e) {
  const f = e.target.files[0]; if (!f) return;
  const ext = (f.name.split(".").pop() || "").toLowerCase();
  if (ext !== "mp4" && ext !== "mov") { toast("Нужен ролик в формате mp4 или mov"); return; }
  if (f.size > 50 * 1048576) { toast("Видео больше 50 МБ, выберите покороче"); return; }
  const d = await vidDur(f);
  if (!d) { toast("Не удалось определить длину видео"); return; }
  if (d < 2) { toast("Видео слишком короткое: нужно минимум 2 секунды"); return; }
  if (S.mk.vids.reduce((a, v) => a + v.dur, 0) + d > 30) { toast("Видео-образцы: суммарно не больше 30 секунд"); return; }
  S.mk.vids.push({ file: f, ext: ext, name: f.name, size: f.size, dur: d }); mkDraw();
}
function sdAddA(e) {
  const f = e.target.files[0]; if (!f) return;
  const ext = (f.name.split(".").pop() || "").toLowerCase();
  if (["mp3", "m4a", "wav", "aac", "ogg"].indexOf(ext) < 0) { toast("Нужен аудиофайл: mp3, m4a, wav, aac или ogg"); return; }
  if (f.size > 20 * 1048576) { toast("Аудио больше 20 МБ"); return; }
  S.mk.auds.push({ file: f, ext: ext, name: f.name, size: f.size }); mkDraw();
}
async function upFile(file, ext, onp) {
  const uid = Date.now().toString(36) + Math.random().toString(36).slice(2, 8), CH = 2097152, n = Math.max(1, Math.ceil(file.size / CH));
  let url = "";
  for (let i = 0; i < n; i++) {
    const part = file.slice(i * CH, Math.min(file.size, (i + 1) * CH));
    const b64 = await new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",").pop()); r.onerror = no; r.readAsDataURL(part); });
    let r = null;
    for (let t = 0; t < 3 && !(r && r.ok); t++) { try { r = await api({ action: "up", uid: uid, i: i, n: n, size: file.size, start: i * CH, ext: ext, data: b64 }); } catch (e) { r = null; } }
    if (!r || !r.ok) throw new Error((r && r.error) || "Не удалось загрузить файл");
    if (r.url) url = r.url;
    onp(Math.round((i + 1) / n * 100));
  }
  if (!url) throw new Error("Файл не загрузился до конца");
  return url;
}

function mkInfo() { return S.models.find(z => z.id === S.mk.model) || {}; }
function mkSizes() { if (S.mk.kind === "sd") return ["9:16", "16:9"]; return S.mk.kind === "vid" ? ((S.vinfo && S.vinfo.sizes) || ["auto", "1:1", "16:9", "9:16", "3:2", "2:3"]) : (mkInfo().sizes || ["1:1", "3:4", "4:3", "9:16", "16:9"]); }
function mkMax() { if (S.mk.kind === "sd") return 6; return S.mk.kind === "vid" ? ((S.vinfo && S.vinfo.maxPhotos) || 4) : (mkInfo().maxPhotos || 6); }
function mkKind(k) {
  S.mk.kind = k; S.mk.photos = []; S.mk.model = k === "img" ? "gpt" : (k === "sd" ? "sd" : "g15"); S.mk.size = k === "img" ? "1:1" : (k === "sd" ? "9:16" : "auto"); S.mk.dur = k === "sd" ? 5 : 6; S.mk.vids = []; S.mk.auds = [];
  $("m-img").className = "chip" + (k === "img" ? " on" : ""); $("m-vid").className = "chip" + (k === "vid" ? " on" : ""); $("m-sd").className = "chip" + (k === "sd" ? " on" : "");
  mkDraw();
}
function mkPrice() {
  const m = S.mk;
  if (m.kind === "sd") return sdPrice(m);
  if (m.kind === "vid") return m.dur * (S.vp[m.res] || 6);
  if (m.model === "gpt") { const t = (S.models.find(z => z.id === "gpt") || {}).gpt; if (t) return t[m.g.c ? "c" : "n"][m.g.q][m.g.r]; }
  const x = S.models.find(z => z.id === m.model); return x ? x.price : 0;
}
function mkModel(id) { S.mk.model = id; if (mkSizes().indexOf(S.mk.size) < 0) S.mk.size = "1:1"; if (S.mk.photos.length > mkMax()) S.mk.photos.length = mkMax(); mkDraw(); }
function mkSet(k, v) { S.mk[k] = v; mkDraw(); }
function mkChips(arr, key, cur, suf) {
  return '<div class="chips w">' + arr.map(z => '<button class="chip' + (z === cur ? " on" : "") + '" onclick="mkSet(\'' + key + '\',' + (typeof z === "number" ? z : "'" + z + "'") + ')">' + z + (suf || "") + "</button>").join("") + "</div>";
}
function mkDraw() {
  const m = S.mk, img = m.kind === "img", sd = m.kind === "sd";
  $("mm").innerHTML = img ? S.models.map(x => '<div class="mc' + (x.id === m.model ? " on" : "") + '" onclick="mkModel(\'' + x.id + '\')"><b>' + esc(x.title) + "<span>" + x.price + ' ₽</span></b><small>' + esc(x.hint) + "</small></div>").join("")
    : sd ? '<div class="mc on"><b>Seedance 2.5<span>от 180 ₽</span></b><small>Видео со звуком до 30 секунд. Одно фото оживает. Несколько фото, видео или аудио служат образцами: в описании напишите, что взять с каждого.</small></div>' : '<div class="mc on"><b>Grok Video 1.5<span>от 36 ₽</span></b><small>Оживляет ваше фото: плавное движение, до 15 секунд. Нужно от 1 до 4 фото.</small></div>';
  $("mo").innerHTML = gptOpts() + '<label class="q">Формат</label>' + mkChips(mkSizes(), "size", m.size) +
    (img ? "" : '<label class="q">Длительность</label>' + mkChips(sd ? [5, 10, 15, 20, 25, 30] : [6, 10, 15], "dur", m.dur, " сек") + '<label class="q">Качество</label>' + mkChips(["480p", "720p"], "res", m.res));
  $("mpl").textContent = (img || sd) ? "Фото-референсы (по желанию, до " + mkMax() + ")" : "Фото для видео (от 1 до " + mkMax() + "), по порядку";
  mkPh(); sdDraw();
  $("mgo").textContent = "Сгенерировать за " + mkPrice() + " ₽"; $("mgo").disabled = false;
}
function mkPh() {
  const m = S.mk, max = mkMax();
  $("mph").innerHTML = m.photos.map((src, k) => '<div class="th"><img src="' + src + '"><b>' + (k + 1) + '</b><i onclick="mkDel(' + k + ')">✕</i></div>').join("") +
    (m.photos.length < max ? '<label class="add">➕<span>Добавить фото<br>' + m.photos.length + " из " + max + '</span><input type="file" accept="image/*" multiple hidden onchange="mkPick(event)"></label>' : "");
}
async function mkPick(e) {
  const m = S.mk, max = mkMax();
  for (const f of Array.from(e.target.files)) { if (m.photos.length >= max) break; const d = await readImg(f); if (d) m.photos.push(d); }
  mkPh();
}
function mkDel(k) { S.mk.photos.splice(k, 1); mkPh(); }
async function mkRun() {
  const m = S.mk, prompt = $("mkp").value.trim(), price = mkPrice();
  if (prompt.length < 3) { toast("Опишите, что нужно сделать ✍️"); return; }
  if (m.kind === "vid" && !m.photos.length) { toast("Для видео добавьте фото 📷"); return; }
  if (m.kind === "sd" && !m.photos.length && !m.vids.length && !m.auds.length) { toast("Добавьте фото, видео или аудио 📎"); return; }
  if (S.balance < price) { toast("Недостаточно средств. Пополните баланс в чате с ботом 💳"); return; }
  $("mgo").disabled = true; $("mgo").textContent = "Запускаем…";
  try {
    let vids = [], auds = [];
    if (m.kind === "sd") {
      for (let k = 0; k < m.vids.length; k++) { const it = m.vids[k]; vids.push({ url: await upFile(it.file, it.ext, p => { $("mgo").textContent = "Загружаем видео " + (k + 1) + ": " + p + "%"; }), dur: it.dur }); }
      for (let k = 0; k < m.auds.length; k++) { const it = m.auds[k]; auds.push(await upFile(it.file, it.ext, p => { $("mgo").textContent = "Загружаем аудио " + (k + 1) + ": " + p + "%"; })); }
      $("mgo").textContent = "Запускаем…";
    }
    const r = await api({ action: "create", vids: vids, auds: auds, kind: m.kind, model: m.model, prompt: prompt, size: m.size, dur: m.dur, res: m.res, gv: m.g.v, gq: m.g.q, gr: m.g.r, gc: m.g.c, photos: m.photos });
    if (r === null) toast("Демо-режим: подключите API_URL");
    else if (r.ok) {
      if (typeof r.balance === "number") S.balance = r.balance;
      $("bal").textContent = S.balance + " ₽"; $("mkp").value = ""; m.photos = []; m.vids = []; m.auds = []; mkDraw();
      toast(r.message || "Готово! Результат придёт в чат с ботом 🍓"); return;
    } else toast(r.error || "Ошибка, попробуйте ещё раз");
  } catch (e) { toast("Нет связи, попробуйте ещё раз"); }
  $("mgo").disabled = false; $("mgo").textContent = "Сгенерировать за " + price + " ₽";
}

// светящиеся огоньки на фоне: золотые, светло-розовые, светло-бирюзовые
(function () {
  const c = $("fx"), g = c.getContext("2d");
  if (matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  const cols = ["255,211,110", "255,194,236", "143,245,255"];
  let W, H;
  const P = [];
  function size() { W = c.width = innerWidth; H = c.height = innerHeight; }
  size(); addEventListener("resize", size);
  for (let i = 0; i < 20; i++) P.push({ x: Math.random(), y: Math.random(), r: 1 + Math.random() * 2.6, s: 0.02 + Math.random() * 0.06, a: Math.random() * 6.28, c: cols[i % 3] });
  (function loop(t) {
    if (document.hidden || t - (loop.l || 0) < 33) { requestAnimationFrame(loop); return; }
    loop.l = t;
    g.clearRect(0, 0, W, H);
    P.forEach(p => {
      p.y -= p.s / 60; p.x += Math.sin(t / 2500 + p.a) / 3000;
      if (p.y < -0.02) { p.y = 1.02; p.x = Math.random(); }
      const tw = 0.35 + 0.65 * Math.abs(Math.sin(t / 900 + p.a)), x = p.x * W, y = p.y * H;
      const gr = g.createRadialGradient(x, y, 0, x, y, p.r * 5);
      gr.addColorStop(0, "rgba(" + p.c + "," + tw + ")"); gr.addColorStop(1, "rgba(" + p.c + ",0)");
      g.fillStyle = gr; g.beginPath(); g.arc(x, y, p.r * 5, 0, 6.28); g.fill();
    });
    requestAnimationFrame(loop);
  })(0);
})();

function applyInit(d, quick) {
  S.templates = d.templates || []; S.models = d.models || []; S.vinfo = d.videoInfo || null; S.vp = d.videoPrices || { "480p": 6, "720p": 12 };
  if (!S.models.length) S.models = FALLBACK_MODELS;
  if (!quick) { S.balance = Number(d.balance) || 0; S.daily = d.daily || null; dailyDraw(); }
  tbDraw(); catsDraw(); draw();
}
(async function init() {
  // сначала показываем сохранённые шаблоны, чтобы приложение открывалось сразу
  try { const c = JSON.parse(localStorage.getItem("yg_init") || "null"); if (c && c.templates && c.templates.length) applyInit(c, true); } catch (e) {}
  let d = null, err = "";
  for (let a = 1; a <= 3; a++) {
    try { d = await api({ action: "init" }); err = ""; } catch (e) { err = e && e.name === "AbortError" ? "сервер долго не отвечает" : "нет связи с сервером"; }
    if (d === null && !err) d = DEMO;   // API_URL не вписан: показываем демо
    if (d && d.ok) break;
    if (a < 3) await new Promise(r => setTimeout(r, 1500));
  }
  if (!d || !d.ok) {
    $("bal").textContent = "— ₽";
    const m = esc(err || (d && d.error) || "неизвестная ошибка");
    $("dl").innerHTML = '<div class="dl">⚠️ ' + m + ' <button class="btnl" onclick="location.reload()">Повторить</button></div>';
    if (!S.templates.length) $("grid").innerHTML = '<div class="empty">⚠️ ' + m + "</div>";
    S.models = S.models.length ? S.models : FALLBACK_MODELS;
    return;
  }
  try { if (d.templates) localStorage.setItem("yg_init", JSON.stringify({ templates: d.templates, models: d.models, videoInfo: d.videoInfo, videoPrices: d.videoPrices })); } catch (e) {}
  applyInit(d, false);
  const sp = location.hash.replace("#", "");
  if (/^t/.test(sp) && S.templates.find(x => x.id === sp.slice(1))) openP(sp.slice(1));   // ссылка прямо на шаблон
})();
</script></body></html>
