<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Личный кабинет · НейроЯга</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0614;
  --card: #140c24;
  --accent: #b366ff;
  --pink: #ff2d95;
  --cyan: #00ffe0;
  --text: #f3efff;
  --mut: #a79cc4;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Manrope', -apple-system, sans-serif;
  background: radial-gradient(circle at 10% 0%, rgba(179,102,255,.15), transparent 40%),
              radial-gradient(circle at 90% 0%, rgba(255,45,149,.12), transparent 40%),
              var(--bg);
  color: var(--text);
  padding: 16px;
  min-height: 100vh;
}
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}
.logo {
  font-family: 'Unbounded', sans-serif;
  font-weight: 800;
  font-size: 20px;
  background: linear-gradient(135deg, #00ffe0, #b366ff, #ff2d95);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.site-btn {
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.12);
  color: var(--text);
  padding: 8px 14px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 13px;
  text-decoration: none;
}
.card {
  background: var(--card);
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 14px;
  border: 1px solid rgba(255,255,255,.06);
}
.balance {
  font-family: 'Unbounded', sans-serif;
  font-size: 48px;
  font-weight: 800;
  text-align: center;
  background: linear-gradient(135deg, #00ffe0, #b366ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin: 6px 0;
}
.sub { text-align: center; color: var(--mut); font-size: 13px; margin-bottom: 14px; }
button.main {
  width: 100%;
  background: linear-gradient(135deg, #b366ff, #ff2d95);
  color: white;
  border: 0;
  padding: 14px;
  border-radius: 14px;
  font-weight: 800;
  font-size: 15px;
}
.section { font-size: 12px; color: var(--mut); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 10px; }
.model {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #1c1233;
  border-radius: 14px;
  padding: 12px 14px;
  margin-bottom: 8px;
  cursor: pointer;
}
.model.active { background: linear-gradient(135deg, #b366ff, #9d4dff); }
.model b { font-weight: 700; }
.model span { color: var(--mut); font-size: 13px; }
.model.active span { color: rgba(255,255,255,.75); }
</style>
</head>
<body>
<div class="header">
  <div class="logo">НейроЯга AI</div>
  <a class="site-btn" href="https://babayagaland.ru" target="_blank">На сайт</a>
</div>

<div class="card">
  <div class="section">Баланс</div>
  <div class="balance" id="balance">0</div>
  <div class="sub">кредитов</div>
  <button class="main" onclick="buy()">Пополнить баланс</button>
</div>

<div class="card">
  <div class="section">Текущая модель</div>
  <div id="models"></div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const MODELS = [
  { key: 'flash', name: 'Gemini Flash', cost: 4, desc: 'Быстрый текст' },
  { key: 'pro', name: 'Gemini Pro', cost: 15, desc: 'Аналитика' },
  { key: 'nanobanana', name: 'Nano Banana', cost: 20, desc: 'Картинки' },
  { key: 'nanobanana_pro', name: 'Nano Banana Pro', cost: 50, desc: 'Про-фото' },
  { key: 'qwen-image-3-0', name: 'Qwen Image', cost: 45, desc: 'Арт' },
  { key: 'sora-2', name: 'Sora 2.0', cost: 150, desc: 'Видео' },
];

const userId = tg?.initDataUnsafe?.user?.id;

async function load() {
  if (!userId) {
    document.getElementById('models').innerHTML = '<div style="text-align:center;color:var(--mut);padding:20px">Откройте через бота</div>';
    return;
  }
  try {
    const r = await fetch(`/api/me?userId=${userId}`);
    const d = await r.json();
    document.getElementById('balance').textContent = d.balance ?? 0;
    render(d.current_model || 'flash');
  } catch {
    document.getElementById('models').innerHTML = '<div style="text-align:center;color:#ff6b8a">Ошибка загрузки</div>';
  }
}

function render(current) {
  document.getElementById('models').innerHTML = MODELS.map(m => `
    <div class="model ${m.key===current?'active':''}" onclick="setModel('${m.key}')">
      <div>
        <b>${m.name}</b><br>
        <span>${m.desc}</span>
      </div>
      <span>${m.cost} кр</span>
    </div>
  `).join('');
}

async function setModel(model) {
  if (!userId) return;
  await fetch('/api/set-model', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ userId, model })
  });
  if (tg) tg.HapticFeedback.notificationOccurred('success');
  load();
}

function buy() {
  if (tg) {
    tg.sendData(JSON.stringify({ action: 'buy_credits' }));
    tg.close();
  } else {
    window.open('https://babayagaland.ru/kabinet?pay=1', '_blank');
  }
}

load();
</script>
</body>
</html>
