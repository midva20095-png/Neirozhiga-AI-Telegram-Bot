<script>
function vkSend(handler, params){
  if (window.vkBridge && vkBridge.send) {
    vkBridge.send(handler, params || {}).catch(function(){});
    return;
  }
  try { parent.postMessage({ handler: handler, params: params || {}, type: 'vk-connect', connectVersion: '2.15.8', sendTime: Date.now() }, '*'); }
  catch (e) {}
}
if (!window.__nyVkBoot) {
  window.__nyVkBoot = true;
  vkSend('VKWebAppInit');
  vkSend('VKWebAppGetLaunchParams');
}
function vkTell(msg){
  window.dispatchEvent(new MessageEvent('message', { data: msg }));
}
function hashTpl(value){
  const text = String(value || '');
  const query = text.indexOf('?') >= 0 ? text.slice(text.indexOf('?') + 1) : text;
  const mark = query.lastIndexOf('hash=');
  let carried = '';
  if (mark >= 0 && (mark === 0 || query.charAt(mark - 1) === '&')) {
    carried = query.slice(mark + 5);
    try { carried = decodeURIComponent(carried.replace(/\+/g, ' ')); } catch (e) {}
    carried = carried.replace(/^#/, '');
  }
  const chunks = carried ? [carried, text] : [text];
  for (let i = 0; i < chunks.length; i++) {
    const chunk = chunks[i];
    const direct = chunk.match(/tpl=(?:local:)?(\d{1,12})(?!\d)/);
    if (direct) return direct[1];
    const ref = chunk.match(/(?:^|[?&#]|vk_ref=|ref=)tpl_?(\d{1,12})(?!\d)/);
    if (ref) return ref[1];
    const short = chunk.match(/(?:^|[#?&])t(\d{1,12})(?!\d)/);
    if (short) return short[1];
  }
  return '';
}
window.__nyTpl = hashTpl(location.href) || '';
window.__nyHost = function(msg){
  if (!msg || !msg.type) return;
  if (msg.type === 'ny-goal-ask') {
    const goal = String(location.hash || '').replace(/^#/, '').split('&')[0].split('?')[0];
    if (goal === 'rate' || goal === 'site' || goal === 'shop' || goal === 'sub' || goal === 'help') vkTell({ type: 'ny-goal', goal: goal });
    const tpl = hashTpl(location.href) || hashTpl(window.__nyTpl || '');
    if (tpl) vkTell({ type: 'ny-tpl', id: tpl });
    return;
  }
  if (msg.type === 'ny-group-ask') {
    const id = new URLSearchParams(location.search).get('vk_group_id') || '';
    if (id) vkTell({ type: 'ny-group', id: id });
    return;
  }
  if (msg.type === 'ny-community-token') {
    const id = new URLSearchParams(location.search).get('vk_group_id') || '';
    if (!id) { vkTell({ type: 'ny-community-token-fail' }); return; }
    vkSend('VKWebAppGetCommunityToken', { app_id: 54901511, group_id: Number(id), scope: 'app_widget' });
    return;
  }
  if (msg.type === 'ny-widget-show') {
    const id = String(msg.group_id || '').replace(/\D/g, '');
    const body = String(msg.code || '');
    if (!id || body.indexOf('cover_id') < 0 || body.length > 12000) { vkTell({ type: 'ny-widget-fail' }); return; }
    vkSend('VKWebAppShowCommunityWidgetPreviewBox', { group_id: Number(id), type: 'cover_list', code: body });
    return;
  }
  if (msg.type === 'ny-user-ask') {
    vkSend('VKWebAppGetAuthToken', { app_id: 54901511, scope: '' });
    return;
  }
  if ((msg.type === 'ny-open' || msg.type === 'ny-pay') && /^https:\/\//.test(String(msg.url || ''))) {
    vkSend('VKWebAppOpenLink', { url: msg.url });
  }
};
window.addEventListener('message', function(event){
  let data = event.data || {};
  if (typeof data === 'string') { try { data = JSON.parse(data); } catch (e) { data = {}; } }
  if (data.type && String(data.type).indexOf('ny-') === 0) return;
  let bridgeType = (data.data && data.data.type) || data.handler || '';
  let bridgeData = (data.data && data.data.data) || data.params || {};
  if (!bridgeType && String(data.type || '').indexOf('VKWebApp') === 0) {
    bridgeType = data.type;
    bridgeData = data.data || {};
  }
  if (bridgeType === 'VKWebAppChangeFragment' || bridgeType === 'VKWebAppLocationChanged') {
    const where = String((bridgeData && (bridgeData.location || bridgeData.hash)) || '');
    const goal = where.replace(/^#/, '').split('&')[0].split('?')[0];
    if (goal === 'rate' || goal === 'site' || goal === 'shop' || goal === 'sub' || goal === 'help') vkTell({ type: 'ny-goal', goal: goal });
    const tpl = hashTpl(where);
    if (tpl) vkTell({ type: 'ny-tpl', id: tpl });
    return;
  }
  if (bridgeType === 'VKWebAppGetLaunchParamsResult') {
    const bag = {};
    [bridgeData, bridgeData && bridgeData.params, bridgeData && bridgeData.data].forEach(function(level){
      if (!level || typeof level !== 'object') return;
      Object.keys(level).forEach(function(key){
        if (key === 'sign' || key.indexOf('vk_') === 0) bag[key] = level[key];
      });
    });
    const id = String(bag.vk_group_id || (bridgeData && bridgeData.group_id) || '').replace(/\D/g, '');
    if (id) vkTell({ type: 'ny-group', id: id });
    const opened = hashTpl(location.href) || hashTpl(window.__nyTpl) || hashTpl(bag.vk_ref) || hashTpl(bridgeData && bridgeData.location) || hashTpl(bridgeData && bridgeData.hash);
    if (opened) vkTell({ type: 'ny-tpl', id: opened });
    vkTell({ type: 'ny-launch', params: bag });
    return;
  }
  if (bridgeType === 'VKWebAppGetCommunityTokenResult' && bridgeData.access_token) {
    vkTell({ type: 'ny-community-token', token: bridgeData.access_token });
    return;
  }
  if (bridgeType === 'VKWebAppGetCommunityTokenFailed') vkTell({ type: 'ny-community-token-fail' });
  if (bridgeType === 'VKWebAppGetAuthTokenResult' && bridgeData.access_token) {
    vkTell({ type: 'ny-user-token', token: bridgeData.access_token });
    return;
  }
  if (bridgeType === 'VKWebAppGetAuthTokenFailed') vkTell({ type: 'ny-user-token-fail' });
  if (String(bridgeType).indexOf('WidgetPreviewBoxFailed') >= 0) {
    const reason = bridgeData && (bridgeData.error_reason || (bridgeData.error_data && bridgeData.error_data.error_reason) || '');
    vkTell({ type: 'ny-widget-fail', reason: String(reason || '').replace(/access_token=[^&\s]+/g, '').slice(0, 180) });
  }
});
</script>

function moscowToday(){
  const shifted = new Date(Date.now() + 3 * 60 * 60 * 1000);
  return { y: shifted.getUTCFullYear(), m: shifted.getUTCMonth() + 1, d: shifted.getUTCDate() };
}
function monthKey(year, month){
  return year + '-' + (month < 10 ? '0' : '') + month;
}
function shiftMonth(key, delta){
  const match = /^(\d{4})-(\d{2})$/.exec(key || '');
  let year = match ? Number(match[1]) : 0;
  let month = match ? Number(match[2]) : 0;
  if (!year || !month) {
    const now = moscowToday();
    year = now.y;
    month = now.m;
  }
  month += delta;
  while (month < 1) { month += 12; year -= 1; }
  while (month > 12) { month -= 12; year += 1; }
  return monthKey(year, month);
}

function applyTrade(id){
  const catalog = window.ASSIST_TRADES;
  const trade = catalog && catalog.trades.find(function(item){ return item.id === id; });
  if (!trade) return;
  const booking = document.getElementById('assistBookingOn');
  const link = document.getElementById('assistLinkOn');
  const goods = document.getElementById('assistGoodsOn');
  const order = document.getElementById('assistOrderOn');
  if (booking) booking.checked = !!trade.bookingOn;
  if (link) link.checked = !!trade.linkOn;
  if (goods) goods.checked = !!trade.goodsOn;
  if (order) order.checked = !!trade.orderOn;
  fillAssistServices(trade.services || []);
  if (trade.bookingOn) {
    const funnel = document.querySelector('input[name="assistScenario"][value="funnel"]');
    if (funnel) funnel.checked = true;
  }
  const list = document.getElementById('assistButtons');
  if (list) {
    const groupId = String((document.getElementById('assistGroup') || {}).value || '').replace(/\D/g, '');
    const buttons = (trade.buttons || []).map(function(button){
      if (button.label === 'Каталог' && groupId && !button.link && !button.goods) {
        return { label: 'Каталог', link: 'https://vk.com/market-' + groupId };
      }
      return button;
    });
    const book = document.getElementById('assistBookLabel');
    const named = buttons.find(function(button){ return button && (button.action === 'book' || button.label === 'Записаться'); });
    if (book && named && named.label) book.value = named.label;
    list.innerHTML = buttons.filter(function(button){ return button && button.action !== 'book' && button.label !== 'Записаться'; }).map(function(button){ return assistButtonHtml(button); }).join('');
    ensureAssistAdd();
  }
  const msg = document.getElementById('deskmsg');
  const wizard = document.querySelector('.desk.mode-wizard');
  if (msg) msg.textContent = wizard ? '' : 'Направление «'+trade.title+'» подставлено. Сохраните карточку.';
  bind();
}

async function saveDesk(){
  const msg = document.getElementById('deskmsg');
  const button = document.getElementById('assistDesk');
  const pickedMode = document.querySelector('input[name="assistDeskMode"]:checked');
  const wizardFull = pickedMode && pickedMode.value === 'wizard' && assistWizardKind === 'full';

  if (deskMode === 'simple') copyDesk('simple');

  const about = (document.getElementById('assistAbout') || {}).value || '';
  const guide = (document.getElementById('assistGuide') || {}).value || '';
  const contacts = (document.getElementById('assistContacts') || {}).value || '';
  const address = (document.getElementById('assistAddress') || {}).value || '';
  const order = (document.getElementById('assistOrder') || {}).value || '';
  const choices = (document.getElementById('assistChoices') || {}).value || '';
  const payment = (document.getElementById('assistPayment') || {}).value || '';
  const booking = (document.getElementById('assistBooking') || {}).value || '';
  const pickup = (document.getElementById('assistPickup') || {}).value || '';
  const pickupMap = (document.getElementById('assistPickupMap') || {}).value || '';

  const deliveryPrice = (document.getElementById('assistDeliveryPrice') || {}).value || '';
  const pickupOn = !!(document.getElementById('assistPickupOn') || {}).checked;
  const deliveryOn = !!(document.getElementById('assistDeliveryOn') || {}).checked;
  const handoff = !!(document.getElementById('assistHandoff') || {}).checked;
  const products = assistProductValue();
  const orderOn = !!(document.getElementById('assistOrderOn') || {}).checked;
  const bookingOn = !!(document.getElementById('assistBookingOn') || {}).checked;
  const linkOn = !!(document.getElementById('assistLinkOn') || {}).checked;
  const goodsOn = linkOn;
  const trade = (document.getElementById('assistTrade') || {}).value || 'shop';
  const services = assistServiceValue();
  const picked = document.querySelector('input[name="assistScenario"]:checked');
  const scenario = picked && picked.value === 'info' ? 'info' : 'funnel';
  const buttons = [];
  const seen = {};
  if (deskMode === 'simple') {
    readPlainButtons().forEach(function(item){
      if (!item || seen[item.label]) return;
      seen[item.label] = true;
      buttons.push(item);
    });
  } else {
    document.querySelectorAll('#assistButtons > [data-brow]').forEach(function(row){
      const item = assistReadButton(row);
      if (!item || seen[item.label]) return;
      seen[item.label] = true;
      buttons.push(item);
    });
    const bookOn = !!(document.getElementById('assistBookingOn') || {}).checked;
    const bookLabel = String((document.getElementById('assistBookLabel') || {}).value || '').replace(/\s+/g, ' ').trim().slice(0, 24) || 'Записаться';
    if (bookOn && !seen[bookLabel]) buttons.push({ label: bookLabel, action: 'book', text: 'Открыть свободные дни' });
  }
  if (button) button.disabled = true;
  if (msg) msg.textContent = 'Сохраняю ответы…';
  try {
    const response = await fetch('/api/vk/assistant/reply', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ greeting: greeting, about: about, guide: guide, contacts: contacts, address: address, order: order, choices: choices, payment: payment, booking: booking, pickup: pickup, pickupMap: pickupMap, delivery: delivery, deliveryPrice: deliveryPrice, pickupOn: pickupOn, deliveryOn: deliveryOn, goodsOn: goodsOn, orderOn: orderOn, bookingOn: scenario === 'info' ? false : bookingOn, linkOn: linkOn, trade: trade, services: services, multi: assistMultiOn(), products: products, handoff: handoff, buttons: buttons, schedule: assistScheduleValue(), scenario: scenario, desk: deskMode })
    });
    const data = await response.json();
    if (!response.ok || !data.ok) throw new Error(data.error || 'Ответы не сохранились');
    if (data.reply && assistView && assistView.community) assistView.community.reply = data.reply;
    if (showWizardDone(!!data.pending)) {
      if (msg) msg.textContent = '';
      mountReadyHome();
    } else if (msg) msg.textContent = data.pending ? 'Ответы сохранены. Покупатели увидят их, когда помощник будет на связи.' : 'Ответы сохранены. Покупатель увидит эту фразу и кнопки.';
    if (button) button.disabled = false;
  } catch (error) {
    if (msg) msg.textContent = error.message;
    if (button) button.disabled = false;
  }
}

    if (label.length < 2 || !/^https:\/\/\S+$/i.test(link)) bad = 'Своей ссылке нужны надпись и адрес, который начинается с https://';
    else links.push({ kind: 'own', label: label, link: link });
  });
  mineState.ownDrafts = drafts.length ? drafts : [{ label: '', link: '' }];
  if (bad) return { error: bad, links: links };
  return links;
}

function addMineGood(){
  const msg = document.getElementById('minemsg');
  const name = String((document.getElementById('mineName') || {}).value || '').replace(/\s+/g, ' ').trim();
  const price = String((document.getElementById('minePrice') || {}).value || '').replace(/\s+/g, ' ').trim();
  const link = String((document.getElementById('mineLink') || {}).value || '').trim();
  if (name.length < 2 || !/^https:\/\/\S+$/i.test(link)) {
    if (msg) msg.textContent = 'Нужны название и ссылка, которая начинается с https://';
    return;
  }
  if (mineEdit < 0 && mineGoods.length >= 40) {
    if (msg) msg.textContent = 'В списке уже 40 товаров.';
    return;
  }
  const section = String((document.getElementById('mineSection') || {}).value || '').replace(/\s+/g, ' ').trim().slice(0, 24);
  const row = { name: name, price: price, link: link };
  if (section) row.section = section;
  if (mineEdit >= 0 && mineGoods[mineEdit]) mineGoods[mineEdit] = row;
  else mineGoods.push(row);
  mineEdit = -1;
  const sheet = document.getElementById('mineSheet');
  if (sheet) sheet.value = '';

  const fresh = document.getElementById('minemsg');
  if (fresh) fresh.textContent = 'Товар в списке. Нажмите «Сохранить каталог».';

function readMineFile(input){

  const reader = new FileReader();

  };

        delivery: !!mineState.delivery,

        hourDaysChosen: true,

  if (msg) msg.textContent = drop ? 'Возвращаю…' : 'Добавляю в чёрный список…';
  try {
    const response = await fetch('/api/vk/shop/block', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ peerId: Number(peerId), drop: !!drop })
    });
    const data = await response.json();
    if (!response.ok || !data.ok) throw new Error(data.error || 'Список не сохранился');
    if (msg) msg.textContent = drop ? 'Человек снова может писать боту.' : 'Бот больше не отвечает этому человеку в вашем сообществе.';
    loadMineClients();
  } catch (error) {
    if (msg) msg.textContent = error.message || 'Список не сохранился';
  }
}
async function sendMineMail(){
  const msg = document.getElementById('minemsg');
  const button = document.getElementById('mineMailSend');
  const text = String((document.getElementById('mineMailText') || {}).value || '').trim();
  const links = [];
  [1, 2].forEach(function(index){
    const label = String((document.getElementById('mineMailLabel' + index) || {}).value || '').trim();
    const link = String((document.getElementById('mineMailLink' + index) || {}).value || '').trim();
    if (label || link) links.push({ label: label, link: link });
  });
  if (!text) {
    if (msg) msg.textContent = 'Напишите текст рассылки.';
    return;
  }
  if (button) button.disabled = true;
  if (msg) msg.textContent = 'Отправляю…';
  try {
    const response = await fetchT('/api/vk/shop/mail', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ text: text, links: links, offset: 0 })
    }, 40000);
    const data = await response.json();
    if (!response.ok || !data.ok) throw new Error(data.error || 'Рассылка не ушла');
    if (msg) msg.textContent = 'Ушло '+data.sent+' из '+data.total+'. Не согласившимся на новости не отправлялось.';
  } catch (error) {
    if (msg) msg.textContent = error.message || 'Рассылка не ушла';
    if (button) button.disabled = false;
  }
}

async function scanMine(){
  const button = document.getElementById('mineScan');
  const msg = document.getElementById('minemsg');
  if (button) button.disabled = true;
  mineFound = [];
  paintMineFound();
  let phase = 'card';
  let offset = 0;
  let guard = 0;
  mineSetup = null;
  try {
    while (phase && guard < 48) {
      guard += 1;
      const response = await fetchT('/api/vk/shop/scan', {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ phase: phase, offset: offset })
      }, 22000);
      const data = await response.json();
      if (!response.ok || !data.ok) throw new Error(data.error || 'Сканирование остановилось');
      const lines = Array.isArray(data.readings) && data.readings.length ? data.readings : [data.reading || 'Смотрю сообщество'];
      if (button) button.textContent = String(lines[lines.length - 1] || 'Смотрю сообщество');
      await waitMine(120);
      if (data.setup && data.setup.kind) mineSetup = data.setup;
      (Array.isArray(data.items) ? data.items : []).forEach(function(item){
        if (!item || mineFound.length >= 200) return;
        const key = (item.kind === 'product' || item.kind === 'service')
          ? String(item.kind)+'|'+String(item.title || '')+'|'+String(item.link || '')
          : String(item.kind || '')+'|'+(item.link || item.title || '');
        if (mineFound.some(function(row){ return row.key === key; })) return;
        const useful = item.pick === false ? false : item.kind === 'product' || item.kind === 'service' || item.kind === 'contact' || item.kind === 'address' || item.kind === 'site' || item.kind === 'about';
        mineFound.push({
          key: key,
          on: useful,
          kind: item.kind || '',
          title: String(item.title || ''),
          text: String(item.text || ''),
          link: String(item.link || ''),
          price: String(item.price || '')
        });
      });
      paintMineFound();
      if (data.done) break;
      phase = data.phase || '';
      offset = Number(data.offset) || 0;
    }
    if (button) button.textContent = 'Сканировать ещё раз';
    if (msg) msg.textContent = mineFound.length
      ? 'Отметьте, что забрать, и нажмите «Сохранить отмеченное».'
      : 'Ключ просмотрел карточку, альбомы, документы, видео, истории, адреса, обсуждения, витрину и записи. Товаров и телефонов не нашлось.';
  } catch (error) {
    if (button) button.textContent = 'Сканировать сообщество';
    if (msg) msg.textContent = error.message || 'Сканирование остановилось';
  }
  if (button) button.disabled = false;
}
function paintMineFound(){
  const box = document.getElementById('mineFound');
  if (!box) return;
  if (!mineFound.length) {
    box.innerHTML = '';
    return;
  }
  const groups = [
    ['В каталог', function(item){ return item.kind === 'product' || item.kind === 'service'; }],
    ['В контакты', function(item){ return item.kind === 'contact' || item.kind === 'address' || item.kind === 'site'; }],
    ['В приветствие', function(item){ return item.kind === 'about'; }],
    ['Не добавлять', function(item){ return item.kind !== 'product' && item.kind !== 'service' && item.kind !== 'contact' && item.kind !== 'address' && item.kind !== 'site' && item.kind !== 'about'; }]
  ];
  box.innerHTML = groups.map(function(group){
    const rows = mineFound.map(function(item, index){ return { item: item, index: index }; }).filter(function(row){ return group[1](row.item); });
    if (!rows.length) return '';
    return '<p class="now">'+group[0]+'</p>'+rows.map(function(row){
      const item = row.item;
      const extra = item.price ? ' — '+esc(item.price) : '';
      const more = item.link ? '<br>'+esc(item.link) : (item.text ? '<br>'+esc(item.text) : '');
      return '<label class="hint"><input type="checkbox" data-scan-on="'+row.index+'"'+(item.on ? ' checked' : '')+'> '+esc(item.title || 'Запись')+extra+more+'</label>';
    }).join('<br>');
  }).join('')+'<button class="btn" id="mineTake" type="button" style="margin-top:8px">Сохранить отмеченное</button>';
  box.querySelectorAll('[data-scan-on]').forEach(function(input){
    input.onchange = function(){
      mineFound[Number(input.getAttribute('data-scan-on'))].on = input.checked;
    };
  });
  const take = document.getElementById('mineTake');
  if (take) take.onclick = takeMineScan;
}
async function takeMineScan(){
  const note = document.getElementById('mineTakeNote');
  const button = document.getElementById('mineTake');
  if (button) button.disabled = true;
  if (note) note.textContent = 'Раскладываю…';
  try {
    const response = await fetch('/api/vk/shop/place', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ items: mineFound.filter(function(item){ return item.on; }) })
    });
    const data = await response.json();
    if (!response.ok || !data.ok) throw new Error(data.error || 'Отмеченное не разобралось');
    mineState.contacts = data.contacts || '';
    mineState.greeting = data.greeting || '';
    if (Array.isArray(data.goods)) mineGoods = data.goods;
    if (mineGoods.length) mineState.catalog = true;
    if (String(mineState.contacts || '').trim()) mineState.contactsOn = true;
    if (mineGoods.length || mineState.contacts) {
      mineState.order = true;
      mineState.admin = true;
    }
    if (!mineState.kind && mineSetup && mineSetup.kind) {
      const preset = minePreset(mineSetup.kind);
      mineState.kind = mineSetup.kind;
      mineState.delivery = preset.delivery;
      mineState.pickup = preset.pickup;
      mineState.baker = preset.baker;
      if (preset.catalog === 'Каталог') delete mineState.names.catalog;
      else mineState.names.catalog = preset.catalog;
      if (preset.order === 'Заявка') delete mineState.names.order;
      else mineState.names.order = preset.order;
    }
    mineView = 'home';
    const saved = await saveMine();
    const added = data.added || {};
    const parts = [];
    if (added.goods) parts.push('каталог: '+added.goods);
    if (added.contacts) parts.push('контакты: '+added.contacts);
    if (added.about) parts.push('приветствие');
    const fresh = document.getElementById('minemsg');
    if (fresh) fresh.textContent = !saved
      ? (fresh.textContent || 'Не сохранилось.')
      : (parts.length ? 'Сохранено. '+parts.join(', ')+'. Откройте раздел: там уже лежит эта информация, её можно поправить.' : 'Сохранено. Откройте раздел и поправьте, если нужно.');
  } catch (error) {
    if (note) note.textContent = error.message || 'Отмеченное не разобралось';
  }
  if (button) button.disabled = false;
}

function modelPicker(cur){
  const groups = (cfg&&cfg.groups)||{};
  const used = {};
  let html = '<label class="now" for="genmodel">Модель</label><select id="genmodel">';
  Object.keys(groups).forEach(function(g){
    const list = ((cfg&&cfg.models)||[]).filter(function(item){ return item.group===g; }).slice().sort(function(a,b){ return (a.from||0)-(b.from||0); });
    if (!list.length) return;
    html += '<optgroup label="'+esc(groups[g])+'">';
    list.forEach(function(item){
      used[item.key] = 1;
      html += '<option value="'+esc(item.key)+'"'+(item.key===cur?' selected':'')+'>'+esc(item.name)+' · '+esc(costLabel(item))+'</option>';
    });
    html += '</optgroup>';
  });
  const rest = ((cfg&&cfg.models)||[]).filter(function(item){ return !used[item.key]; });
  if (rest.length) {
    html += '<optgroup label="Другие">';
    rest.forEach(function(item){
      html += '<option value="'+esc(item.key)+'"'+(item.key===cur?' selected':'')+'>'+esc(item.name)+' · '+esc(costLabel(item))+'</option>';
    });
    html += '</optgroup>';
  }
  const current = modelOf(cur);
  if (cur && !used[cur] && !rest.some(function(item){ return item.key===cur; })) {
    html += '<option value="'+esc(cur)+'" selected>'+esc(current?current.name:cur)+'</option>';
  }
  return html+'</select>';
}

function viewTpl(){

  }

    return '<div class="card"><div class="empty">Шаблон не найден</div></div>';
  }
  if (pendingTpl && templates.length) return '<div class="card"><div class="empty">Шаблон не найден</div></div>';
  if (!templatesReady && !templates.length) {
    return '<div class="card"><div class="empty">'+(templatesFailed?'Шаблоны не загрузились.':'Открываю шаблоны…')+'</div>'+(templatesFailed?'<button class="btn" type="button" id="retryTpl">Повторить</button>':'')+'</div>';
  }
  const q = tplQuery.trim().toLowerCase();
  const have = {};
  templates.forEach(t=>{ have[t.category||'image'] = 1; });
  const kinds = [['','Все'],['image','Картинки'],['video','Видео']];
  if (have.chat) kinds.push(['chat','Текст']);
  if (have.audio) kinds.push(['audio','Голос']);
  if (have.fix) kinds.push(['fix','Улучшение']);
  const topicHave = {};
  templates.forEach(t=>tplTopics(t).forEach(c=>{ topicHave[c] = 1; }));
  const topics = Object.keys(topicHave);
  const list = templates.filter(t=>{
    const cat = t.category || 'image';
    if (tplKind === 'image' && cat !== 'image' && cat !== 'fix') return false;
    if (tplKind && tplKind !== 'image' && cat !== tplKind) return false;
    if (tplTopic && tplTopics(t).indexOf(tplTopic) < 0) return false;
    if (!q) return true;
    return (t.title+' '+(t.desc||'')+' '+tplTopics(t).join(' ')).toLowerCase().indexOf(q) >= 0;
  });
  const kindRow = '<div class="tkinds">'+kinds.map(function(pair){
    return '<button type="button" data-tkind="'+pair[0]+'" class="'+(tplKind===pair[0]?'on':'')+'">'+pair[1]+'</button>';
  }).join('')+'</div>';
  const topicRow = topicPicker(topics);
  const kindName = tplKind === 'video' ? 'видео' : tplKind === 'image' ? 'картинки' : tplKind === 'chat' ? 'текст' : tplKind === 'audio' ? 'голос' : tplKind === 'fix' ? 'улучшение' : 'все';
  const cards = list.length ? list.map(t=>{

      ? '<div class="tph">'+badge+'<img src="'+esc(src)+'" alt=""></div>'
      : '<div class="tph'+(cat==='chat'?' txt':'')+'">'+badge+'<span>'+mark+'</span></div>';
    const href = tplShareLink(t);
    const link = href ? '<div class="tlink"><span>'+esc(href)+'</span><button type="button" data-copylink="'+esc(href)+'">Копировать</button></div>' : '';
    return '<div class="tcard"><button class="titem" data-tpl="'+esc(t.id)+'">'+face+
      '<div class="tcap"><b>'+esc(t.title)+'</b><em>'+(t.cost||0)+' кр.</em></div></button>'+link+'</div>';
  }).join('') : '<div class="empty">Пока здесь пусто</div>';
  return '<input class="tsearch" id="tq" placeholder="Найти шаблон" value="'+esc(tplQuery)+'">'+
    kindRow+topicRow+
    '<div class="ttitle">Шаблоны · '+kindName+(tplTopic?' · '+esc(tplTopic):'')+' ('+list.length+')</div>'+
    '<div class="tgallery">'+cards+'</div>';

function ensureWorks(force){
  if (worksLoading) return;
  if (works && !force && !worksFailed) return;
  worksLoading = true;
  worksFailed = false;
  fetchT('/api/works', {headers: authHeaders()}, 18000)
    .then(function(r){ if (!r.ok) throw new Error(); return r.json(); })
    .then(function(d){ works = (d && d.works) || []; worksFailed = false; })
    .catch(function(){ if (!works) works = []; worksFailed = true; })
    .finally(function(){ worksLoading = false; if (tab==='hist') draw(); });
}

function renderResult(r){
  if (r.error) return '<p class="err">'+esc(r.error)+'</p>';
  let html = '<div class="result"><p>'+esc(r.text||'Готово')+'</p>';
  if (r.media && r.type==='image') html += '<img src="'+r.media+'">';
  else if (r.media && r.type==='video') html += '<video src="'+r.media+'" controls></video>';
  else if (r.media && r.type==='audio') {
    html += '<audio src="'+r.media+'" controls></audio>';
    (r.more||[]).forEach(function(src){ html += '<audio src="'+src+'" controls></audio>'; });
  }
  if (r.cost != null) html += '<div class="meta">Списано '+r.cost+' · остаток '+r.balance+'</div>';
  html += '</div>';
  return html;
}
async function subscribeMail(on){
  const btn = document.getElementById('door-sub');
  const msg = document.getElementById('submsg');
  if (btn) btn.disabled = true;
  try {
    const r = await fetch('/api/vk/subscribe', { method:'POST', headers: authHeaders(), body: JSON.stringify({ on: on, group: vkGroupId() }) });
    const d = await r.json();
    if (!r.ok || !d.ok) throw new Error(d.error || 'Не удалось сохранить');
    if (me) me.mail = !!d.mail;
    if (msg) msg.textContent = d.mail ? 'Готово. Рассылка будет приходить в чат бота.' : 'Вы отписались от рассылки.';
    if (btn) { btn.textContent = d.mail ? 'Вы подписаны' : 'Подписаться'; btn.classList.toggle('on', !!d.mail); }
  } catch (e) {
    if (msg) msg.textContent = e.message;
  } finally {
    if (btn) btn.disabled = false;
  }
}

function onCoverFile(input){
  const key = input.getAttribute('data-cover');
  const file = input.files && input.files[0];
  const msg = document.getElementById('submsg');
  if (!file || !key) return;
  if (file.size > 6 * 1024 * 1024) {
    if (msg) msg.textContent = 'Картинка слишком большая.';
    return;
  }
  const reader = new FileReader();
  reader.onload = function(){
    const value = String(reader.result || '');
    if (!/^data:image\/(?:jpeg|jpg|png|webp);base64,[a-z0-9+/=\s]+$/i.test(value)) {
      if (msg) msg.textContent = 'Нужна картинка JPEG, PNG или WebP.';
      return;
    }
    widgetPics[key] = value;
    draw();
  };
  reader.readAsDataURL(file);
}

async function openVkTopup(){
  const msg = document.getElementById('vktopmsg');

    const r = await fetch('/api/vk/topup', {method:'POST', headers: authHeaders(), body: JSON.stringify({ group: vkGroupId() })});
    const d = await r.json();
    if (!r.ok || !d.url) { if (msg) msg.textContent = (d && d.error) || 'Чат не открылся. Нажмите «Пополнить» в диалоге.'; return; }
    if (msg) msg.textContent = 'В чате уже можно выбрать пакет.';
    openOut(d.url);
  } catch (e) {
    if (msg) msg.textContent = 'Чат не открылся. Нажмите «Пополнить» в диалоге.';
  } finally { if (btn) btn.disabled = false; }
}

  }
}
function workFileName(id, kind){
  const ext = kind==='video' ? 'mp4' : kind==='audio' ? 'mp3' : 'png';
  return 'neuroyaga-'+id+'.'+ext;
}
async function sendWorkToChat(id){
  const r = await fetch('/api/works/'+id+'/send', {method:'POST', headers: authHeaders(), body: JSON.stringify({ group: vkGroupId() })});
  const d = await r.json().catch(function(){ return {}; });
  if (!r.ok || !d.ok) throw new Error(d.error || 'Не удалось отправить файл');
}
function workUrl(id, name){
  return fileOrigin() + '/api/works/' + id + '?tk=' + encodeURIComponent(token||'') + '&dl=1&name=' + encodeURIComponent(name);
}
function insideFrame(){
  try { return window.parent && window.parent !== window; } catch (e) { return true; }
}
function askVkDownload(url, name){
  return new Promise(function(resolve){
    let done = false;
    function finish(ok){
      if (done) return;
      done = true;
      window.removeEventListener('message', onMsg);
      clearTimeout(timer);
      resolve(!!ok);
    }
    function onMsg(event){
      const hit = window.nySave && nySave.bridgeDownload(event.data);
      if (!hit) return;
      finish(hit.ok);
    }
    const timer = setTimeout(function(){ finish(false); }, 4000);
    window.addEventListener('message', onMsg);
    vkSend('VKWebAppDownloadFile', { url: url, filename: name });
  });
}
async function saveBlob(id, name){
  const r = await fetch('/api/works/'+id+'?dl=1&name='+encodeURIComponent(name), { headers: authHeaders() });
  if (!r.ok) throw new Error(r.status === 404 ? 'Файл не найден' : 'Не удалось скачать файл');
  const blob = await r.blob();
  if (!blob || !blob.size) throw new Error('Файл пустой');
  const href = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = href;
  link.download = name;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(function(){ URL.revokeObjectURL(href); }, 15000);
}
async function saveInBrowser(id, name){
  try {
    await saveBlob(id, name);
  } catch (e) {
    if (!isVk()) { alert(e.message || 'Не удалось скачать файл'); return; }
    try {
      await sendWorkToChat(id);
      alert('Файл отправлен в чат сообщества. Сохраните его оттуда.');
    } catch (err) {
      alert(err.message || e.message || 'Не удалось скачать файл');
    }
  }
}
async function downloadWork(id, kind){
  const name = workFileName(id, kind);
  const url = workUrl(id, name);
  const route = (window.nySave && nySave.saveRoute({ webApp: tg(), search: location.search })) || 'browser';
  if (route === 'telegram') {
    try {
      tg().downloadFile({ url: url, file_name: name }, function(ok){
        if (ok) return;
        saveInBrowser(id, name);
      });
      return;
    } catch (e) {}
  }
  if (route === 'vk-app') {
    const ok = await askVkDownload(url, name);
    if (ok) return;
    try {
      await sendWorkToChat(id);
      alert('Файл отправлен в чат сообщества. Сохраните его оттуда.');
    } catch (e) {
      alert(e.message || 'Не удалось скачать файл');
    }
    return;
  }
  if (route === 'vk-web' && insideFrame()) {
    vkSend('VKWebAppOpenLink', { url: url });
    return;
  }
  await saveInBrowser(id, name);
}
async function shareVkLink(url){
  const value = String(url || '');
  if (!value) return;
  if (window.vkBridge && vkBridge.send) {
    try { await vkBridge.send('VKWebAppShare', { link: value }); }
    catch (e) {}
    return;
  }
  await copyTemplateLink(value);
}
async function copyTemplateLink(url){
  const value = String(url || '');
  if (!value) return;
  try { await navigator.clipboard.writeText(value); alert('Ссылка скопирована'); }
  catch (e) { prompt('Ссылка на шаблон', value); }
}
async function shareTemplate(id){
  try {
    const r = await fetch('/api/templates/'+encodeURIComponent(id)+'/link', {headers: authHeaders()});
    const d = await r.json().catch(function(){ return {}; });
    if (!r.ok || !d.url) throw new Error(d.error || 'Не удалось собрать ссылку');
    if (isVk() || inVkApp()) { await shareVkLink(vkAppTplLink(id) || d.url); return; }
    const shareUrl = 'https://t.me/share/url?url='+encodeURIComponent(d.url)+'&text='+encodeURIComponent('Шаблон «'+(d.title||'НейроЯга')+'»');
    const w = tg();
    if (w && w.openTelegramLink) w.openTelegramLink(shareUrl);
    else window.open(shareUrl, '_blank');
  } catch (e) { alert(e.message); }
}

function fileToJpeg(file){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 2048;
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * scale));
      const h = Math.max(1, Math.round(img.height * scale));
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg', 0.92));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Не удалось прочитать фото')); };
    img.src = url;
  });
}

function readFileData(file){
  return new Promise(function(resolve, reject){
    const reader = new FileReader();
    reader.onload = function(){ resolve(String(reader.result || '')); };
    reader.onerror = function(){ reject(new Error('Не удалось прочитать голосовое')); };
    reader.readAsDataURL(file);
  });
}
function voiceLength(file){
  return new Promise(function(resolve){
    const url = URL.createObjectURL(file);
    const audio = document.createElement('audio');
    audio.preload = 'metadata';
    audio.onloadedmetadata = function(){
      const seconds = Math.ceil(audio.duration);
      URL.revokeObjectURL(url);
      resolve(Number.isFinite(seconds) && seconds > 0 ? seconds : 0);
    };
    audio.onerror = function(){ URL.revokeObjectURL(url); resolve(0); };
    audio.src = url;
  });
}

function videoWaitLine(elapsed) {
  if (elapsed < 20000) return 'В очереди.';
  if (elapsed < 90000) return 'Собираю ролик. Это занимает несколько минут.';
  return 'Почти готово.';
}
let videoWaitTimer = null;
let videoWaitGen = 0;
function stopVideoWait() {
  videoWaitGen += 1;
  if (videoWaitTimer) clearInterval(videoWaitTimer);
  videoWaitTimer = null;
}
function beginVideoWait(apply) {
  stopVideoWait();
  const gen = videoWaitGen;
  const started = Date.now();
  let shown = '';
  function tick() {
    if (gen !== videoWaitGen) return;
    const next = videoWaitLine(Date.now() - started);
    if (next === shown) return;
    shown = next;
    apply(next);
  }
  tick();
  videoWaitTimer = setInterval(tick, 8000);
}

    return '<div class="pack"><div style="flex:1"><b>Промокод 15%</b><div class="meta">'+esc(item.title)+'</div></div><button type="button" data-promo-buy="'+Number(item.id)+'">'+item.price+' б.</button></div>';
  }).join('');
  const bought = (promos.bought||[]).map(function(item){
    return '<p class="now">'+esc(item.code)+' · '+esc(item.title)+(item.status==='open'?'':' · использован')+'</p>';
  }).join('');
  const own = mine ? '<p class="now">'+esc(mine.code)+' · '+esc(mine.title)+(mine.status==='open' && mine.usesLeft>0?'':' · использован')+'</p>' : '';
  const promoBlock = own+bought+offers+sale;
  return '<div class="card shophello"><div class="kicker">Магазин бонусов</div><div class="cabbal">'+(Number(d.bonuses)||0)+'</div><p class="now">Баллы закрытых месяцев. 10 бонусов = 1 кредит.</p></div>'+
    (shopNote ? '<p class="now">'+esc(shopNote)+'</p>' : '')+
    '<div class="groupttl">Промокод</div><div class="card">'+(promoBlock || '<p class="empty">Промокодов сейчас нет.</p>')+'</div>'+
    '<div class="groupttl">Товары</div><div class="card">'+goods+'</div>'+
    '<div class="groupttl">Кредиты</div><div class="card"><div class="pack"><input id="shop-amount" type="number" min="10" step="10" placeholder="Сколько бонусов" style="flex:1;background:#1c1233;border:1px solid var(--line);border-radius:10px;padding:8px"><button type="button" id="shop-credit">Обменять</button></div><p class="now">Заявка ждёт подтверждения.</p></div>'+
    '<div class="groupttl">Прошлые призёры</div><div class="card">'+honor+'</div>';
}
function bindShop(){
  document.querySelectorAll('[data-buy]').forEach(function(button){
    button.onclick = function(){ buyShop(button.dataset.buy); };
  });
  document.querySelectorAll('[data-promo]').forEach(function(button){
    button.onclick = function(){ buyPromo(button.dataset.promo); };
  });
  document.querySelectorAll('[data-promo-buy]').forEach(function(button){
    button.onclick = function(){ buyListedPromo(button.dataset.promoBuy); };
  });
  const credit = document.getElementById('shop-credit');
  if (credit) credit.onclick = askShopCredits;
  const fromRate = document.getElementById('rate-shop');
  if (fromRate) fromRate.onclick = function(){ tab = 'shop'; wantMenu = false; draw(); };
}
async function loadShop(){
  const box = document.getElementById('shopbox');
  if (!box) return;
  try {
    const r = await fetchT('/api/shop?group='+encodeURIComponent(vkGroupId()), { headers: authHeaders() }, 18000);
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Не удалось открыть магазин');
    const live = document.getElementById('shopbox');
    if (live) live.innerHTML = renderShop(d);
    bindShop();
  } catch (e) {
    const live = document.getElementById('shopbox');
    if (live) live.innerHTML = '<div class="card"><p class="err">'+esc(netError(e))+'</p><button class="btn" type="button" onclick="loadShop()">Повторить</button></div>';
  }
}
async function buyPromo(packageId){
  shopNote = 'Оформляю промокод…';
  try {
    const r = await fetch('/api/shop/promo', { method:'POST', headers: authHeaders(), body: JSON.stringify({ group: vkGroupId(), packageId: packageId }) });
    const d = await r.json();
    shopNote = d.ok ? ('Промокод '+(d.code||'')+'. Напишите его при оплате пакета.'+(d.bonuses?(' Списано '+d.bonuses+' б.'):'')) : (d.error || 'Промокод не оформился.');
  } catch (e) { shopNote = e.message || 'Промокод не оформился.'; }
  loadShop();
}
async function buyListedPromo(id){
  shopNote = 'Оформляю промокод…';
  try {
    const r = await fetch('/api/shop/promo-buy', { method:'POST', headers: authHeaders(), body: JSON.stringify({ group: vkGroupId(), id: Number(id) }) });
    const d = await r.json();
    shopNote = d.ok ? ('Промокод '+(d.code||'')+'. Напишите его при оплате пакета.'+(d.bonuses?(' Списано '+d.bonuses+' б.'):'')) : (d.error || 'Промокод не оформился.');
  } catch (e) { shopNote = e.message || 'Промокод не оформился.'; }
  loadShop();
}
async function buyShop(id){
  shopNote = 'Оформляю…';
  try {
    const r = await fetch('/api/shop/buy', { method:'POST', headers: authHeaders(), body: JSON.stringify({ group: vkGroupId(), itemId: Number(id) }) });
    const d = await r.json();
    shopNote = d.ok ? ('Заказ принят: '+(d.title||'товар')+'. Списано '+(d.bonuses||0)+' б.') : (d.error || 'Заказ не оформился.');
  } catch (e) { shopNote = e.message || 'Заказ не оформился.'; }
  loadShop();
}
async function askShopCredits(){
  const input = document.getElementById('shop-amount');
  const amount = Math.round(Number(input && input.value));
  if (!amount) { shopNote = 'Напишите, сколько бонусов обменять.'; loadShop(); return; }
  shopNote = 'Отправляю заявку…';
  try {
    const r = await fetch('/api/shop/credits', { method:'POST', headers: authHeaders(), body: JSON.stringify({ group: vkGroupId(), bonuses: amount }) });
    const d = await r.json();
    shopNote = d.ok ? ('Заявка на '+(d.credits||0)+' кр. принята. Списано '+(d.spend||0)+' б.') : (d.error || 'Заявка не оформилась.');
  } catch (e) { shopNote = e.message || 'Заявка не оформилась.'; }
  loadShop();
}
async function loadRating(){
  const box = document.getElementById('ratebox');
  if (!box) return;
  try {
    const gid = vkGroupId();
    const r = await fetchT('/api/rating' + (gid ? '?group=' + encodeURIComponent(gid) : ''), { headers: authHeaders() }, 18000);
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Не удалось открыть рейтинг');
    if (document.getElementById('ratebox')) document.getElementById('ratebox').innerHTML = renderRating(d);
    bindShop();
  } catch (e) {
    const live = document.getElementById('ratebox');
    if (live) live.innerHTML = '<div class="card"><p class="err">'+esc(netError(e))+'</p><button class="btn" type="button" onclick="loadRating()">Повторить</button></div>';
  }
}
document.getElementById('tabs').onclick = function(e){
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.t!=='tpl') { openTpl=null; photoData=null; }
  tab = b.dataset.t;
  draw();
  if (tab === 'tpl' && !templatesReady) loadTemplates().then(function(){ if (tab==='tpl') { openSharedTpl(pendingTpl, false); draw(); } });
  if ((tab === 'gen' || tab === 'models' || tab === 'top') && !cfgReady) loadConfig().then(function(){ if (tab===b.dataset.t) draw(); });
};
const w = tg(); if (w){ try{ w.ready(); w.expand(); }catch(e){} }
detectAuth();
(async function boot(){ draw(); await load(); })();
setTimeout(function(){
  if (userId || !window.__nyApi) return;
  adoptVkUser().then(function(){ if (userId) load(); else draw(); });
}, 4000);
let tries=0;
(function retry(){ if (!userId && tries<20){ tries++; detectAuth(); if (userId){ load(); return; } setTimeout(retry,250); } })();
