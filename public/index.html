<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>НейроЯга</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Unbounded:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0614;--card:#140c24;--text:#f3efff;--mut:#a79cc4;--line:rgba(255,255,255,.1);--grad:linear-gradient(135deg,#00ffe0,#b366ff 55%,#ff2d95)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Manrope,system-ui,sans-serif;min-height:100%}
button,textarea{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;padding:12px 12px 24px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.logo{font-family:Unbounded,sans-serif;font-weight:700;font-size:18px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;flex:1}
.bal{font-weight:800;border:1px solid var(--line);border-radius:12px;padding:6px 10px}
.site{text-decoration:none;color:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-size:13px}
.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:#120a20;color:var(--mut);border-radius:12px;padding:8px 12px;font-weight:700}
.tabs button.on{background:var(--grad);color:#fff;border-color:transparent}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
textarea{width:100%;min-height:110px;border-radius:14px;border:1px solid var(--line);background:#1c1233;padding:12px;outline:none;resize:vertical}
.btn{width:100%;border:0;border-radius:14px;padding:14px;font-weight:800;color:#fff;background:var(--grad);margin-top:10px}
.btn:disabled{opacity:.5}
.now{color:var(--mut);font-size:13px;margin:8px 0}
.model{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:#1c1233;border:1px solid transparent;border-radius:14px;padding:12px;margin-bottom:8px}
.model.on{border-color:#b366ff;background:#24163d}
.name{font-weight:800}.meta{color:var(--mut);font-size:12px}.cost{font-weight:800;white-space:nowrap}
.result img,.result video,.result audio{max-width:100%;border-radius:12px;margin-top:10px}
.empty{color:var(--mut);text-align:center;padding:16px 0}
.err{color:#ff8fb0;font-weight:700}
.item{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.plus{color:#3ee08f;font-weight:800}.minus{color:#ff8be0;font-weight:800}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="logo">НейроЯга</div>
    <div class="bal" id="bal">—</div>
    <a class="site" href="https://babayagaland.ru" target="_blank">Сайт</a>
  </div>
  <div class="tabs" id="tabs">
    <button data-t="gen" class="on">Генерация</button>
    <button data-t="models">Модели</button>
    <button data-t="tpl">Шаблоны</button>
    <button data-t="hist">История</button>
  </div>
  <div id="view"></div>
</div>
<script>
const MODELS = [
  ['flash','Gemini Flash','Текст',4],
  ['flash_25','Gemini 2.5 Flash','Текст',4],
  ['pro','Gemini Pro','Текст',15],
  ['nanobanana','Nano Banana','Картинка',20],
  ['nanobanana_pro','Nano Banana Pro','Картинка',50],
  ['qwen-image-3-0','Qwen Image 3.0','Картинка',45],
  ['seedream-4-5','Seedream 4.5','Картинка',20],
  ['recraft-v4-1','Recraft V4.1','Картинка',20],
  ['runway-gen4-image','Runway Gen4','Картинка',80],
  ['qwen3-tts-flash','Озвучка','Голос',100]
];
const CAT = {chat:'Чат',image:'Картинки',video:'Видео',audio:'Голос'};
let tab='gen', me=null, templates=[], userId=null, busy=false, last=null;

function tg(){ return window.Telegram && window.Telegram.WebApp; }
function parseUser(raw){
  if (!raw) return null;
  try {
    const p = new URLSearchParams(raw);
    const u = JSON.parse(p.get('user') || 'null');
    if (u && u.id) return u.id;
  } catch(e){}
  return null;
}
function detectUser(){
  const w = tg();
  if (w && w.initDataUnsafe && w.initDataUnsafe.user && w.initDataUnsafe.user.id) return w.initDataUnsafe.user.id;
  if (w && w.initData) { const id = parseUser(w.initData); if (id) return id; }
  const hash = (location.hash||'').replace(/^#/,'');
  const hp = new URLSearchParams(hash);
  return parseUser(hp.get('tgWebAppData') || hash);
}
function nameOf(k){ const m = MODELS.find(x=>x[0]===k); return m ? m[1] : k; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&','<':'<','>':'>','"':'"'}[c])); }

async function load(){
  userId = detectUser();
  if (!userId) { draw(); return; }
  try {
    const r = await fetch('/api/me?userId='+encodeURIComponent(userId));
    me = await r.json();
    if (me.error) throw new Error(me.error);
  } catch(e){ me = {error:true, balance:0, history:[], current_model:'flash'}; }
  try {
    const t = await fetch('/api/templates');
    templates = (await t.json()).templates || [];
  } catch(e){ templates=[]; }
  document.getElementById('bal').textContent = (me.balance||0)+' кр';
  draw();
}
function draw(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on', b.dataset.t===tab));
  const box = document.getElementById('view');
  if (!userId) {
    box.innerHTML = '<div class="card"><p class="empty">Откройте приложение кнопкой «Кабинет» в боте. Ссылка из браузера аккаунт не передаёт.</p></div>';
    return;
  }
  if (me && me.blocked) { box.innerHTML = '<div class="card err">Аккаунт в чёрном списке.</div>'; return; }
  if (tab==='gen') box.innerHTML = gen();
  else if (tab==='models') box.innerHTML = models();
  else if (tab==='tpl') box.innerHTML = tpls();
  else box.innerHTML = hist();
  bind();
}
function gen(){
  const cur = (me&&me.current_model)||'flash';
  const res = last ? renderResult(last) : '';
  return '<div class="card"><div class="now">Модель: <b>'+esc(nameOf(cur))+'</b> · '+costOf(cur)+' кр</div>'+
    '<textarea id="prompt" placeholder="Что сгенерировать"></textarea>'+
    '<button class="btn" id="go">'+(busy?'Генерирую…':'Сгенерировать')+'</button>'+res+'</div>';
}
function costOf(k){ const m = MODELS.find(x=>x[0]===k); return m ? m[3] : 4; }
function models(){
  const cur = (me&&me.current_model)||'flash';
  return '<div class="card">'+MODELS.map(m=>'<button class="model'+(m[0]===cur?' on':'')+'" data-model="'+m[0]+'"><div><div class="name">'+(m[0]===cur?'✅ ':'')+esc(m[1])+'</div><div class="meta">'+esc(m[2])+'</div></div><div class="cost">'+m[3]+' кр</div></button>').join('')+'</div>';
}
function tpls(){
  if (!templates.length) return '<div class="card"><div class="empty">Шаблонов нет. Добавьте в админке /admin</div></div>';
  return '<div class="card">'+templates.map(t=>'<button class="model" data-tpl="'+t.id+'"><div><div class="name">'+esc(t.title)+'</div><div class="meta">'+(CAT[t.category]||t.category)+' · '+esc(nameOf(t.model))+'</div></div><div class="cost">'+t.cost+' кр</div></button>').join('')+'</div>';
}
function hist(){
  const rows = (me&&me.history)||[];
  if (!rows.length) return '<div class="card"><div class="empty">Операций нет</div></div>';
  return '<div class="card">'+rows.map(h=>{
    const sign = Number(h.delta)>=0;
    return '<div class="item"><div><b>'+esc(h.reason||'')+'</b><div class="meta">остаток '+(h.balance||0)+'</div></div><div class="'+(sign?'plus':'minus')+'">'+(sign?'+':'')+h.delta+'</div></div>';
  }).join('')+'</div>';
}
function renderResult(r){
  if (r.error) return '<p class="err">'+esc(r.error)+'</p>';
  let html = '<div class="result"><p>'+esc(r.text||'Готово')+'</p>';
  if (r.media && r.type==='image') html += '<img src="'+r.media+'">';
  else if (r.media && r.type==='video') html += '<video src="'+r.media+'" controls></video>';
  else if (r.media && r.type==='audio') html += '<audio src="'+r.media+'" controls></audio>';
  html += '<div class="meta">Списано '+r.cost+' · остаток '+r.balance+'</div></div>';
  return html;
}
function bind(){
  const go = document.getElementById('go');
  if (go) go.onclick = generate;
  document.querySelectorAll('[data-model]').forEach(b=>b.onclick=()=>setModel(b.dataset.model));
  document.querySelectorAll('[data-tpl]').forEach(b=>b.onclick=()=>useTpl(Number(b.dataset.tpl)));
}
async function setModel(model){
  if (me) me.current_model = model;
  draw();
  try { await fetch('/api/set-model',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:String(userId),model})}); } catch(e){}
}
function useTpl(id){
  const t = templates.find(x=>x.id===id);
  if (!t) return;
  if (me) me.current_model = t.model;
  tab = 'gen';
  draw();
  const p = document.getElementById('prompt');
  if (p) p.value = t.prompt;
}
async function generate(){
  if (busy) return;
  const prompt = (document.getElementById('prompt')||{}).value || '';
  if (!prompt.trim()) return;
  busy = true; last = null; draw();
  try {
    const r = await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:String(userId),prompt,model:me&&me.current_model})});
    const d = await r.json();
    if (!r.ok || d.error) throw new Error(d.error || 'Ошибка');
    last = d;
    if (me) me.balance = d.balance;
    document.getElementById('bal').textContent = d.balance+' кр';
  } catch(e){ last = {error:e.message}; }
  busy = false; draw();
  const p = document.getElementById('prompt');
  if (p) p.value = prompt;
}
document.getElementById('tabs').onclick = function(e){
  const b = e.target.closest('button'); if (!b) return;
  tab = b.dataset.t; draw();
};
const w = tg();
if (w) { try { w.ready(); w.expand(); } catch(e){} }
let tries = 0;
function boot(){ load(); if (!userId && tries<20){ tries++; setTimeout(boot, 250); } }
boot();
</script>
</body>
</html>
