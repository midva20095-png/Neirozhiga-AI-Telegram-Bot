<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>НейроЯга</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Unbounded:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0614;--card:#140c24;--text:#f3efff;--mut:#a79cc4;--line:rgba(255,255,255,.1);--grad:linear-gradient(135deg,#00ffe0,#b366ff 55%,#ff2d95)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Manrope,system-ui,sans-serif;min-height:100%}
button,textarea,input,select{font:inherit;color:inherit}
.app{max-width:620px;margin:0 auto;padding:12px 12px calc(84px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.logo{font-family:Unbounded,sans-serif;font-weight:700;font-size:18px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;flex:1}
.bal{font-weight:800;border:1px solid var(--line);border-radius:12px;padding:6px 10px;white-space:nowrap}
.site{text-decoration:none;color:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-size:13px}
.bots{margin:-2px 0 10px}
.bots .lbl{color:var(--mut);font-size:12px;font-weight:800;margin:0 2px 6px}
.bots .row{display:flex;gap:8px}
.bots a{flex:1;text-align:center;text-decoration:none;color:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 6px;font-weight:800;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
textarea{width:100%;min-height:120px;border-radius:14px;border:1px solid var(--line);background:#1c1233;padding:12px;outline:none;resize:vertical}
.btn{width:100%;border:0;border-radius:14px;padding:14px;font-weight:800;color:#fff;background:var(--grad);margin-top:10px}
a.btn{display:block;text-align:center;text-decoration:none}
.btn:disabled{opacity:.5}
.now{color:var(--mut);font-size:13px;margin:0 0 8px}
.now b{color:var(--text)}
.groupttl{font-weight:800;margin:4px 2px 8px;font-size:13px;color:var(--mut)}
.model{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:#1c1233;border:1px solid transparent;border-radius:14px;padding:12px;margin-bottom:8px}
.model.on{border-color:#b366ff;background:#24163d}
.name{font-weight:800}.meta{color:var(--mut);font-size:12px}.cost{font-weight:800;white-space:nowrap}
.cost.free{color:#3ee08f}
.result img,.result video,.result audio{max-width:100%;border-radius:12px;margin-top:10px}
.result .meta{margin-top:8px}
.empty{color:var(--mut);text-align:center;padding:16px 0}
.err{color:#ff8fb0;font-weight:700}
.item{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.plus{color:#3ee08f;font-weight:800}.minus{color:#ff8be0;font-weight:800}
.pack{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#1c1233;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.pack button{border:0;border-radius:10px;padding:8px 14px;font-weight:800;color:#fff;background:var(--grad)}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:4px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(11,6,20,.96);border-top:1px solid var(--line);backdrop-filter:blur(8px)}
.tabbar button{flex:1;border:0;background:transparent;color:var(--mut);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0}
.tabbar:has(#tabrate:not([style*="display:none"])){gap:2px;padding-left:6px;padding-right:6px;overflow-x:auto}
.tabbar:has(#tabrate:not([style*="display:none"])) button{min-width:52px;font-size:10px}
.rank{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.rank:last-child{border-bottom:0}
.rank .medal{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;background:#1c1233;flex:0 0 auto}
.rank .ava{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#24163d;flex:0 0 auto}
.rank .ava.letter{display:flex;align-items:center;justify-content:center;font-weight:800}
.rank.top1 .medal{background:#c9a227;color:#1a1204}
.rank.top2 .medal{background:#c5c9d6;color:#1a1204}
.rank.top3 .medal{background:#c47a4a;color:#1a1204}
.rank.me{background:rgba(179,102,255,.16);border-radius:14px;margin:4px 0;padding:10px}
.rank .who{min-width:0}
.rank .who b{display:block}
.rank .who span{color:var(--mut);font-size:12px}
.rank .pts{margin-left:auto;font-size:20px;font-weight:800;white-space:nowrap}
.rules{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}
.rules span{border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:12px;color:var(--mut)}
.tabbar button .ic{font-size:19px}
.tabbar button.on{color:#fff}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.hint{font-size:12px;color:var(--mut);margin-top:6px}
.tcard{display:flex;gap:10px;width:100%;text-align:left;background:#1c1233;border:1px solid transparent;border-radius:14px;padding:10px;margin-bottom:8px;align-items:center}
.tcard img,.thumb{width:64px;height:64px;object-fit:cover;border-radius:10px;background:#0b0614;flex:0 0 auto}
.preview{width:100%;max-height:320px;object-fit:cover;border-radius:14px;background:#0b0614}
.filebtn{display:block;text-align:center;border:1px dashed rgba(255,255,255,.25);border-radius:14px;padding:14px;margin-top:10px;font-weight:800;cursor:pointer}
.filebtn input{display:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips button{border:1px solid var(--line);background:#1c1233;border-radius:999px;padding:6px 10px;font-weight:700}
.chips button.on{border-color:#b366ff;color:#fff}
.back{position:relative;z-index:2;border:0;background:transparent;color:var(--mut);font-weight:800;padding:0 0 8px;min-height:36px}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tcats{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.tcats button{flex:0 0 auto;border:1px solid rgba(255,255,255,.16);background:transparent;color:var(--mut);border-radius:999px;padding:7px 12px;font-weight:700;font-size:13px}
.tcats button.on{color:#fff;border-color:#9d4dff;background:#24163d;box-shadow:0 0 14px rgba(157,77,255,.35)}
.tsearch{border-radius:999px;margin:0 0 10px;padding:12px 16px}
.tgallery{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.titem{position:relative;display:flex;flex-direction:column;padding:0;border:1px solid var(--line);background:#140c24;border-radius:18px;overflow:hidden;text-align:left}
.tph{position:relative;aspect-ratio:3/4;overflow:hidden;display:grid;place-items:center;font-size:40px;background:linear-gradient(150deg,#22164a,#0d2b3a)}
.tph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top}
.tph.txt{display:flex;flex-direction:column;gap:4px;background:radial-gradient(circle at 50% 35%,rgba(0,212,255,.22),transparent 60%),linear-gradient(160deg,#1c1240,#0f0a24)}
.tph small{position:static;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#bfefff}
.tcap{padding:10px 12px 12px}
.tcap b{display:block;font-size:14px;line-height:1.3;font-weight:600}
.tcap em{display:inline-block;margin-top:6px;font-style:normal;font-size:13px;font-weight:700;color:#00d4ff}
.thero{position:relative;z-index:1;margin:8px -14px 14px;height:min(52vh,420px);background:#07041a;overflow:hidden;border-radius:16px}
.thero img{display:block;width:100%;height:100%;object-fit:cover;object-position:center top}
.thero:after{content:'';position:absolute;left:0;right:0;bottom:0;height:80px;background:linear-gradient(transparent,#140c24)}
.tile{padding:0;border:1px solid var(--line);background:#1c1233;border-radius:16px;overflow:hidden;text-align:left}
.tile img,.tile video,.tile .ph{width:100%;height:148px;object-fit:cover;display:block;background:#0b0614}
.tile audio{width:100%;display:block;margin-top:8px}
.tile .cap{padding:8px 10px 10px}
.tile .cap b{display:block}
.tile .cap span{display:block;color:var(--mut);font-size:12px;font-weight:600}
.tile .dl,.tile .ch{display:block;width:100%;border:0;background:transparent;color:#00d4ff;font-weight:800;text-align:left;padding:0 10px 8px}
.tile .ch{color:#d7b0ff;padding-bottom:10px}
.btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.2)}
.banners{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.banner{position:relative;display:block;width:100%;padding:0;border:0;border-radius:18px;overflow:hidden;background:#140c24;cursor:pointer;transition:transform .18s ease}
.banner:active{transform:scale(.98)}
.banner img{display:block;width:100%;height:86px;object-fit:cover;object-position:left center}
.banner span{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:#fff;color:#111;border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px}
.sub{width:100%;margin-top:10px;min-height:52px;border:0;border-radius:16px;background:#1c1233;color:#fff;font-weight:800}
.sub.on{background:linear-gradient(135deg,#b366ff,#ff2d95)}
.setup{margin-top:14px}
input{width:100%;border-radius:14px;border:1px solid var(--line);background:#1c1233;padding:12px;outline:none;margin-top:8px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="logo">НейроЯга</div>
    <div class="bal" id="bal">—</div>
    <a class="site" id="site" href="#" target="_blank">Сайт</a>
  </div>
  <div class="bots">
    <div class="lbl">Ещё боты</div>
    <div class="row">
      <a href="https://vk.ru/write-236645486" data-out="https://vk.ru/write-236645486">Бот ВК</a>
      <a href="https://max.ru/se14387925_bot" data-out="https://max.ru/se14387925_bot">Бот Макс</a>
      <a href="https://babayagaland.ru" data-out="https://babayagaland.ru">Сайт</a>
    </div>
  </div>
  <div id="view"></div>
</div>
<div class="tabbar" id="tabs">
  <button data-t="menu" id="tabmenu" style="display:none"><span class="ic">⌂</span>Меню</button>
  <button data-t="gen" class="on"><span class="ic">✨</span>Генерация</button>
  <button data-t="models"><span class="ic">🤖</span>Модели</button>
  <button data-t="tpl"><span class="ic">📋</span>Шаблоны</button>
  <button data-t="hist"><span class="ic">🧾</span>История</button>
  <button data-t="top"><span class="ic">💳</span>Баланс</button>
  <button data-t="help"><span class="ic">💬</span>Помощь</button>
  <button data-t="rate" id="tabrate" style="display:none"><span class="ic">🏆</span>Рейтинг</button>
</div>
<script>
const KIND = {text:'Текст', image:'Картинка', video:'Видео', audio:'Музыка'};
let tab='gen', me=null, cfg=null, templates=[], works=null, worksLoading=false, userId=null, token=null, busy=false, last=null, wantMenu=false;
let openTpl=null, photoData=null, pickedFormat=null, genPhoto=null, draft='', pendingTpl='', pendingPkg='';
let tplCat='', tplQuery='';
const TCAT = {image:'Картинки', fix:'Улучшение', chat:'Текст', video:'Видео', audio:'Голос'};
const TMARK = {image:'🪄', fix:'✨', chat:'✍️', video:'🎬', audio:'🎙'};
let pickedQuality=null, pickedDuration=null, pickedAspect=null;
const widgetPics = { chat: '', rate: '', site: '' };
let showSetup = false;

function tg(){ return window.Telegram && window.Telegram.WebApp; }
function openOut(url){
  const w = tg();
  if (w && w.openLink) { w.openLink(url); return; }
  let framed = false;
  try { framed = parent && parent !== window; } catch (e) { framed = true; }
  if (framed) {
    try { parent.postMessage({ type: 'ny-open', url: url }, '*'); } catch (e) {}
  }
  window.open(url, '_blank', 'noopener');
}
function parseUser(raw){
  if (!raw) return null;
  try { const p = new URLSearchParams(raw); const u = JSON.parse(p.get('user')||'null'); if (u && u.id) return u.id; } catch(e){}
  return null;
}
function detectAuth(){
  const w = tg();
  if (w && w.initData) { initData = w.initData; }
  // подписанный токен из ссылки (#tk=...) — для открытия с обычной клавиатуры
  const hash = (location.hash||'').replace(/^#/,'');
  const hp = new URLSearchParams(hash);
  const sp = new URLSearchParams(location.search);
  if (hp.get('tk')) token = hp.get('tk');
  else if (sp.get('tk')) token = sp.get('tk');
  if (hp.get('tpl') || sp.get('tpl')) pendingTpl = hp.get('tpl') || sp.get('tpl');
  if (hp.get('pkg') || sp.get('pkg')) pendingPkg = hp.get('pkg') || sp.get('pkg');
  window.__vkPaid = hp.get('paid') === '1' || sp.get('paid') === '1';
  const goal = hash.split('&')[0].split('?')[0];
  window.__vkGoal = (goal === 'rate' || goal === 'site' || goal === 'sub') ? goal : '';
  if (sp.get('vk_user_id') && window.__vkGoal !== 'rate' && window.__vkGoal !== 'site') wantMenu = true;
  if (window.__vkGoal === 'rate') { wantMenu = false; tab = 'rate'; }
  if (w && w.initDataUnsafe && w.initDataUnsafe.user && w.initDataUnsafe.user.id) userId = w.initDataUnsafe.user.id;
  else if (w && w.initData) userId = parseUser(w.initData);
  else if (token) userId = token.split('.')[0];
}
let initData = '';
function authHeaders(){
  const h = {'Content-Type':'application/json'};
  if (initData) h['X-Telegram-Init-Data'] = initData;
  if (token) h['X-User-Token'] = token;
  return h;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function safeSrc(u){
  const s = String(u||'');
  if (/^https?:\/\//i.test(s)) return s;
  if (/^data:image\/(jpeg|jpg|png|webp);base64,/i.test(s) && s.length < 1600000) return s;
  return '';
}
function modelOf(k){ return (cfg&&cfg.models||[]).find(m=>m.key===k) || null; }
function nameOf(k){ const m = modelOf(k); return m ? m.name : k; }
function costLabel(m){ return (m && m.label) || (m && m.free ? 'бесплатно' : ((m && m.cost) || 0)+' кр'); }
function quote(m, o){
  o = o || {};
  if (!m || m.free) return 0;
  if (m.durationPrices){
    var d = String(o.duration || (m.durations && m.durations[0]) || '');
    if (m.durationPrices[d] != null) return Number(m.durationPrices[d]);
    var vals = Object.keys(m.durationPrices).map(function(k){ return Number(m.durationPrices[k]); });
    return Math.min.apply(null, vals);
  }
  var q = null;
  if (m.qualities && m.qualities.length){
    var id = o.quality || m.quality;
    q = m.qualities.filter(function(x){ return x.id === id; })[0] || m.qualities.filter(function(x){ return x.id === m.quality; })[0] || m.qualities[0];
  }
  if (q && q.perSec) return Math.round(q.cost * (Number(o.duration) || (m.durations && m.durations[0]) || 1));
  if (q) return q.cost;
  if (m.perSec) return Math.round((m.rate || m.cost) * (Number(o.duration) || (m.durations && m.durations[0]) || 1));
  if (m.unit === 'sec') return Math.round(m.rate || m.cost);
  return m.cost;
}
function syncPicks(m){
  if (!m) return;
  if (!m.qualities || !m.qualities.some(function(q){ return q.id === pickedQuality; })) pickedQuality = m.quality || (m.qualities && m.qualities[0] && m.qualities[0].id) || null;
  if (!m.durations || m.durations.indexOf(Number(pickedDuration)) < 0) pickedDuration = (m.durations && m.durations[0]) || null;
  if (!m.ratio) pickedAspect = null;
  else if (m.aspects && m.aspects.length && m.aspects.indexOf(pickedAspect) < 0) pickedAspect = m.aspects[0];
}
function chips(list, current, attr){
  return '<div class="chips">'+list.map(function(item){
    var id = item.id != null ? item.id : item;
    var name = item.name || item;
    var on = String(current) === String(id);
    return '<button type="button" data-'+attr+'="'+esc(id)+'" class="'+(on?'on':'')+'">'+esc(name)+'</button>';
  }).join('')+'</div>';
}

async function loadConfig(){
  try { cfg = await (await fetch('/api/config'+(isVk()?'?audience=vk':''))).json(); }
  catch(e){ cfg = {models:[],packages:[],groups:{}}; }
  const s = document.getElementById('site');
  if (cfg.site_url){ s.href = cfg.site_url; s.style.display=''; } else s.style.display='none';
}
async function adoptVkLaunch(){
  if (token) return;
  const sp = new URLSearchParams(location.search);
  if (!sp.get('sign') || !sp.get('vk_user_id')) return;
  try {
    const r = await fetch('/api/vk/session' + location.search);
    const d = await r.json();
    if (d && d.tk) {
      token = d.tk;
      userId = String(token).split('.')[0];
    } else if (d && d.error) window.__vkAuthError = d.error;
  } catch (e) {}
}
async function load(){
  await adoptVkLaunch();
  if (!userId) { draw(); return; }
  try {
    const r = await fetch('/api/me', {headers: authHeaders()});
    if (r.status === 401) { me = null; draw(); return; }
    if (r.status === 403) {
      const d = await r.json().catch(function(){ return {}; });
      me = { channel: d.channel || 'https://t.me/neuroyaga_AI' };
      draw();
      return;
    }
    me = await r.json();
    if (me.error) throw new Error(me.error);
  } catch(e){ me = {error:true, balance:0, history:[], current_model:(cfg&&cfg.default_model)||'flash'}; }
  await loadConfig();
  try { templates = ((await (await fetch('/api/templates'+(isVk()?'?audience=vk':''))).json()).templates)||[]; } catch(e){ templates=[]; }
  if (pendingTpl && templates.some(function(t){ return String(t.id)===String(pendingTpl); })) {
    tab = 'tpl';
    openTpl = pendingTpl;
    pendingTpl = '';
  }
  if (pendingPkg) tab = 'top';
  document.getElementById('bal').textContent = (me.balance||0)+' кр';
  const rateTab = document.getElementById('tabrate');
  const menuTab = document.getElementById('tabmenu');
  if (rateTab) rateTab.style.display = isVk() ? '' : 'none';
  if (menuTab) menuTab.style.display = isVk() ? '' : 'none';
  const bots = document.querySelector('.bots');
  if (bots) bots.style.display = isVk() ? 'none' : '';
  if (!isVk() && (tab==='rate' || tab==='menu')) tab = 'gen';
  if (isVk() && wantMenu) tab = 'menu';
  if (window.__vkGoal === 'rate') tab = 'rate';
  draw();
  if (window.__vkGoal === 'site') openOut((cfg && cfg.site_url) || 'https://babayagaland.ru');
  if (window.__vkGoal === 'sub' && me && me.user_id && !me.mail) subscribeMail(true);
}
function draw(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on', b.dataset.t===tab));
  const box = document.getElementById('view');
  if (!userId || (me && !me.user_id && me.error!==true && !me.balance)) {
    box.innerHTML = '<div class="card"><p class="empty">Откройте кабинет из чата бота или из сообщества.</p></div>';
    return;
  }
  if (me && me.channel) {
    box.innerHTML = '<div class="card"><p>Чтобы пользоваться ботом, подпишитесь на канал НейроЯга.</p><a class="btn" href="'+esc(me.channel)+'" target="_blank" rel="noopener">Подписаться</a><p class="empty">После подписки нажмите «Я подписался» в чате бота и откройте кабинет снова.</p></div>';
    return;
  }
  if (me && me.blocked) { box.innerHTML = '<div class="card err">Аккаунт в чёрном списке.</div>'; return; }
  if (tab==='menu') box.innerHTML = viewMenu();
  else if (tab==='gen') box.innerHTML = viewGen();
  else if (tab==='models') box.innerHTML = viewModels();
  else if (tab==='tpl') box.innerHTML = viewTpl();
  else if (tab==='hist') box.innerHTML = viewHist();
  else if (tab==='top') box.innerHTML = viewTop();
  else if (tab==='rate') { box.innerHTML = '<div class="card" id="ratebox"><p>Считаю баллы…</p></div>'; loadRating(); }
  else box.innerHTML = viewHelp();
  bind();
}
function vkAdmin(){
  const role = new URLSearchParams(location.search).get('vk_viewer_group_role') || '';
  return role === 'admin' || role === 'editor';
}
function askCommunityToken(){
  return new Promise(function(resolve, reject){
    const timer = setTimeout(function(){
      window.removeEventListener('message', onMsg);
      reject(new Error('ВК не открыл разрешение. Откройте приложение из сообщества.'));
    }, 20000);
    function onMsg(event){
      const data = event.data || {};
      if (data.type === 'ny-community-token' && data.token) {
        clearTimeout(timer);
        window.removeEventListener('message', onMsg);
        resolve(data.token);
      }
      if (data.type === 'ny-community-token-fail') {
        clearTimeout(timer);
        window.removeEventListener('message', onMsg);
        reject(new Error('Разрешите кнопки сообщества в окне ВК.'));
      }

function onCoverFile(input){
  const key = input.getAttribute('data-cover');
  const file = input.files && input.files[0];
  const msg = document.getElementById('submsg');
  if (!file || !key) return;
  if (file.size > 6 * 1024 * 1024) {
    if (msg) msg.textContent = 'Картинка слишком большая.';
    return;
  }
  const reader = new FileReader();
  reader.onload = function(){
    const value = String(reader.result || '');
    if (!/^data:image\/(?:jpeg|jpg|png|webp);base64,[a-z0-9+/=\s]+$/i.test(value)) {
      if (msg) msg.textContent = 'Нужна картинка JPEG, PNG или WebP.';
      return;
    }
    widgetPics[key] = value;
    draw();
  };
  reader.readAsDataURL(file);
}

  if (site) site.onclick = function(){ openOut((cfg && cfg.site_url) || 'https://babayagaland.ru'); };
  const sub = document.getElementById('door-sub');
  if (sub) sub.onclick = toggleMail;
  const promptBox = document.getElementById('prompt');
  if (promptBox) promptBox.addEventListener('input', function(){ draft = promptBox.value; });
  const go = document.getElementById('go'); if (go) go.onclick = generate;
  document.querySelectorAll('[data-q]').forEach(b=>b.onclick=function(){ draft=(document.getElementById('prompt')||{}).value||draft; pickedQuality=b.dataset.q; draw(); });
  document.querySelectorAll('[data-dur]').forEach(b=>b.onclick=function(){ draft=(document.getElementById('prompt')||{}).value||draft; pickedDuration=Number(b.dataset.dur); draw(); });
  document.querySelectorAll('[data-asp]').forEach(b=>b.onclick=function(){ draft=(document.getElementById('prompt')||{}).value||draft; pickedAspect=b.dataset.asp; draw(); });
  const genfile=document.getElementById('genfile'); if (genfile) genfile.onchange=function(){ onGenPhoto(genfile); };
  document.querySelectorAll('[data-model]').forEach(b=>b.onclick=()=>setModel(b.dataset.model));
  document.querySelectorAll('[data-tpl]').forEach(b=>b.onclick=()=>useTpl(b.dataset.tpl));
  document.querySelectorAll('[data-tcat]').forEach(b=>b.onclick=()=>{ tplCat=b.dataset.tcat||''; draw(); });
  const tq = document.getElementById('tq');
  if (tq) tq.oninput = function(){ tplQuery = tq.value; const pos = tq.selectionStart; draw(); const again = document.getElementById('tq'); if (again){ again.focus(); try{ again.setSelectionRange(pos, pos); }catch(e){} } };
  document.querySelectorAll('[data-fmt]').forEach(b=>b.onclick=()=>{ pickedFormat=b.dataset.fmt; draw(); });
  document.querySelectorAll('[data-pkg]').forEach(b=>b.onclick=()=>buy(b.dataset.pkg));
  const paymail = document.getElementById('paymail');
  if (paymail && pendingPkg) paymail.focus();
  const back=document.getElementById('back'); if (back) back.onclick=()=>{ openTpl=null; photoData=null; last=null; draw(); };
  const file=document.getElementById('file'); if (file) file.onchange=()=>onPhoto(file);
  const goTpl=document.getElementById('goTpl'); if (goTpl) goTpl.onclick=generateTemplate;
  const goTop=document.getElementById('goTop'); if (goTop) goTop.onclick=function(){ tab='top'; last=null; draw(); };
  const shareTpl=document.getElementById('shareTpl'); if (shareTpl) shareTpl.onclick=function(){ shareTemplate(openTpl); };
  document.querySelectorAll('[data-out]').forEach(function(el){ el.onclick = function(ev){ ev.preventDefault(); openOut(el.dataset.out); }; });
  document.querySelectorAll('[data-dl]').forEach(function(el){ el.onclick = function(){ downloadWork(el.dataset.dl, el.dataset.kind); }; });
  document.querySelectorAll('[data-ch]').forEach(function(el){ el.onclick = function(){ shareWork(el.dataset.ch, el); }; });
  document.querySelectorAll('[data-work]').forEach(function(el){
    fetch('/api/works/'+el.dataset.work, {headers: authHeaders()})
      .then(function(r){ if (!r.ok) throw new Error(); return r.blob(); })
      .then(function(b){ el.src = URL.createObjectURL(b); })
      .catch(function(){});
  });
  const ss = document.getElementById('supsend'); if (ss) ss.onclick = sendSupport;
  const tr = document.getElementById('transfer'); if (tr) tr.onclick = sendTransfer;
  const pull = document.getElementById('pull'); if (pull) pull.onclick = sendPull;
  const vktop = document.getElementById('vktop'); if (vktop) vktop.onclick = openVkTopup;
  const vkmove = document.getElementById('vkmove'); if (vkmove) vkmove.onclick = sendVkMove;
}
async function openVkTopup(){
  const msg = document.getElementById('vktopmsg');
  const btn = document.getElementById('vktop');
  if (btn) btn.disabled = true;
  try {
    const r = await fetch('/api/vk/topup', {method:'POST', headers: authHeaders(), body:'{}'});
    const d = await r.json();
    if (!r.ok || !d.url) { if (msg) msg.textContent = (d && d.error) || 'Чат не открылся. Нажмите «Пополнить» в диалоге.'; return; }
    if (msg) msg.textContent = 'В чате уже можно выбрать пакет.';
    openOut(d.url);
  } catch (e) {
    if (msg) msg.textContent = 'Чат не открылся. Нажмите «Пополнить» в диалоге.';
  } finally { if (btn) btn.disabled = false; }
}
async function sendVkMove(){
  const msg = document.getElementById('vkmovemsg');
  const telegram = ((document.getElementById('tgto')||{}).value||'').trim();
  const amount = ((document.getElementById('tgamt')||{}).value||'').trim();
  if (msg) msg.textContent = '';
  try {
    const r = await fetch('/api/vk/transfer', {method:'POST', headers: authHeaders(), body: JSON.stringify({telegram, amount})});
    const d = await r.json();
    if (!r.ok || !d.ok) { if (msg) msg.textContent = (d && d.error) || 'Перенос не выполнился.'; return; }
    if (me) me.balance = d.balance;
    document.getElementById('bal').textContent = d.balance+' кр';
    const top = document.getElementById('topbal');
    if (top) top.textContent = d.balance+' кр';
    if (msg) msg.textContent = 'Перенесли. В Telegram кредиты уже есть. Здесь осталось '+d.balance+' кр.';
  } catch (e) {
    if (msg) msg.textContent = 'Перенос не выполнился. Кредиты остались здесь.';
  }
}
function workFileName(id, kind){
  const ext = kind==='video' ? 'mp4' : kind==='audio' ? 'mp3' : 'png';
  return 'neuroyaga-'+id+'.'+ext;
}
async function sendWorkToChat(id){
  const r = await fetch('/api/works/'+id+'/send', {method:'POST', headers: authHeaders()});
  const d = await r.json().catch(function(){ return {}; });
  if (!r.ok || !d.ok) throw new Error(d.error || 'Не удалось отправить файл');
}
async function downloadWork(id, kind){
  const name = workFileName(id, kind);
  const url = location.origin + '/api/works/' + id + '?tk=' + encodeURIComponent(token||'') + '&dl=1';
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg && typeof tg.downloadFile === 'function') {
    tg.downloadFile({ url: url, file_name: name }, function(ok){
      if (ok) return;
      sendWorkToChat(id).then(function(){ alert('Файл отправлен в чат бота. Сохраните его оттуда.'); }).catch(function(e){ alert(e.message); });
    });
    return;
  }
  try {
    await sendWorkToChat(id);
    alert('Файл отправлен в чат бота. Сохраните его оттуда.');
  } catch (e) { alert(e.message); }
}
async function shareTemplate(id){
  try {
    const r = await fetch('/api/templates/'+encodeURIComponent(id)+'/link', {headers: authHeaders()});
    const d = await r.json().catch(function(){ return {}; });
    if (!r.ok || !d.url) throw new Error(d.error || 'Не удалось собрать ссылку');
    const shareUrl = 'https://t.me/share/url?url='+encodeURIComponent(d.url)+'&text='+encodeURIComponent('Шаблон «'+(d.title||'НейроЯга')+'»');
    const w = tg();
    if (w && w.openTelegramLink) w.openTelegramLink(shareUrl);
    else window.open(shareUrl, '_blank');
  } catch (e) { alert(e.message); }
}
async function shareWork(id, btn){
  if (btn) btn.disabled = true;
  try {
    const r = await fetch('/api/works/'+id+'/channel', {method:'POST', headers: authHeaders()});
    const d = await r.json().catch(function(){ return {}; });
    if (!r.ok || !d.ok) throw new Error(d.error || 'Не удалось отправить в канал');
    if (works) {
      const item = works.find(function(x){ return String(x.id)===String(id); });
      if (item) item.shared = true;
    }
    alert('Работа опубликована в канале.');
    if (tab==='hist') draw();
  } catch (e) {
    alert(e.message);
    if (btn) btn.disabled = false;
  }
}
async function setModel(model){
  if (me) me.current_model = model;
  pickedQuality = null; pickedDuration = null; pickedAspect = null; genPhoto = null;
  if (tab==='models'){ tab='gen'; }
  draw();
  try { await fetch('/api/set-model',{method:'POST',headers:authHeaders(),body:JSON.stringify({model})}); } catch(e){}
}
function useTpl(id){
  const t = templates.find(x=>String(x.id)===String(id)); if (!t) return;
  openTpl = t.id;
  photoData = null;
  last = null;
  pickedFormat = (t.formats && t.formats[0]) || null;
  draw();
}
function fileToJpeg(file){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1280;
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * scale));
      const h = Math.max(1, Math.round(img.height * scale));
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg', 0.86));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Не удалось прочитать фото')); };
    img.src = url;
  });
}
async function onGenPhoto(input){
  const file = input.files && input.files[0];
  if (!file) return;
  try { genPhoto = await fileToJpeg(file); draft = (document.getElementById('prompt')||{}).value || draft; }
  catch (e) { genPhoto = null; alert(e.message); }
  draw();
}
async function onPhoto(input){
  const file = input.files && input.files[0];
  if (!file) return;
  try { photoData = await fileToJpeg(file); }
  catch (e) { photoData = null; alert(e.message); }
  draw();
}
async function generateTemplate(){
  if (busy) return;
  const t = templates.find(x=>String(x.id)===String(openTpl));
  if (!t) return;
  const lack = shortOf(t.cost||0);
  if (lack) { last = {error:lack}; draw(); return; }
  if (t.photo && !photoData) { last = {error:'Прикрепите фото'}; draw(); return; }
  busy = true;
  last = { text: 'Создаю'+(pickedFormat?' · размер '+pickedFormat:'')+'…' };
  draw();
  try {
    const r = await fetch('/api/generate',{method:'POST',headers:authHeaders(),body:JSON.stringify({templateId:t.id, image:photoData, format:pickedFormat})});
    const d = await r.json();
    if (!r.ok || d.error) throw new Error(d.error||'Ошибка');
    last = d;
    works = null;
    if (me) me.balance = d.balance;
    document.getElementById('bal').textContent = d.balance+' кр';
  } catch(e){ last = {error:e.message}; }
  busy = false; draw();
}
function payHost(url){
  try {
    const host = new URL(url).hostname;
    return host === 'yoomoney.ru' || host === 'yookassa.ru' || host.endsWith('.yoomoney.ru') || host.endsWith('.yookassa.ru');
  } catch (e) { return false; }
}
function openPay(url){
  if (!payHost(url)) { alert('Оплата не открылась'); return; }
  const popup = window.open(url, '_blank', 'noopener');
  try { if (parent && parent !== window) parent.postMessage({ type: 'ny-pay', url: url }, '*'); } catch (e) {}
  if (popup) return;
  if (window.top === window) location.href = url;
  else alert('Разрешите всплывающие окна и нажмите оплату ещё раз.');
}
function buy(pkgId){
  if (isVk()) {
    const email = ((document.getElementById('paymail')||{}).value||'').trim();
    if (!email) { alert('Укажите почту для чека'); return; }
    fetch('/api/vk/pay', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({tk: token, packageId: pkgId, email})})
      .then(function(r){ return r.json().then(function(d){ return {ok:r.ok, d:d}; }); })
      .then(function(x){
        if (!x.ok || !x.d.url) { alert((x.d && x.d.error) || 'Оплата не открылась'); return; }
        openPay(x.d.url);
      })
      .catch(function(){ alert('Оплата не открылась'); });
    return;
  }
  const w = tg();
  if (w && w.sendData){ w.sendData(JSON.stringify({action:'buy_credits', pkg:pkgId})); }
  else alert('Откройте оплату в чате бота кнопкой «Пополнить».');
}
async function generate(){
  if (busy) return;
  const prompt = ((document.getElementById('prompt')||{}).value||'').trim();
  const m = modelOf((me&&me.current_model)||'');
  const lack = shortOf(m ? quote(m, {quality:pickedQuality, duration:pickedDuration}) : 0);
  if (lack) { last = {_prompt:prompt, error:lack}; draw(); return; }
  if (m && m.audio) return;
  if (m && m.image === 'required' && !genPhoto) { last = {_prompt:prompt, error:'Прикрепите фото'}; draw(); return; }
  if (!prompt && !genPhoto) return;
  if (m && m.image === 'forbidden' && !prompt) return;
  busy = true; draft = prompt; last = {_prompt:prompt}; draw();
  try {
    const r = await fetch('/api/generate',{method:'POST',headers:authHeaders(),body:JSON.stringify({
      prompt, model: me&&me.current_model, image: (m && m.image !== 'forbidden') ? genPhoto : null,
      quality: pickedQuality, duration: pickedDuration, format: pickedAspect
    })});
    const d = await r.json();
    if (!r.ok || d.error) throw new Error(d.error||'Ошибка');
    last = Object.assign({_prompt:prompt}, d);
    works = null;
    if (me) me.balance = d.balance;
    document.getElementById('bal').textContent = d.balance+' кр';
  } catch(e){ last = {_prompt:prompt, error:e.message}; }
  busy = false; draw();
}
async function sendTransfer(){
  const emailEl = document.getElementById('temail');
  const amtEl = document.getElementById('tamt');
  const msg = document.getElementById('tmsg');
  const email = (emailEl&&emailEl.value||'').trim();
  const credits = parseInt(amtEl&&amtEl.value, 10);
  if (msg) { msg.className = 'hint'; msg.textContent = 'Переносим…'; }
  try {
    const r = await fetch('/api/transfer',{method:'POST',headers:authHeaders(),body:JSON.stringify({email, credits})});
    const d = await r.json();
    if (typeof d.balance === 'number') {
      if (me) me.balance = d.balance;
      const bal = document.getElementById('bal'); if (bal) bal.textContent = d.balance+' кр';
      const top = document.getElementById('topbal'); if (top) top.textContent = d.balance+' кр';
    }
    if (!r.ok || !d.ok) throw new Error(d.error||'Не получилось');
    if (msg) msg.textContent = 'Готово. На сайте у '+email+' теперь '+(d.siteCredits!=null?d.siteCredits:d.credits)+' кр. В боте осталось '+d.balance+'.';
    if (amtEl) amtEl.value = '';
  } catch (e) {
    if (msg) { msg.className = 'err'; msg.textContent = e.message; }
  }
}
let pulling = false;
async function sendPull(){
  if (pulling) return;
  const emailEl = document.getElementById('pemail');
  const passEl = document.getElementById('ppass');
  const amtEl = document.getElementById('pamt');
  const msg = document.getElementById('pmsg');
  const email = (emailEl&&emailEl.value||'').trim();
  const password = passEl&&passEl.value||'';
  const credits = parseInt(amtEl&&amtEl.value, 10);
  if (msg) { msg.className = 'hint'; msg.textContent = 'Переносим…'; }
  pulling = true;
  try {
    const r = await fetch('/api/transfer-in',{method:'POST',headers:authHeaders(),body:JSON.stringify({email, password, credits})});
    const d = await r.json();
    if (typeof d.balance === 'number') {
      if (me) {
        me.balance = d.balance;
        if (d.ok && Array.isArray(me.history)) me.history.unshift({ delta: credits, balance: d.balance, reason: 'Перенос с сайта · '+email });
      }
      const bal = document.getElementById('bal'); if (bal) bal.textContent = d.balance+' кр';
      const top = document.getElementById('topbal'); if (top) top.textContent = d.balance+' кр';
    }
    if (!r.ok || !d.ok) throw new Error(d.error||'Не получилось');
    if (msg) msg.textContent = 'Готово. В боте сейчас '+d.balance+' кр. На сайте у '+email+' осталось '+(d.siteCredits!=null?d.siteCredits:'?')+'.';
    if (amtEl) amtEl.value = '';
    if (passEl) passEl.value = '';
  } catch (e) {
    if (msg) { msg.className = 'err'; msg.textContent = e.message; }
  } finally {
    pulling = false;
  }
}
async function sendSupport(){
  const ta = document.getElementById('supmsg');
  const msg = (ta&&ta.value||'').trim();
  const ok = document.getElementById('supok');
  if (!msg){ if(ok) ok.textContent='Введите сообщение'; return; }
  try {
    const r = await fetch('/api/support',{method:'POST',headers:authHeaders(),body:JSON.stringify({message:msg})});
    const d = await r.json();
    if (!r.ok || d.error) throw new Error(d.error||'Ошибка');
    if (ta) ta.value=''; if (ok) ok.textContent='Отправлено! Ответ придёт в чат бота.';
  } catch(e){ if (ok) ok.textContent='Не удалось отправить: '+e.message; }
}
function faceHtml(row){
  const photo = String(row.photo||'');
  if (/^https:\/\/([a-z0-9-]+\.)?(userapi\.com|vk\.com|vkuser\.net)\//i.test(photo)) return '<img class="ava" src="'+esc(photo)+'" alt="">';
  return '<div class="ava letter">'+esc((row.name||'?').trim().charAt(0))+'</div>';
}
function renderRating(d){
  const rows = d.rows || [];
  const mine = d.mine;
  const list = rows.map(function(row, i){
    const place = i + 1;
    const cls = 'rank'+(place<=3?' top'+place:'')+(mine && String(mine.userId)===String(row.userId)?' me':'');
    return '<div class="'+cls+'"><div class="medal">'+place+'</div>'+faceHtml(row)+'<div class="who"><b>'+esc(row.name)+'</b><span>лайки '+row.likes+' · комментарии '+row.comments+' · репосты '+row.reposts+' · бот '+row.bot+'</span></div><div class="pts">'+row.points+'</div></div>';
  }).join('');
  const own = mine
    ? '<div class="now">Ваше место: <b>'+mine.place+'</b> · '+mine.points+' б.</div>'
    : '<div class="now">Вас пока нет в списке этой недели.</div>';
  const rules = d.rules || {};
  return '<h3 style="margin:0 0 6px">Рейтинг</h3><div class="now">'+esc(d.week||'')+'</div>'+
    '<div class="rules"><span>лайк '+(rules.like||0)+'</span><span>комментарий '+(rules.comment||0)+'</span><span>репост '+(rules.repost||0)+'</span><span>запрос боту '+(rules.bot||0)+'</span></div>'+
    '<p class="now">Лайк, комментарий и репост приводят людей, поэтому баллов больше, чем за запрос боту. В понедельник список начинается заново.</p>'+
    own+(list||'<p class="empty">На этой неделе пока тихо. Лайкайте записи, комментируйте, делайте репосты и пишите боту.</p>');
}
async function loadRating(){
  const box = document.getElementById('ratebox');
  if (!box) return;
  try {
    const r = await fetch('/api/rating', { headers: authHeaders() });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Не удалось открыть рейтинг');
    if (document.getElementById('ratebox')) document.getElementById('ratebox').innerHTML = renderRating(d);
  } catch (e) {
    const live = document.getElementById('ratebox');
    if (live) live.innerHTML = '<p class="err">'+esc(e.message)+'</p>';
  }
}
document.getElementById('tabs').onclick = function(e){
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.t!=='tpl') { openTpl=null; photoData=null; }
  tab = b.dataset.t; draw();
};
const w = tg(); if (w){ try{ w.ready(); w.expand(); }catch(e){} }
detectAuth();
(async function boot(){ await loadConfig(); await load(); })();
let tries=0;
(function retry(){ if (!userId && tries<20){ tries++; detectAuth(); if (userId){ load(); return; } setTimeout(retry,250); } })();
