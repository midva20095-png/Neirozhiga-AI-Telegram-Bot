<!DOCTYPE html>
<html lang="ru" style="background:#0b0614">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>НейроЯга</title>
<link rel="icon" href="cover.jpg">
<script src="trades.js"></script>
<script>
function vkSend(handler, params){
  if (window.vkBridge && vkBridge.send) {
    vkBridge.send(handler, params || {}).catch(function(){});
    return;
  }
  try { parent.postMessage({ handler: handler, params: params || {}, type: 'vk-connect', connectVersion: '2.15.8', sendTime: Date.now() }, '*'); }
  catch (e) {}
}
if (!window.__nyVkBoot) {
  window.__nyVkBoot = true;
  vkSend('VKWebAppInit');
  vkSend('VKWebAppGetLaunchParams');
}
function vkTell(msg){
  window.dispatchEvent(new MessageEvent('message', { data: msg }));
}
function hashTpl(value){
  const text = String(value || '');
  const direct = text.match(/tpl=(?:local:)?(\d{1,12})(?!\d)/);
  if (direct) return direct[1];
  const ref = text.match(/(?:^|[?&#]|vk_ref=|ref=)tpl_?(\d{1,12})(?!\d)/);
  if (ref) return ref[1];
  const short = text.match(/(?:^|[#?&])t(\d{1,12})(?!\d)/);
  return short ? short[1] : '';
}
window.__nyHost = function(msg){
  if (!msg || !msg.type) return;
  if (msg.type === 'ny-goal-ask') {
    const goal = String(location.hash || '').replace(/^#/, '').split('&')[0].split('?')[0];
    if (goal === 'rate' || goal === 'site' || goal === 'shop' || goal === 'sub' || goal === 'help') vkTell({ type: 'ny-goal', goal: goal });
    const tpl = hashTpl(location.hash) || hashTpl(location.search);
    if (tpl) vkTell({ type: 'ny-tpl', id: tpl });
    return;
  }
  if (msg.type === 'ny-group-ask') {
    const id = new URLSearchParams(location.search).get('vk_group_id') || '';
    if (id) vkTell({ type: 'ny-group', id: id });
    return;
  }
  if (msg.type === 'ny-community-token') {
    const id = new URLSearchParams(location.search).get('vk_group_id') || '';
    if (!id) { vkTell({ type: 'ny-community-token-fail' }); return; }
    vkSend('VKWebAppGetCommunityToken', { app_id: 54901511, group_id: Number(id), scope: 'app_widget' });
    return;
  }
  if (msg.type === 'ny-widget-show') {
    const id = String(msg.group_id || '').replace(/\D/g, '');
    const body = String(msg.code || '');
    if (!id || body.indexOf('cover_id') < 0 || body.length > 12000) { vkTell({ type: 'ny-widget-fail' }); return; }
    vkSend('VKWebAppShowCommunityWidgetPreviewBox', { group_id: Number(id), type: 'cover_list', code: body });
    return;
  }
  if (msg.type === 'ny-user-ask') {
    vkSend('VKWebAppGetAuthToken', { app_id: 54901511, scope: '' });
    return;
  }
  if ((msg.type === 'ny-open' || msg.type === 'ny-pay') && /^https:\/\//.test(String(msg.url || ''))) {
    vkSend('VKWebAppOpenLink', { url: msg.url });
  }
};
window.addEventListener('message', function(event){
  let data = event.data || {};
  if (typeof data === 'string') { try { data = JSON.parse(data); } catch (e) { data = {}; } }
  if (data.type && String(data.type).indexOf('ny-') === 0) return;
  let bridgeType = (data.data && data.data.type) || data.handler || '';
  let bridgeData = (data.data && data.data.data) || data.params || {};
  if (!bridgeType && String(data.type || '').indexOf('VKWebApp') === 0) {
    bridgeType = data.type;
    bridgeData = data.data || {};
  }
  if (bridgeType === 'VKWebAppChangeFragment' || bridgeType === 'VKWebAppLocationChanged') {
    const where = String((bridgeData && (bridgeData.location || bridgeData.hash)) || '');
    const goal = where.replace(/^#/, '').split('&')[0].split('?')[0];
    if (goal === 'rate' || goal === 'site' || goal === 'shop' || goal === 'sub' || goal === 'help') vkTell({ type: 'ny-goal', goal: goal });
    const tpl = hashTpl(where);
    if (tpl) vkTell({ type: 'ny-tpl', id: tpl });
    return;
  }
  if (bridgeType === 'VKWebAppGetLaunchParamsResult') {
    const bag = {};
    [bridgeData, bridgeData && bridgeData.params, bridgeData && bridgeData.data].forEach(function(level){
      if (!level || typeof level !== 'object') return;
      Object.keys(level).forEach(function(key){
        if (key === 'sign' || key.indexOf('vk_') === 0) bag[key] = level[key];
      });
    });
    const id = String(bag.vk_group_id || (bridgeData && bridgeData.group_id) || '').replace(/\D/g, '');
    if (id) vkTell({ type: 'ny-group', id: id });
    vkTell({ type: 'ny-launch', params: bag });
    return;
  }
  if (bridgeType === 'VKWebAppGetCommunityTokenResult' && bridgeData.access_token) {
    vkTell({ type: 'ny-community-token', token: bridgeData.access_token });
    return;
  }
  if (bridgeType === 'VKWebAppGetCommunityTokenFailed') vkTell({ type: 'ny-community-token-fail' });
  if (bridgeType === 'VKWebAppGetAuthTokenResult' && bridgeData.access_token) {
    vkTell({ type: 'ny-user-token', token: bridgeData.access_token });
    return;
  }
  if (bridgeType === 'VKWebAppGetAuthTokenFailed') vkTell({ type: 'ny-user-token-fail' });
  if (String(bridgeType).indexOf('WidgetPreviewBoxFailed') >= 0) {
    const reason = bridgeData && (bridgeData.error_reason || (bridgeData.error_data && bridgeData.error_data.error_reason) || '');
    vkTell({ type: 'ny-widget-fail', reason: String(reason || '').replace(/access_token=[^&\s]+/g, '').slice(0, 180) });
  }
});
</script>

<script>
const KIND = {text:'Текст', image:'Картинка', video:'Видео', audio:'Музыка'};
let tab='gen', me=null, cfg=null, templates=[], works=null, worksLoading=false, userId=null, token=null, busy=false, last=null, wantMenu=false, tplAnswers={}, tplPhotos={};
let openTpl=null, photoData=null, pickedFormat=null, genPhoto=null, genVoice=null, genVoiceSeconds=0, draft='', pendingTpl='', pendingPkg='';
let tplKind='', tplTopic='', tplQuery='';
const TCAT = {image:'Картинки', fix:'Улучшение', chat:'Текст', video:'Видео', audio:'Голос'};
const TMARK = {image:'🪄', fix:'✨', chat:'✍️', video:'🎬', audio:'🎙'};
let pickedQuality=null, pickedDuration=null, pickedAspect=null;
const widgetPics = { chat: '', rate: '', shop: '' };
let showSetup = false;
let shopNote = '';

function tg(){ return window.Telegram && window.Telegram.WebApp; }
function nyPost(msg){
  if (typeof window.__nyHost === 'function') { window.__nyHost(msg); return; }
  try { parent.postMessage(msg, '*'); } catch (e) {}
}
function fileOrigin(){
  return String(window.__nyApi || location.origin).replace(/\/$/, '');
}
function openOut(url){
  const w = tg();
  if (w && w.openLink) { w.openLink(url); return; }
  let framed = false;
  try { framed = parent && parent !== window; } catch (e) { framed = true; }
  if (framed || window.__nyHost) nyPost({ type: 'ny-open', url: url });
  window.open(url, '_blank', 'noopener');
}
function parseUser(raw){
  if (!raw) return null;
  try { const p = new URLSearchParams(raw); const u = JSON.parse(p.get('user')||'null'); if (u && u.id) return u.id; } catch(e){}
  return null;
}
function detectAuth(){
  const w = tg();
  if (w && w.initData) { initData = w.initData; }
  // подписанный токен из ссылки (#tk=...) — для открытия с обычной клавиатуры
  const hash = (location.hash||'').replace(/^#/,'');
  const hp = new URLSearchParams(hash);
  const sp = new URLSearchParams(location.search);
  if (hp.get('tk')) token = hp.get('tk');
  else if (sp.get('tk')) token = sp.get('tk');
  const namedTpl = String(hp.get('tpl') || sp.get('tpl') || '').replace(/^local:/, '');
  pendingTpl = /^\d{1,12}$/.test(namedTpl) ? namedTpl : (hashTpl(location.hash) || hashTpl(location.search));
  if (hp.get('pkg') || sp.get('pkg')) pendingPkg = hp.get('pkg') || sp.get('pkg');
  window.__vkPaid = hp.get('paid') === '1' || sp.get('paid') === '1';
  const goal = hash.split('&')[0].split('?')[0];
  window.__vkGoal = (goal === 'rate' || goal === 'site' || goal === 'shop' || goal === 'sub' || goal === 'help') ? goal : '';
  if (sp.get('vk_user_id') && window.__vkGoal !== 'rate' && window.__vkGoal !== 'site' && window.__vkGoal !== 'help') wantMenu = true;
  if (window.__vkGoal === 'rate') { wantMenu = false; tab = 'rate'; }
  if (window.__vkGoal === 'shop') { wantMenu = false; tab = 'shop'; }
  if (window.__vkGoal === 'help') { wantMenu = false; tab = 'help'; }
  if (w && w.initDataUnsafe && w.initDataUnsafe.user && w.initDataUnsafe.user.id) userId = w.initDataUnsafe.user.id;
  else if (w && w.initData) userId = parseUser(w.initData);
  else if (token) userId = token.split('.')[0];
}
let initData = '';
function authHeaders(){
  const h = {'Content-Type':'application/json'};
  if (initData) h['X-Telegram-Init-Data'] = initData;
  if (token) h['X-User-Token'] = token;
  return h;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function safeSrc(u){
  const s = String(u||'');
  if (/^https?:\/\//i.test(s)) return s;
  if (/^data:image\/(jpeg|jpg|png|webp);base64,/i.test(s) && s.length < 1600000) return s;
  return '';
}
function modelOf(k){ return (cfg&&cfg.models||[]).find(m=>m.key===k) || null; }
function nameOf(k){ const m = modelOf(k); return m ? m.name : k; }
function costLabel(m){ return (m && m.label) || (m && m.free ? 'бесплатно' : ((m && m.cost) || 0)+' кр'); }
function quote(m, o){
  o = o || {};
  if (!m || m.free) return 0;
  if (m.durationPrices){
    var d = String(o.duration || (m.durations && m.durations[0]) || '');
    if (m.durationPrices[d] != null) return Number(m.durationPrices[d]);
    var vals = Object.keys(m.durationPrices).map(function(k){ return Number(m.durationPrices[k]); });
    return Math.min.apply(null, vals);
  }
  var q = null;
  if (m.qualities && m.qualities.length){
    var id = o.quality || m.quality;
    q = m.qualities.filter(function(x){ return x.id === id; })[0] || m.qualities.filter(function(x){ return x.id === m.quality; })[0] || m.qualities[0];
  }
  if (q && q.perSec) return Math.round(q.cost * (Number(o.duration) || (m.durations && m.durations[0]) || 1));
  if (q) return q.cost;
  if (m.perSec) return Math.round((m.rate || m.cost) * (Number(o.duration) || (m.durations && m.durations[0]) || 1));
  if (m.unit === 'sec') return Math.round(m.rate || m.cost);
  return m.cost;
}
function syncPicks(m){
  if (!m) return;
  if (!m.qualities || !m.qualities.some(function(q){ return q.id === pickedQuality; })) pickedQuality = m.quality || (m.qualities && m.qualities[0] && m.qualities[0].id) || null;
  if (!m.durations || m.durations.indexOf(Number(pickedDuration)) < 0) pickedDuration = (m.durations && m.durations[0]) || null;
  if (!m.ratio) pickedAspect = null;
  else if (m.aspects && m.aspects.length && m.aspects.indexOf(pickedAspect) < 0) pickedAspect = m.aspects[0];
}
function chips(list, current, attr){
  return '<div class="chips">'+list.map(function(item){
    var id = item.id != null ? item.id : item;
    var name = item.name || item;
    var on = String(current) === String(id);
    return '<button type="button" data-'+attr+'="'+esc(id)+'" class="'+(on?'on':'')+'">'+esc(name)+'</button>';
  }).join('')+'</div>';
}

function fetchT(url, opts, ms){
  const ctrl = typeof AbortController === 'function' ? new AbortController() : null;
  const timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, ms || 7000) : 0;
  const next = Object.assign({}, opts || {});
  if (ctrl) next.signal = ctrl.signal;
  return fetch(url, next).finally(function(){ if (timer) clearTimeout(timer); });
}
function retryOpen(){
  window.__vkOffline = false;
  load();
}
async function loadConfig(){
  try { cfg = await (await fetchT('/api/config'+(isVk()?'?audience=vk':''))).json(); }
  catch(e){ cfg = {models:[],packages:[],groups:{}}; }
  const s = document.getElementById('site');
  if (cfg.site_url){ s.href = cfg.site_url; s.style.display=''; } else s.style.display='none';
}
function launchFields(extra){
  const bag = {};
  function put(source){
    if (!source) return;
    if (typeof source.forEach === 'function' && typeof source.get === 'function') {
      source.forEach(function(value, key){
        if (key === 'sign' || key.indexOf('vk_') === 0) bag[key] = value == null ? '' : String(value);
      });
      return;
    }
    Object.keys(source).forEach(function(key){
      if (key === 'sign' || key.indexOf('vk_') === 0) bag[key] = source[key] == null ? '' : String(source[key]);
    });
  }
  put(new URLSearchParams(location.search));
  const hash = (location.hash || '').replace(/^#/, '');
  if (hash.indexOf('vk_user_id=') >= 0 || hash.indexOf('sign=') >= 0) put(new URLSearchParams(hash));
  if (extra && extra.vk_user_id && extra.sign) put(extra);
  return bag;
}
async function adoptVkLaunch(extra){
  const bag = launchFields(extra);
  const gid = String(bag.vk_group_id || vkGroupId() || '').replace(/\D/g, '');
  if (gid) window.__vkGroup = gid;
  if (bag.vk_user_id && window.__vkGoal !== 'rate' && window.__vkGoal !== 'site') wantMenu = true;
  if (token || !bag.sign || !bag.vk_user_id) return;
  try {
    const r = await fetchT('/api/vk/session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(bag)
    });
    const d = await r.json();
    if (d && d.tk) {
      token = d.tk;
      userId = String(token).split('.')[0];
      if (d.group) window.__vkGroup = String(d.group).replace(/\D/g, '');
      window.__vkOffline = false;
      window.__vkAuthError = '';
    } else if (d && d.error && (!window.__nyApi || window.__vkLaunchSeen)) window.__vkAuthError = d.error;
  } catch (e) { window.__vkOffline = true; }
}
function askVkUserToken(){
  if (window.__vkUserAsk) return window.__vkUserAsk;
  window.__vkUserAsk = new Promise(function(resolve){
    const timer = setTimeout(function(){ cleanup(); resolve(''); }, 12000);
    function onMsg(event){
      const data = event.data || {};
      if (data.type === 'ny-user-token' && data.token) { cleanup(); resolve(String(data.token)); }
      if (data.type === 'ny-user-token-fail') { cleanup(); resolve(''); }
    }
    function cleanup(){
      clearTimeout(timer);
      window.removeEventListener('message', onMsg);
      window.__vkUserAsk = null;
    }
    window.addEventListener('message', onMsg);
    nyPost({ type: 'ny-user-ask' });
  });
  return window.__vkUserAsk;
}
async function adoptVkUser(){
  if (token || userId || !window.__nyApi) return;
  const access = await askVkUserToken();
  if (!access) {
    window.__vkAuthError = '1';
    return;
  }
  try {
    const r = await fetchT('/api/vk/user-token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ access_token: access })
    });
    const d = await r.json();
    if (d && d.tk) {
      token = d.tk;
      userId = String(token).split('.')[0];
      window.__vkAuthError = '';
      window.__vkOffline = false;
    } else window.__vkAuthError = '1';
  } catch (e) { window.__vkOffline = true; }
}
function inVkApp(){
  return !!(window.__nyApi || new URLSearchParams(location.search).get('vk_app_id') || new URLSearchParams(location.search).get('vk_user_id') || String(token || userId || '').startsWith('-'));
}
function markVkChrome(){
  const vk = inVkApp();
  document.body.classList.toggle('vkapp', vk);
  const gen = document.querySelector('#tabs button[data-t="gen"]');
  if (gen) gen.innerHTML = '<span class="ic">'+(vk ? '💬' : '✨')+'</span>'+(vk ? 'Чат' : 'Генерация');
  const bots = document.querySelector('.bots');
  if (bots) bots.style.display = vk ? 'none' : '';
}
async function load(){
  markVkChrome();
  window.__nyLoadSeq = (window.__nyLoadSeq || 0) + 1;
  const seq = window.__nyLoadSeq;
  function live(){ return seq === window.__nyLoadSeq; }
  try {
    const gate = await fetchT('/api/maintenance');
    const closed = await gate.json();
    if (!live()) return;
    if (closed && closed.on) {
      document.getElementById('view').innerHTML = '<div class="card"><p>'+esc(closed.message || 'Идёт обновление. Зайдите чуть позже: сейчас вход закрыт.')+'</p></div>';
      return;
    }
  } catch (e) {}
  if (!live()) return;
  await adoptVkLaunch();
  if (!live()) return;
  if (!userId && window.__nyApi) await adoptVkUser();
  if (!live()) return;
  paintVkBot();
  if (!userId && window.__vkGoal === 'rate') {
    tab = 'rate';
    await loadConfig();
    draw();
    return;
  }
  const sharedTpl = pendingTpl || (typeof hashTpl === 'function' ? (hashTpl(location.hash) || hashTpl(location.search)) : '');
  if (sharedTpl) pendingTpl = pendingTpl || sharedTpl;
  if (!userId && pendingTpl) {
    try { templates = ((await (await fetchT('/api/templates?audience=vk')).json()).templates) || []; } catch (e) { templates = templates || []; }
    openSharedTpl(pendingTpl, false);
    draw();
    return;
  }
  if (!userId) { draw(); return; }
  try {
    const r = await fetchT('/api/me', {headers: authHeaders()});
    if (!live()) return;
    if (r.status === 401) { me = null; draw(); return; }
    if (r.status === 503) {
      const closed = await r.json().catch(function(){ return {}; });
      if (closed.maintenance) { me = { maintenance: true }; draw(); return; }
    }
    if (r.status === 403) {
      const d = await r.json().catch(function(){ return {}; });
      me = { channel: d.channel || 'https://t.me/neuroyaga_AI' };
      draw();
      return;
    }
    me = await r.json();
    if (me.error) throw new Error(me.error);
  } catch(e){
    if (!live()) return;
    if (me && me.user_id && !me.error) { draw(); return; }
    me = {error:true, balance:0, history:[], current_model:(cfg&&cfg.default_model)||'flash'};
    window.__vkOffline = true;
  }
  if (!live()) return;
  await loadConfig();
  try { templates = ((await (await fetchT('/api/templates'+(inVkApp()?'?audience=vk':''))).json()).templates)||[]; } catch(e){ templates=[]; }
  openSharedTpl(pendingTpl, false);
  if (pendingPkg) tab = 'top';
  document.getElementById('bal').textContent = (me.balance||0)+' кр';
  markVkChrome();
  if (!isVk() && (tab==='rate' || tab==='shop' || tab==='menu' || tab==='cab' || tab==='assist')) tab = 'gen';
  if (isVk() && tab === 'menu' && !window.__vkGoal) tab = 'gen';
  if (window.__vkGoal === 'rate') tab = 'rate';
  if (window.__vkGoal === 'shop') tab = 'shop';
  if (window.__vkGoal === 'help') tab = 'help';
  draw();
  if (window.__vkGoal === 'site') openOut((cfg && cfg.site_url) || 'https://babayagaland.ru');
  if (window.__vkGoal === 'sub' && me && me.user_id && !me.mail) subscribeMail(true);
  nyPost({ type: 'ny-goal-ask' });
  nyPost({ type: 'ny-group-ask' });
}
function applyGoal(goal){
  if (goal !== 'rate' && goal !== 'site' && goal !== 'shop' && goal !== 'sub' && goal !== 'help') return;
  window.__vkGoal = goal;
  if (goal === 'rate') { wantMenu = false; tab = 'rate'; draw(); }
  if (goal === 'shop') { wantMenu = false; tab = 'shop'; draw(); }
  if (goal === 'help') { wantMenu = false; tab = 'help'; draw(); }
  if (goal === 'site') openOut((cfg && cfg.site_url) || 'https://babayagaland.ru');
  if (goal === 'sub' && me && me.user_id && !me.mail) subscribeMail(true);
}
function draw(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on', b.dataset.t===tab));
  const box = document.getElementById('view');
  if (me && me.maintenance) {
    box.innerHTML = '<div class="card"><p>Идёт обновление. Зайдите чуть позже: сейчас вход закрыт.</p></div>';
    return;
  }
  if (window.__vkOffline && (!userId || (me && me.error))) {
    box.innerHTML = '<div class="card"><p>Кабинет открыт. Сервер бота не ответил, поэтому баланс и генерация ещё не загрузились.</p><button class="btn" type="button" onclick="retryOpen()">Повторить</button><p class="empty">'+(isVk()?'Бот в чате сообщества при этом работает. Напишите туда, если повтор не помогает.':'Откройте кабинет ещё раз из чата бота.')+'</p></div>';
    return;
  }
  if (!userId && window.__vkGoal === 'rate' && tab === 'rate') {
    box.innerHTML = '<div id="ratebox"><div class="card"><div class="empty">Считаю баллы…</div></div></div>';
    loadRating();
    return;
  }
  if (!userId && window.__nyApi && !window.__vkLaunchSeen && !window.__vkAuthError) {
    box.innerHTML = '<div class="card"><p class="empty">Открываю кабинет…</p></div>';
    return;
  }
  if (!userId || (me && !me.user_id && me.error!==true && !me.balance)) {
    box.innerHTML = '<div class="card"><p class="empty">'+(window.__vkAuthError ? 'Сессия сообщества не открылась. Закройте кабинет и откройте его кнопкой из чата.' : 'Откройте кабинет из чата бота или из сообщества.')+'</p></div>';
    return;
  }
  if (me && me.channel) {
    box.innerHTML = '<div class="card"><p>Чтобы пользоваться ботом, подпишитесь на канал НейроЯга.</p><a class="btn" href="'+esc(me.channel)+'" target="_blank" rel="noopener">Подписаться</a><p class="empty">После подписки нажмите «Я подписался» в чате бота и откройте кабинет снова.</p></div>';
    return;
  }
  if (me && me.blocked) { box.innerHTML = '<div class="card err">Аккаунт в чёрном списке.</div>'; return; }
  if (tab==='menu') box.innerHTML = viewMenu();
  else if (tab==='cab') box.innerHTML = viewCab();
  else if (tab==='gen') box.innerHTML = viewGen();
  else if (tab==='models') box.innerHTML = viewModels();
  else if (tab==='tpl') box.innerHTML = viewTpl();
  else if (tab==='hist') box.innerHTML = viewHist();
  else if (tab==='top') box.innerHTML = viewTop();
  else if (tab==='rate') { box.innerHTML = '<div id="ratebox"><div class="card"><p>Считаю баллы…</p></div></div>'; loadRating(); }
  else if (tab==='shop') { box.innerHTML = '<div id="shopbox"><div class="card"><p>Открываю магазин…</p></div></div>'; loadShop(); }
  else if (tab==='assist') { box.innerHTML = '<div id="assistbox"><div class="card"><p>Открываю сообщество…</p></div></div>'; loadAssist(); }
  else box.innerHTML = viewHelp();
  if (inVkApp() && tab !== 'gen' && tab !== 'tpl' && tab !== 'rate' && tab !== 'shop' && tab !== 'cab') {
    box.insertAdjacentHTML('afterbegin', '<button type="button" class="back" id="cab-back">Кабинет</button>');
  }
  bind();
}
function vkAdmin(){
  const role = new URLSearchParams(location.search).get('vk_viewer_group_role') || '';
  return role === 'admin' || role === 'editor';
}
function askCommunityToken(){
  return new Promise(function(resolve, reject){
    const timer = setTimeout(function(){
      window.removeEventListener('message', onMsg);
      reject(new Error('ВК не открыл разрешение. Откройте кабинет из сообщества.'));
    }, 20000);
    function onMsg(event){
      const data = event.data || {};
      if (data.type === 'ny-community-token' && data.token) {
        clearTimeout(timer);
        window.removeEventListener('message', onMsg);
        resolve(data.token);
      }
      if (data.type === 'ny-community-token-fail') {
        clearTimeout(timer);
        window.removeEventListener('message', onMsg);
        reject(new Error('Разрешите кнопки сообщества в окне ВК.'));
      }
    }
    window.addEventListener('message', onMsg);
    nyPost({ type: 'ny-community-token' });
  });
}
function launchParam(name){
  const search = new URLSearchParams(location.search).get(name);
  if (search) return search;
  return new URLSearchParams((location.hash || '').replace(/^#/, '')).get(name) || '';
}
function vkGroupId(){
  return String(launchParam('vk_group_id') || window.__vkGroup || '').replace(/\D/g, '');
}
function communityDialog(groupId, peerId){
  const group = String(groupId || '').replace(/\D/g, '');
  const peer = String(peerId || '').replace(/\D/g, '');
  if (!group || !peer || peer === '0') return '';
  return 'https://vk.com/gim' + group + '?sel=' + peer;
}
function chatLink(){
  const id = vkGroupId();
  return id ? 'https://vk.ru/write-' + id : '';
}
function paintVkBot(){
  const url = chatLink();
  if (!url) return;
  document.querySelectorAll('[data-vkbot]').forEach(function(el){

      return;
    }
    const placed = await fetch('/api/vk/widget', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token, group_id: groupId, ids: ids })
    });

    if (placed.status === 404) {
      nyPost({ type: 'ny-widget-show', group_id: Number(groupId), code: coverCode(groupId, ids) });
      if (msg) msg.textContent = 'Подтвердите кнопки в окне ВК.';
      return;

  } catch (e) {

  }
}

function fitCardText(){
  document.querySelectorAll('.desk textarea, #assistDeliveryPrice').forEach(function(node){
    const limit = Number(node.getAttribute('maxlength')) || 0;
    const note = node.nextElementSibling;
    if (note && note.classList.contains('count') && limit) {
      note.textContent = node.value.length + ' из ' + limit;
      note.classList.toggle('full', limit > 0 && node.value.length >= limit);
    }
    if (node.tagName !== 'TEXTAREA' || node.offsetParent === null) return;
    node.style.height = '0px';
    node.style.height = Math.max(node.scrollHeight + 8, 140) + 'px';
  });
}
async function loadAssist(){

    const response = await fetch('/api/vk/assistant', { headers: authHeaders() });

  } catch (error) {
    box.innerHTML = '<div class="card"><p class="err">'+esc(error.message || 'Раздел не открылся')+'</p></div>';
    bind();
    return;
  }
  if (!data.don) {
    const note = data.check === false
      ? 'Не удалось сверить донат. Откройте раздел ещё раз.'
      : 'Раздел открыт донам НейроЯги. После оплаты подписка появится здесь, и можно будет подключить своё сообщество.';
    box.innerHTML = '<div class="card"><div class="kicker">Моё сообщество</div><p class="now">'+esc(note)+'</p>'+
      '<a class="btn" href="'+esc(data.join || 'https://vk.com/donut/club214554778')+'" target="_blank" rel="noopener">Оформить донат</a></div>';
    bind();
    return;
  }
  if (!data.active) {
    box.innerHTML = '<div class="card"><div class="kicker">Моё сообщество</div><p class="now">Донат не продлён, помощник в вашем сообществе молчит. После оплаты он снова ответит покупателям.</p>'+
      '<a class="btn" href="'+esc(data.join)+'" target="_blank" rel="noopener">Продлить донат</a></div>';
    bind();
    return;
  }
  assistView = data;
  const community = data.community;
  const orders = ((data.orders && data.orders.rows) || []).length;
  const books = ((data.bookings && data.bookings.rows) || []).length;
  const people = Number(data.clients && (data.clients.total || (data.clients.people || []).length)) || 0;
  const marks = {};
  if (orders) marks.orders = orders;
  if (books) marks.book = books;

  const status = community

    : '<p class="now">Помощник пока нигде не отвечает. Подключите своё сообщество.</p>';
  const home = status+(community ? assistBillPreviewHtml(assistServiceItems(community.reply && community.reply.services)) : '')+(community ? assistQuick(data) : '<p class="hint">После подключения здесь будут карточка, заказы, записи и клиенты.</p>')+
    assistConnect(community)+assistGuide(!community);
  box.innerHTML = '<div class="card">'+
    '<div class="kicker">Моё сообщество</div>'+
    assistTabs(marks)+
    assistPaneBox('home', home)+
    assistPaneBox('card', community ? assistDesk(community.reply, community.groupId) : assistLocked())+
    assistPaneBox('orders', community ? assistOrders(data.orders, data.clients, community.groupId) : assistLocked())+
    assistPaneBox('book', community ? assistBookings(data.bookings, data.clients, community.groupId) : assistLocked())+
    assistPaneBox('people', community ? assistBase(data.clients) : assistLocked())+
    assistPaneBox('ask', assistHelpBox(data.setup))+

async function saveAssist(){
  const msg = document.getElementById('assistmsg');
  const button = document.getElementById('assistSave');
  const groupId = (document.getElementById('assistGroup') || {}).value || '';
  const token = (document.getElementById('assistToken') || {}).value || '';
  if (button) button.disabled = true;
  if (msg) msg.textContent = 'Проверяю ключ…';
  try {
    const response = await fetch('/api/vk/assistant/community', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ groupId: groupId, token: token })
    });
    const data = await response.json();
    if (!response.ok || !data.ok) throw new Error(data.error || 'Сообщество не подключилось');
    if (msg) msg.textContent = 'Сообщество подключено.';
    loadAssist();
  } catch (error) {
    if (msg) msg.textContent = error.message;
    if (button) button.disabled = false;
  }
}

function moscowToday(){
  const shifted = new Date(Date.now() + 3 * 60 * 60 * 1000);
  return { y: shifted.getUTCFullYear(), m: shifted.getUTCMonth() + 1, d: shifted.getUTCDate() };
}
function monthKey(year, month){
  return year + '-' + (month < 10 ? '0' : '') + month;
}
function shiftMonth(key, delta){
  const match = /^(\d{4})-(\d{2})$/.exec(key || '');
  let year = match ? Number(match[1]) : 0;
  let month = match ? Number(match[2]) : 0;
  if (!year || !month) {
    const now = moscowToday();
    year = now.y;
    month = now.m;
  }
  month += delta;
  while (month < 1) { month += 12; year -= 1; }
  while (month > 12) { month -= 12; year += 1; }
  return monthKey(year, month);
}
function assistBookings(pack, clients, groupId){

  const year = Number(assistMonth.slice(0, 4));
  const month = Number(assistMonth.slice(5, 7));
  const titles = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
  const byDay = {};
  rows.forEach(function(item){
    const day = String(item.day || '');
    if (day.slice(0, 7) !== assistMonth) return;
    if (!byDay[day]) byDay[day] = [];
    byDay[day].push(item);
  });
  const todayKey = monthKey(now.y, now.m) === assistMonth ? assistMonth + '-' + (now.d < 10 ? '0' : '') + now.d : '';
  if (!assistDay || assistDay.slice(0, 7) !== assistMonth) {
    const first = Object.keys(byDay).sort()[0] || '';
    assistDay = (todayKey && byDay[todayKey]) ? todayKey : (first || todayKey || assistMonth + '-01');
  }
  const days = new Date(Date.UTC(year, month, 0)).getUTCDate();
  const firstDow = new Date(Date.UTC(year, month - 1, 1)).getUTCDay();
  const lead = firstDow === 0 ? 6 : firstDow - 1;
  let cells = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(function(name){ return '<span class="dow">'+name+'</span>'; }).join('');

  }).join('') : '<p class="hint">'+(pack && pack.pending ? 'Календарь откроется, когда помощник будет на связи.' : 'В этот день записей нет.')+'</p>';
  return '<div class="desk"><p class="now">Календарь записей</p>'+
    '<p class="hint">Уведомление приходит вам в ВК от имени этого сообщества, на телефон в приложение ВК. Если его нет, напишите сообществу со своей страницы один раз. «Открыть диалог» — переписка с клиентом. Настройки бота — вкладка «Карточка».</p>'+

function askVkDownload(url, name){
  return new Promise(function(resolve){
    let done = false;
    function finish(ok){
      if (done) return;
      done = true;
      window.removeEventListener('message', onMsg);
      clearTimeout(timer);
      resolve(!!ok);
    }
    function onMsg(event){
      const hit = window.nySave && nySave.bridgeDownload(event.data);
      if (!hit) return;
      finish(hit.ok);
    }
    const timer = setTimeout(function(){ finish(false); }, 4000);
    window.addEventListener('message', onMsg);
    vkSend('VKWebAppDownloadFile', { url: url, filename: name });
  });

async function saveBlob(id, name){
  const r = await fetch('/api/works/'+id+'?dl=1&name='+encodeURIComponent(name), { headers: authHeaders() });
  if (!r.ok) throw new Error(r.status === 404 ? 'Файл не найден' : 'Не удалось скачать файл');
  const blob = await r.blob();
  if (!blob || !blob.size) throw new Error('Файл пустой');
  const href = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = href;
  link.download = name;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(function(){ URL.revokeObjectURL(href); }, 15000);
}
async function saveInBrowser(id, name){
  try {
    await saveBlob(id, name);
  } catch (e) {
    if (!isVk()) { alert(e.message || 'Не удалось скачать файл'); return; }
    try {
      await sendWorkToChat(id);
      alert('Файл отправлен в чат сообщества. Сохраните его оттуда.');
    } catch (err) {
      alert(err.message || e.message || 'Не удалось скачать файл');

async function downloadWork(id, kind){
  const name = workFileName(id, kind);
  const url = workUrl(id, name);
  const route = (window.nySave && nySave.saveRoute({ webApp: tg(), search: location.search })) || 'browser';
  if (route === 'telegram') {
    try {
      tg().downloadFile({ url: url, file_name: name }, function(ok){
        if (ok) return;
        saveInBrowser(id, name);
      });
      return;
    } catch (e) {}
  }
  if (route === 'vk-app') {
    const ok = await askVkDownload(url, name);
    if (ok) return;
    try {
      await sendWorkToChat(id);
      alert('Файл отправлен в чат сообщества. Сохраните его оттуда.');
    } catch (e) {
      alert(e.message || 'Не удалось скачать файл');
    }
    return;
  }
  if (route === 'vk-web' && insideFrame()) {
    vkSend('VKWebAppOpenLink', { url: url });
    return;
  }
  await saveInBrowser(id, name);
}

function fileToJpeg(file){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 2048;
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * scale));
      const h = Math.max(1, Math.round(img.height * scale));
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg', 0.92));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Не удалось прочитать фото')); };
    img.src = url;
  });
}

function readFileData(file){
  return new Promise(function(resolve, reject){
    const reader = new FileReader();
    reader.onload = function(){ resolve(String(reader.result || '')); };
    reader.onerror = function(){ reject(new Error('Не удалось прочитать голосовое')); };
    reader.readAsDataURL(file);
  });
}
function voiceLength(file){
  return new Promise(function(resolve){
    const url = URL.createObjectURL(file);
    const audio = document.createElement('audio');
    audio.preload = 'metadata';
    audio.onloadedmetadata = function(){
      const seconds = Math.ceil(audio.duration);
      URL.revokeObjectURL(url);
      resolve(Number.isFinite(seconds) && seconds > 0 ? seconds : 0);
    };
    audio.onerror = function(){ URL.revokeObjectURL(url); resolve(0); };
    audio.src = url;
  });
}

  try {

    for (const file of files) ready.push(await fileToJpeg(file));
    const prev = Array.isArray(tplPhotos[key]) ? tplPhotos[key].slice() : (tplPhotos[key] ? [tplPhotos[key]] : []);
    const next = files.length > 1 || limit === 1 ? ready.slice(0, limit) : prev.concat(ready).slice(-limit);
    tplPhotos[key] = limit > 1 ? next : next[0];
  } catch (e) {
    alert(e.message);
  }
  rememberTplAnswers();
  draw();
}
async function generateTemplate(){
  if (busy) return;
  const t = templates.find(x=>String(x.id)===String(openTpl));
  if (!t) return;
  rememberTplAnswers();
  const lack = shortOf(t.cost||0);
  if (lack) { last = {error:lack}; draw(); return; }
  const photos = [];
  if (t.fields && t.fields.length) {
    t.fields.forEach(function(f){
      if (f.type !== 'фото') return;
      const bag = tplPhotos[f.key];
      (Array.isArray(bag) ? bag : (bag ? [bag] : [])).forEach(function(src){ photos.push(src); });
    });
    const gap = (t.fields.find(function(f){ return f.type !== 'фото' && !f.optional && !String(tplAnswers[f.key]||'').trim(); }) || {}).label;
    if (gap) { last = {error:'Заполните: '+gap}; draw(); return; }
    if (t.photo && !photos.length) { last = {error:'Добавьте фото'}; draw(); return; }
  } else if (t.photo && !photoData) { last = {error:'Прикрепите фото'}; draw(); return; }
  busy = true;
  last = { text: (t.category==='video'?'Видео готовится, это занимает несколько минут':'Создаю')+(pickedFormat?' · размер '+pickedFormat:'')+'…' };
  draw();
  try {
    const r = await fetch('/api/generate',{method:'POST',headers:authHeaders(),body:JSON.stringify({templateId:t.id, image:photoData, photos:photos, answers:tplAnswers, format:pickedFormat, group: vkGroupId()})});
    const d = await r.json();
    if (!r.ok || d.error) throw new Error(d.error||'Ошибка');
    last = d;
    works = null;
    if (me) me.balance = d.balance;
    document.getElementById('bal').textContent = d.balance+' кр';
  } catch(e){ last = {error:e.message}; }
  busy = false; draw();
}
function payHost(url){
  try {
    const host = new URL(url).hostname;
    return host === 'yoomoney.ru' || host === 'yookassa.ru' || host.endsWith('.yoomoney.ru') || host.endsWith('.yookassa.ru');
  } catch (e) { return false; }
}
function openPay(url){
  if (!payHost(url)) { alert('Оплата не открылась'); return; }
  const popup = window.open(url, '_blank', 'noopener');
  if ((parent && parent !== window) || window.__nyHost) nyPost({ type: 'ny-pay', url: url });
  if (popup) return;
  if (window.top === window) location.href = url;
  else alert('Разрешите всплывающие окна и нажмите оплату ещё раз.');
}

async function generate(){
  if (busy) return;
  const prompt = ((document.getElementById('prompt')||{}).value||'').trim();
  const m = modelOf((me&&me.current_model)||'');
  const price = m && m.audio
    ? (genVoiceSeconds ? quote(m, {quality:pickedQuality, duration: genVoiceSeconds}) : 0)
    : (m ? quote(m, {quality:pickedQuality, duration:pickedDuration}) : 0);
  const lack = shortOf(price);
  if (lack) { last = {_prompt:prompt, error:lack}; draw(); return; }
  if (m && m.audio && (!genPhoto || !genVoice || !(genVoiceSeconds > 0))) { last = {_prompt:prompt, error:'Прикрепите фото и голосовое'}; draw(); return; }
  if (m && m.image === 'required' && !genPhoto) { last = {_prompt:prompt, error:'Прикрепите фото'}; draw(); return; }
  if (!prompt && !genPhoto) return;
  if (m && m.image === 'forbidden' && !prompt) return;
  busy = true; draft = prompt; last = {_prompt:prompt}; draw();
  try {
    const r = await fetch('/api/generate',{method:'POST',headers:authHeaders(),body:JSON.stringify({
      prompt, model: me&&me.current_model, image: (m && m.image !== 'forbidden') ? genPhoto : null,
      audio: (m && m.audio) ? genVoice : null,
      audioSeconds: (m && m.audio) ? genVoiceSeconds : 0,
      quality: pickedQuality, duration: pickedDuration, format: pickedAspect,
      group: vkGroupId()
    })});
    const d = await r.json();
    if (!r.ok || d.error) throw new Error(d.error||'Ошибка');
    last = Object.assign({_prompt:prompt}, d);
    works = null;
    if (me) me.balance = d.balance;
    document.getElementById('bal').textContent = d.balance+' кр';
  } catch(e){ last = {_prompt:prompt, error:e.message}; }
  busy = false; draw();
}
async function sendTransfer(){
  const emailEl = document.getElementById('temail');

    if (msg) { msg.className = 'err'; msg.textContent = e.message; }

let pulling = false;

  const emailEl = document.getElementById('pemail');
  const passEl = document.getElementById('ppass');
  const amtEl = document.getElementById('pamt');
  const msg = document.getElementById('pmsg');
  const email = (emailEl&&emailEl.value||'').trim();
  const password = passEl&&passEl.value||'';
  const credits = parseInt(amtEl&&amtEl.value, 10);
  if (msg) { msg.className = 'hint'; msg.textContent = 'Переносим…'; }
  pulling = true;
  try {
    const r = await fetch('/api/transfer-in',{method:'POST',headers:authHeaders(),body:JSON.stringify({email, password, credits})});
    const d = await r.json();
    if (typeof d.balance === 'number') {
      if (me) {
        me.balance = d.balance;
        if (d.ok && Array.isArray(me.history)) me.history.unshift({ delta: credits, balance: d.balance, reason: 'Перенос с сайта · '+email });
      }

      const top = document.getElementById('topbal'); if (top) top.textContent = d.balance+' кр';
    }

    if (msg) msg.textContent = 'Готово. В боте сейчас '+d.balance+' кр. На сайте у '+email+' осталось '+(d.siteCredits!=null?d.siteCredits:'?')+'.';
    if (amtEl) amtEl.value = '';
    if (passEl) passEl.value = '';
  } catch (e) {
    if (msg) { msg.className = 'err'; msg.textContent = e.message; }
  } finally {
    pulling = false;
  }
}

function faceHtml(row){
  const photo = String(row.photo||'');
  if (/^https:\/\/([a-z0-9-]+\.)?(userapi\.com|vk\.com|vkuser\.net)\//i.test(photo)) return '<img class="ava" src="'+esc(photo)+'" alt="">';
  return '<div class="ava letter">'+esc((row.name||'?').trim().charAt(0))+'</div>';
}
function podiumFace(row){
  const photo = String(row.photo||'');

function renderRating(d){
  const rows = d.rows || [];
  const mine = d.mine;
  const podium = [1, 2, 3].map(function(place){
    const row = rows[place - 1];
    if (!row) return '<div class="col p'+place+'"><div class="bar"><div class="place">'+place+' место</div><b>свободно</b></div></div>';
    return '<div class="col p'+place+'"><div class="bar"><div class="place">'+place+' место</div>'+podiumFace(row)+'<b>'+esc(row.name)+'</b><span>'+row.points+'</span></div></div>';
  }).join('');
  const list = rows.slice(3).map(function(row, index){
    const place = index + 4;
    const cls = 'rank'+(mine && String(mine.userId)===String(row.userId)?' me':'');
    return '<div class="'+cls+'"><div class="medal">'+place+'</div>'+faceHtml(row)+'<div class="who"><b>'+esc(row.name)+'</b><span>лайки '+row.likes+' · комментарии '+row.comments+' · репосты '+row.reposts+'</span></div><div class="pts">'+row.points+'</div></div>';
  }).join('');
  const own = d.guest
    ? '<div class="now">Своё место видно после входа.</div>'
    : mine
    ? '<div class="now">Ваше место: <b>'+mine.place+'</b> · '+mine.points+' б.</div>'
    : '<div class="now">Вас пока нет в списке этого месяца.</div>';
  const rules = d.rules || {};
  return '<div class="card"><div class="kicker">Рейтинг</div><div class="cabbal" style="font-size:22px">'+esc(d.week||'Этот месяц')+'</div>'+
    '<div class="rules"><span>лайк '+(rules.like||0)+'</span><span>комментарий '+(rules.comment||0)+'</span><span>репост '+(rules.repost||0)+'</span><span>запрос '+(rules.bot||0)+'</span></div>'+
    '<div class="podium">'+podium+'</div>'+own+
    (list ? '<div class="groupttl">Дальше</div>'+list : (!rows.length ? '<p class="empty">В этом месяце пока тихо.</p>' : ''))+
    '<button class="btn" type="button" id="rate-shop">В магазин</button></div>';
}
function renderShop(d){
  const items = d.items || [];
  const goods = items.map(function(item){
    const photo = safeSrc(item.photo);
    const left = Number(item.stock) < 0 ? '' : '<div class="meta">осталось '+item.stock+'</div>';
    return '<div class="pack">'+(photo ? '<img alt="" src="'+esc(photo)+'" style="width:54px;height:54px;border-radius:12px;object-fit:cover">' : '')+
      '<div style="flex:1"><b>'+esc(item.title)+'</b><div class="meta">'+esc(item.body||'')+'</div>'+left+'<div class="meta">'+item.price+' бонусов</div></div>'+
      '<button type="button" data-buy="'+Number(item.id)+'">Взять</button></div>';
  }).join('') || '<p class="empty">Товаров пока нет. Можно оставить заявку на кредиты.</p>';
  const rows = d.honor || [];
  const honor = rows.map(function(row, index){
    const head = index === 0 || row.at !== rows[index - 1].at ? '<div class="groupttl">'+esc(row.at)+'</div>' : '';
    return head+'<div class="item"><span>'+row.place+'. '+esc(row.name)+'</span><b>'+row.points+' б.</b></div>';
  }).join('') || '<p class="empty">Прошлых месяцев в списке пока нет.</p>';
  const promos = d.promos || {};
  const mine = promos.mine;
  const offers = mine ? '' : (promos.offers||[]).map(function(item){
    return '<div class="pack"><div style="flex:1"><b>Промокод 15%</b><div class="meta">'+esc(item.title)+' · к оплате '+item.pay+' ₽</div></div><button type="button" data-promo="'+esc(item.packageId)+'">'+item.bonuses+' б.</button></div>';
  }).join('');
  const sale = (promos.sale||[]).map(function(item){
    return '<div class="pack"><div style="flex:1"><b>Промокод 15%</b><div class="meta">'+esc(item.title)+'</div></div><button type="button" data-promo-buy="'+Number(item.id)+'">'+item.price+' б.</button></div>';
  }).join('');
  const bought = (promos.bought||[]).map(function(item){
    return '<p class="now">'+esc(item.code)+' · '+esc(item.title)+(item.status==='open'?'':' · использован')+'</p>';
  }).join('');
  const own = mine ? '<p class="now">'+esc(mine.code)+' · '+esc(mine.title)+(mine.status==='open' && mine.usesLeft>0?'':' · использован')+'</p>' : '';
  const promoBlock = own+bought+offers+sale;
  return '<div class="card shophello"><div class="kicker">Магазин бонусов</div><div class="cabbal">'+(Number(d.bonuses)||0)+'</div><p class="now">Баллы закрытых месяцев. 10 бонусов = 1 кредит.</p></div>'+
    (shopNote ? '<p class="now">'+esc(shopNote)+'</p>' : '')+
    '<div class="groupttl">Промокод</div><div class="card">'+(promoBlock || '<p class="empty">Промокодов сейчас нет.</p>')+'</div>'+
    '<div class="groupttl">Товары</div><div class="card">'+goods+'</div>'+
    '<div class="groupttl">Кредиты</div><div class="card"><div class="pack"><input id="shop-amount" type="number" min="10" step="10" placeholder="Сколько бонусов" style="flex:1;background:#1c1233;border:1px solid var(--line);border-radius:10px;padding:8px"><button type="button" id="shop-credit">Обменять</button></div><p class="now">Заявка ждёт подтверждения.</p></div>'+
    '<div class="groupttl">Прошлые призёры</div><div class="card">'+honor+'</div>';
}
