<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Кабинет ВК · НейроЯга</title>
</head>
<body>
<p>Открываю кабинет…</p>
<script>
const q = new URLSearchParams(location.search);
const parts = [];
if (q.get('tk')) parts.push('tk=' + encodeURIComponent(q.get('tk')));
if (q.get('paid') === '1') parts.push('paid=1');
if (q.get('pkg')) parts.push('pkg=' + encodeURIComponent(q.get('pkg')));
location.replace('/?v=21#' + parts.join('&'));
</script>
</body>
</html>
