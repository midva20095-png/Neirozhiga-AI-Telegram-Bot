<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Кабинет ВК · НейроЯга</title>
</head>
<body>
<p>Открываю кабинет…</p>
<script>
const q = new URLSearchParams(location.search);
const dest = new URLSearchParams();
dest.set('v', '22');
q.forEach(function(value, key){
  if (key === 'sign' || key.indexOf('vk_') === 0 || key === 'tk' || key === 'pkg' || key === 'paid') dest.set(key, value);
});
const goal = (location.hash || '').replace(/^#/, '').split('&')[0].split('?')[0];
const hash = (goal === 'rate' || goal === 'site' || goal === 'sub') ? '#' + goal : '';
location.replace('/?' + dest.toString() + hash);
</script>
</body>
</html>
