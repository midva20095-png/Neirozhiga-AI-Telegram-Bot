<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Кабинет ВК · НейроЯга</title>
</head>
<body>
<p>Открываю кабинет…</p>
<script>
const q = new URLSearchParams(location.search);
const group = String(q.get('vk_group_id') || '').replace(/\D/g, '');
const hash = new URLSearchParams();
['tk', 'pkg', 'paid'].forEach(function(key){ if (q.get(key)) hash.set(key, q.get(key)); });
const goal = (location.hash || '').replace(/^#/, '').split('&')[0].split('?')[0];
const parts = [];
if (goal === 'rate' || goal === 'site' || goal === 'sub') parts.push(goal);
if (hash.toString()) parts.push(hash.toString());
location.replace('https://vk.ru/app54895627' + (group ? '_-' + group : '') + (parts.length ? '#' + parts.join('&') : ''));
</script>
</body>
</html>
