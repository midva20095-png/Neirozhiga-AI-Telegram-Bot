<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Админ · НейроЯга</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Unbounded:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0614;--card:#140c24;--text:#f3efff;--mut:#a79cc4;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--text);font:15px/1.45 Manrope,sans-serif;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));max-width:960px}
h1{font-family:Unbounded,sans-serif;font-size:22px;margin:0 0 4px}
h1 i{font-style:normal;background:linear-gradient(135deg,#00ffe0,#b366ff,#ff2d95);-webkit-background-clip:text;background-clip:text;color:transparent}
h3{margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#1c1233;outline:none}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 4px}
button{cursor:pointer;border:0;border-radius:12px;padding:10px 14px;font-weight:800;background:linear-gradient(135deg,#b366ff,#ff2d95);color:#fff}
.ghost{background:transparent;border:1px solid var(--line)}
.danger{background:transparent;border:1px solid rgba(255,80,120,.5);color:#ffb3c7}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.row>*{flex:1;min-width:120px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top;word-break:break-word}
th{color:var(--mut);font-size:12px}
.tabs{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap;overflow-x:auto}
.tabs button{padding:8px 12px}
.tabs button.off{background:transparent;border:1px solid var(--line)}
.ok{color:#3ee08f;font-weight:800}.bad{color:#ff8fb0;font-weight:800}
.note{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:#1c1233;border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .n{font-size:24px;font-weight:800}
.stat .l{color:var(--mut);font-size:12px}
.pill{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;margin-right:4px}
.mrow{display:grid;grid-template-columns:minmax(140px,1fr) 90px 120px 70px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.mrow .mname{font-weight:700}
.mrow input{padding:7px 9px}
.thumb{width:54px;height:54px;object-fit:cover;border-radius:8px;background:#1c1233}
.agallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.acard{background:#140c24;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.acard.off{opacity:.55}
.acard img,.acard .ph{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:center top;display:block;background:linear-gradient(150deg,#22164a,#0d2b3a)}
.abody{padding:10px 12px 12px}
.abody em{display:inline-block;margin-top:6px;font-style:normal;font-weight:800;color:#00d4ff}
.drop{display:block;margin-top:8px;border:1px dashed rgba(0,212,255,.55);border-radius:18px;background:#120a22;cursor:pointer;overflow:hidden;text-align:center}
.drop input{display:none}
.drop .pad{padding:28px 16px;font-weight:800}
.drop img{width:100%;max-height:360px;object-fit:cover;object-position:center top;display:block}
details{margin-top:12px}
details summary{cursor:pointer;color:var(--mut);font-weight:700}
.hero{width:100%;max-height:280px;object-fit:cover;border-radius:14px;background:#0b0614;margin-top:8px}
.filebtn{display:block;text-align:center;border:1px dashed rgba(255,255,255,.28);border-radius:14px;padding:14px;margin-top:8px;font-weight:800;cursor:pointer}
.filebtn input{display:none}
.check{display:flex;align-items:flex-start;gap:8px;margin-top:10px;color:var(--text);font-size:14px}
.check input{width:auto;margin-top:2px}
@media(max-width:640px){.mrow{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<h1>Админ <i>НейроЯга</i></h1>
<p class="note">Клиенты, кредиты, модели, пакеты, поддержка, рассылки и настройки бота.</p>

<div class="card" id="login">
  <div class="row"><input id="pass" type="password" placeholder="Пароль администратора"><button onclick="login()">Войти</button></div>
  <p id="lerr" class="bad"></p>
</div>

<div id="panel" style="display:none">
  <div class="tabs" id="tabs"></div>
  <div id="section-stats"></div>
  <div id="section-users"></div>
  <div id="section-tpl"></div>
  <div id="section-models"></div>
  <div id="section-journal"></div>
  <div id="section-packages"></div>
  <div id="section-tickets"></div>
  <div id="section-broadcast"></div>
  <div id="section-settings"></div>
</div>

<script>
const TABS = [
  ['stats','Статистика'],['users','Клиенты'],['tpl','Шаблоны'],['models','Модели'],
  ['packages','Пакеты'],['tickets','Поддержка'],['broadcast','Рассылка'],['journal','Журнал'],['settings','Настройки']
];
let token = sessionStorage.getItem('ny_admin_token') || null;
let cur = 'stats';
let users=[], templates=[], modelsData=[], groupsData={}, providersData={}, packagesData=[], generalData={};
const KINDNAME = {sys:'система', pay:'оплата', kie:'Kie', gen:'сбой', tpl:'шаблон'};
let tplEdit = null, tplImage = '', tplImageTouched = false, modelsMsg = '';

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function tgInit(){ try{ return (window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.initData)||''; }catch(e){ return ''; } }

async function api(path, opts){
  opts = opts||{};
  opts.headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  if (token) opts.headers['Authorization'] = 'Bearer '+token;
  const r = await fetch(path, opts);
  if (r.status===401){ logout(); throw new Error('Требуется вход'); }
  return r.json();
}

async function login(){
  const pass = document.getElementById('pass').value;
  const body = { password: pass };
  const init = tgInit(); if (init) body.initData = init;
  try{
    const r = await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d = await r.json();
    if (!r.ok || !d.token) throw new Error(d.error||'Неверный пароль');
    token = d.token; sessionStorage.setItem('ny_admin_token', token);
    showPanel();
  }catch(e){ document.getElementById('lerr').textContent = e.message; }
}
function logout(){ token=null; sessionStorage.removeItem('ny_admin_token'); document.getElementById('login').style.display='block'; document.getElementById('panel').style.display='none'; }

function renderTabs(){
  document.getElementById('tabs').innerHTML = TABS.map(([k,l])=>'<button class="'+(k===cur?'':'off')+'" onclick="go(\''+k+'\')">'+l+'</button>').join('');
}
function go(k){ cur=k; renderTabs(); TABS.forEach(([t])=>{ document.getElementById('section-'+t).style.display = t===k?'block':'none'; }); loadSection(k); }

async function showPanel(){
  document.getElementById('login').style.display='none';
  document.getElementById('panel').style.display='block';
  try{ await api('/api/admin/me'); }catch(e){ return; }
  renderTabs(); go('stats');
}

async function loadSection(k){
  if (k==='stats') return loadStats();
  if (k==='users') return loadUsers('');
  if (k==='tpl') return loadTpl();
  if (k==='models') return loadModels();
  if (k==='journal') return loadJournal();
  if (k==='packages') return loadPackages();
  if (k==='tickets') return loadTickets('open');
  if (k==='broadcast') return renderBroadcast();
  if (k==='settings') return loadSettings();
}

/* ---- Статистика ---- */
async function loadStats(){
  const el = document.getElementById('section-stats');
  el.innerHTML = '<div class="card">Загрузка…</div>';
  try{
    const {stats} = await api('/api/admin/stats');
    const cells = [
      ['Всего клиентов', stats.users_total],['Активны за сутки', stats.active_day],
      ['Новые за сутки', stats.new_day],['В чёрном списке', stats.users_blocked],
      ['Кредитов на балансах', stats.balance_total],['Генераций всего', stats.gens_total],
      ['Потрачено кредитов', stats.spent_total],['Начислено всего', stats.credited_total],
      ['Открытых обращений', stats.tickets_open]
    ];
    el.innerHTML = '<div class="card"><h3>Статистика</h3><div class="grid">'+
      cells.map(c=>'<div class="stat"><div class="n">'+(c[1]??0)+'</div><div class="l">'+c[0]+'</div></div>').join('')+'</div></div>';
  }catch(e){ el.innerHTML = '<div class="card bad">'+esc(e.message)+'</div>'; }
}

/* ---- Клиенты ---- */
async function loadUsers(q){
  const el = document.getElementById('section-users');
  const d = await api('/api/admin/users?q='+encodeURIComponent(q||''));
  users = d.users||[];
  el.innerHTML =
    '<div class="card"><div class="row"><input id="q" placeholder="Поиск по ID или @username" value="'+esc(q||'')+'"><button onclick="loadUsers(document.getElementById(\'q\').value)">Найти</button></div>'+
    '<table><tr><th>ID</th><th>Юзер</th><th>Баланс</th><th>Модель</th><th>Ген.</th><th>Статус</th><th></th></tr>'+
    users.map(u=>'<tr><td>'+u.user_id+'</td><td>'+esc(u.username||'')+'</td><td class="ok">'+u.balance+'</td><td>'+esc(u.current_model||'')+'</td><td>'+(u.gens||0)+'</td><td>'+(u.blocked?'<span class="bad">ЧС</span>':'—')+'</td><td><button class="ghost" onclick="editUser('+"'"+u.user_id+"'"+')">Открыть</button></td></tr>').join('')+
    '</table></div><div class="card" id="uedit" style="display:none"></div>';
}
function editUser(id){
  const u = users.find(x=>String(x.user_id)===String(id));
  const box = document.getElementById('uedit');
  box.style.display='block';
  box.innerHTML = '<h3>Клиент '+id+(u&&u.username?(' · '+esc(u.username)):'')+'</h3>'+
    '<div class="row"><input id="delta" type="number" placeholder="+100 или -50"><input id="reason" placeholder="Причина (видна в истории)"></div>'+
    '<div class="row"><button onclick="applyBal('+"'"+id+"'"+')">Начислить / списать</button>'+
    '<button class="danger" onclick="toggleBan('+"'"+id+"'"+','+(u&&u.blocked?'false':'true')+')">'+(u&&u.blocked?'Убрать из ЧС':'В чёрный список')+'</button></div>'+
    '<label>Личное сообщение клиенту</label><textarea id="pm" placeholder="Текст сообщения"></textarea>'+
    '<div class="row" style="margin-top:8px"><button onclick="sendPm('+"'"+id+"'"+')">Отправить сообщение</button></div><p id="umsg"></p>';
}
async function applyBal(id){
  const delta = parseInt(document.getElementById('delta').value,10);
  const reason = document.getElementById('reason').value.trim()||'Админ';
  if (!delta) return alert('Укажите сумму');
  const d = await api('/api/admin/balance',{method:'POST',body:JSON.stringify({userId:id,delta,reason})});
  document.getElementById('umsg').textContent = d.ok?('Новый баланс: '+d.balance):(d.error||'Ошибка');
  if (d.ok) loadUsers(document.getElementById('q').value);
}
async function toggleBan(id, blocked){
  const d = await api('/api/admin/block',{method:'POST',body:JSON.stringify({userId:id,blocked})});
  document.getElementById('umsg').textContent = d.ok?(d.blocked?'В чёрном списке':'Убран из списка'):'Ошибка';
  if (d.ok) loadUsers(document.getElementById('q').value);
}
async function sendPm(id){
  const text = document.getElementById('pm').value.trim();
  if (!text) return alert('Введите текст');
  const d = await api('/api/admin/message',{method:'POST',body:JSON.stringify({userId:id,text})});
  document.getElementById('umsg').textContent = d.ok?'Сообщение отправлено':(d.error||'Ошибка');
}

/* ---- Шаблоны ---- */
const TCATS = [['image','Картинки'],['fix','Улучшение фото'],['chat','Текст'],['video','Видео'],['audio','Голос']];
function fileToJpeg(file, max, quality){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * scale));
      const h = Math.max(1, Math.round(img.height * scale));
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Не удалось прочитать фото')); };
    img.src = url;
  });
}
function safeImg(u){
  const s = String(u||'');
  if (/^https?:\/\//i.test(s)) return s;
  if (/^data:image\/(jpeg|jpg|png|webp);base64,/i.test(s)) return s;
  return '';
}
function serviceName(id){ return providersData[id] || id || 'Другой сервис'; }
function modelOptions(current){
  const list = modelsData.slice();
  if (current && !list.some(m=>m.key===current)) list.unshift({key:current, name:current+' (как сохранено)', cost:null, provider:''});
  if (!list.length) list.push({key:'nanobanana', name:'Картинка', cost:20, provider:'google', group:'image'});
  const order = Object.keys(providersData);
  const used = {};
  let html = '';
  function opts(rows){
    return rows.map(m=>'<option value="'+esc(m.key)+'"'+(m.key===current?' selected':'')+'>'+esc(m.name)+(groupsData[m.group]?' · '+esc(groupsData[m.group]):'')+(m.cost!=null?' · '+m.cost+' кр':'')+'</option>').join('');
  }
  order.forEach(id=>{
    const rows = list.filter(m=>m.provider===id);
    if (!rows.length) return;
    rows.forEach(m=>{ used[m.key]=1; });
    html += '<optgroup label="'+esc(serviceName(id))+'">'+opts(rows)+'</optgroup>';
  });
  const rest = list.filter(m=>!used[m.key]);
  if (rest.length) html += '<optgroup label="Как сохранено">'+opts(rest)+'</optgroup>';
  return html;
}
function modeCost(model, qualityId, duration){
  if (!model) return '';
  const list = model.qualities || [];
  if (list.length) {
    const q = list.find(x=>x.id===qualityId) || list.find(x=>x.id===model.quality) || list[0];
    if (!q) return model.cost;
    if (q.perSec) return q.cost * (Number(duration) || (model.durations && model.durations[0]) || 1);
    return q.cost;
  }
  const prices = model.durationPrices || {};
  if (duration != null && prices[String(duration)] != null) return prices[String(duration)];
  if (model.perSec && duration) return (model.rate || model.cost) * Number(duration);
  return model.cost;
}
function modeBlock(model, selectedQuality, selectedDuration){
  if (!model) return '';
  let html = '';
  const list = model.qualities || [];
  if (list.length > 1) {
    const cur = list.some(q=>q.id===selectedQuality) ? selectedQuality : (model.quality || list[0].id);
    html += '<label>Режим. Здесь дешёвый и обычный вариант одной модели</label><select id="tqmode">'+
      list.map(q=>'<option value="'+esc(q.id)+'"'+(q.id===cur?' selected':'')+'>'+esc(q.name)+' · '+q.cost+(q.perSec?' кр/сек':' кр')+(q.desc?' · '+esc(q.desc):'')+'</option>').join('')+
      '</select>';
  }
  const durs = model.durations || [];
  if (durs.length > 1) {
    const cur = durs.map(Number).includes(Number(selectedDuration)) ? Number(selectedDuration) : Number(durs[0]);
    const qid = list.some(q=>q.id===selectedQuality) ? selectedQuality : (model.quality || (list[0] && list[0].id));
    html += '<label>Длина</label><select id="tdur">'+
      durs.map(d=>'<option value="'+d+'"'+(Number(d)===cur?' selected':'')+'>'+d+' сек · '+modeCost(model, qid, d)+' кр</option>').join('')+
      '</select>';
  }
  return html;
}
async function loadTpl(){
  const el = document.getElementById('section-tpl');
  if (!modelsData.length || !Object.keys(providersData).length) {
    const md = await api('/api/admin/models');
    modelsData = md.models||[];
    groupsData = md.groups||{};
    providersData = md.providers||{};
  }
  const d = await api('/api/admin/templates');
  templates = d.templates||[];
  const editing = tplEdit;
  const preferred = modelsData.some(m=>m.key==='kie-banana-lite') ? 'kie-banana-lite' : 'nanobanana';
  const currentModel = editing && editing.model ? editing.model : preferred;
  const current = modelsData.find(m=>m.key===currentModel);
  const link = editing && /^https?:\/\//i.test(editing.image||'') && !tplImageTouched ? editing.image : '';
  const preview = safeImg(tplImage);
  const startQuality = editing && editing.quality ? editing.quality : (current && current.quality);
  const startDuration = editing && editing.duration ? editing.duration : (current && current.durations && current.durations[0]);
  const startCost = editing ? editing.cost : modeCost(current, startQuality, startDuration);
  el.innerHTML =
    '<div class="card"><h3>'+(editing?'Правка шаблона':'Новый шаблон')+'</h3>'+
    '<p class="note">Четыре поля. Фото — это пример, который человек видит на карточке. Название — подпись карточки. Текст ниже — что сделать с его фото; сам человек этот текст не видит. Цена — сколько списать в кабинете.</p>'+
    '<label>1. Фото-пример</label>'+
    '<label class="drop">'+(preview?'<img id="tpreview" src="'+esc(preview)+'" alt="">':'<div class="pad" id="tpad">Нажмите и выберите фото с телефона или компьютера</div>')+
    '<input id="tfile" type="file" accept="image/*"></label>'+
    (preview?'<button class="ghost" type="button" onclick="clearTplPhoto()" style="margin-top:8px">Убрать фото</button>':'')+
    '<label>2. Название</label><input id="tt" placeholder="Например: Портрет в неоне" value="'+esc(editing?editing.title:'')+'">'+
    '<label>3. Что должна сделать нейросеть. Человек это не видит</label><textarea id="tp" placeholder="Опишите стиль, свет и что оставить от фото человека">'+esc(editing?editing.prompt:'')+'</textarea>'+
    '<label>4. Модель и цена для человека</label>'+
    '<div class="row"><select id="tm">'+modelOptions(currentModel)+'</select>'+
      '<input id="tcost" type="number" min="0" placeholder="Цена, кр" value="'+startCost+'"'+(editing?' data-lock="1"':'')+'></div>'+
    '<div id="tmodes">'+modeBlock(current, startQuality, startDuration)+'</div>'+
    '<p class="note">Запрос уходит в выбранную модель и в выбранный режим. У Nano Banana «Эконом» — 3 кредита, «Быстро» — 6. Цена подставляется из режима, её можно изменить. Если сервис молчит, выключите его на вкладке «Модели».</p>'+
    '<label class="check"><input id="tactive" type="checkbox" '+(!editing||editing.active!==false?'checked':'')+'> Показывать в кабинете</label>'+
    '<details'+(editing?' open':'')+'><summary>Дополнительно: описание, раздел, ссылка, размеры</summary>'+
    '<label>Короткое описание под заголовком</label><input id="tdesc" placeholder="Что получится" value="'+esc(editing&&editing.description?editing.description:'')+'">'+
    '<label>Раздел в кабинете</label><select id="tc">'+TCATS.map(c=>'<option value="'+c[0]+'"'+((editing?editing.category:'image')===c[0]?' selected':'')+'>'+c[1]+'</option>').join('')+'</select>'+
    '<label>Ссылка на картинку, если фото не загружаете файлом</label><input id="timg" placeholder="https://..." value="'+esc(link)+'">'+
    '<label>Размеры через запятую. Пусто — все размеры выбранной модели</label><input id="tfmt" placeholder="9:16, 1:1" value="'+esc(editing&&editing.formats?editing.formats:'')+'">'+
    '<label>Порядок. Меньше число — выше в списке</label><input id="tsort" type="number" placeholder="0" value="'+(editing&&editing.sort?editing.sort:0)+'">'+
    '<label class="check"><input id="thide" type="checkbox" checked disabled> Текст запроса остаётся в админке. В кабинете его нет: только пример, своё фото и результат</label>'+
    '</details>'+
    '<div class="row" style="margin-top:12px"><button onclick="saveTpl()">'+(editing?'Сохранить изменения':'Добавить шаблон в кабинет')+'</button>'+
    (editing?'<button class="ghost" type="button" onclick="newTpl()">Отмена</button>':'')+'</div></div>'+
    '<div class="card"><h3>Как это видит человек</h3><p class="note">'+templates.length+' шаблон'+(templates.length===1?'':'ов')+'. Скрытые в кабинет не попадают. Карточка вертикальная, как на сайте: фото, название и цена.</p>'+
    (templates.length ? '<div class="agallery">'+templates.map(t=>{
      const src = safeImg(t.image);
      const saved = modelsData.find(m=>m.key===t.model);
      const from = saved ? serviceName(saved.provider) : 'модель не из списка';
      const picked = saved && (saved.qualities||[]).find(x=>x.id===t.quality);
      const mode = picked ? ' · '+picked.name : (t.duration ? ' · '+t.duration+' сек' : '');
      return '<div class="acard'+(t.active?'':' off')+'">'+(src?'<img src="'+esc(src)+'" alt="">':'<div class="ph"></div>')+
        '<div class="abody"><b>'+esc(t.title)+'</b><div><em>'+t.cost+' кр.</em></div><div class="note">'+esc(from)+' · '+esc((saved&&saved.name)||t.model||'')+esc(mode)+(t.active?'':' · скрыт')+'</div>'+
        '<div class="row" style="margin:8px 0 0"><button class="ghost" onclick="editTpl('+t.id+')">Править</button>'+
        '<button class="ghost" onclick="toggleTpl('+t.id+')">'+(t.active?'Скрыть':'Показать')+'</button>'+
        '<button class="ghost" onclick="tplLink('+t.id+')">Ссылка</button>'+
        '<button class="ghost" onclick="tplChannel('+t.id+')">В канал</button>'+
        '<button class="danger" onclick="delTpl('+t.id+')">Удалить</button></div></div></div>';
    }).join('')+'</div>' : '<p class="note">Пока пусто. Загрузите фото, напишите название и нажмите «Добавить шаблон в кабинет».</p>')+
    '</div>';
  const file = document.getElementById('tfile');
  if (file) file.onchange = () => onTplPhoto(file);
  const tm = document.getElementById('tm');
  const tcost = document.getElementById('tcost');
  function applyModePrice(force){
    if (!tm || !tcost) return;
    if (!force && tcost.dataset.lock === '1') return;
    const m = modelsData.find(x=>x.key===tm.value);
    const q = (document.getElementById('tqmode')||{}).value;
    const d = (document.getElementById('tdur')||{}).value;
    const price = modeCost(m, q, d);
    if (price != null && price !== '') tcost.value = price;
  }
  function bindModes(){
    const q = document.getElementById('tqmode');
    const d = document.getElementById('tdur');
    if (q) q.onchange = () => applyModePrice(true);
    if (d) d.onchange = () => applyModePrice(true);
  }
  if (tm) tm.onchange = () => {
    const box = document.getElementById('tmodes');
    const m = modelsData.find(x=>x.key===tm.value);
    if (box) box.innerHTML = modeBlock(m, m && m.quality, m && m.durations && m.durations[0]);
    bindModes();
    applyModePrice(false);
  };
  bindModes();
  if (tcost) tcost.oninput = () => { tcost.dataset.lock = '1'; };
}
function newTpl(){ tplEdit = null; tplImage = ''; tplImageTouched = false; loadTpl(); }
function editTpl(id){
  tplEdit = templates.find(t=>t.id===id) || null;
  tplImage = tplEdit && tplEdit.image ? tplEdit.image : '';
  tplImageTouched = false;
  loadTpl();
}
function clearTplPhoto(){
  tplImage = '';
  tplImageTouched = true;
  const drop = document.querySelector('#section-tpl .drop');
  const img = document.getElementById('tpreview');
  const link = document.getElementById('timg');
  if (img) img.remove();
  if (drop && !document.getElementById('tpad')) {
    const pad = document.createElement('div');
    pad.className = 'pad';
    pad.id = 'tpad';
    pad.textContent = 'Нажмите и выберите фото с телефона или компьютера';
    drop.insertBefore(pad, drop.firstChild);
  }
  if (link) link.value = '';
}
async function onTplPhoto(input){
  const file = input.files && input.files[0];
  if (!file) return;
  try {
    let data = await fileToJpeg(file, 900, 0.72);
    if (data.length > 700000) data = await fileToJpeg(file, 640, 0.66);
    tplImage = data;
    tplImageTouched = true;
    const drop = document.querySelector('#section-tpl .drop');
    let img = document.getElementById('tpreview');
    const pad = document.getElementById('tpad');
    if (pad) pad.remove();
    if (!img && drop) {
      img = document.createElement('img');
      img.id = 'tpreview';
      drop.insertBefore(img, drop.firstChild);
    }
    if (img) { img.src = data; img.style.display = 'block'; }
  } catch (e) { alert(e.message); }
}
function chosenImage(){
  const url = (document.getElementById('timg').value || '').trim();
  if (tplImageTouched) return tplImage || '';
  if (/^https?:\/\//i.test(url)) return url;
  return tplImage || '';
}
async function saveTpl(){
  const body = {
    id: tplEdit ? tplEdit.id : undefined,
    title: document.getElementById('tt').value.trim(),
    category: document.getElementById('tc').value,
    model: document.getElementById('tm').value.trim() || 'nanobanana',
    cost: +document.getElementById('tcost').value || 0,
    sort: +document.getElementById('tsort').value || 0,
    image: chosenImage(),
    description: document.getElementById('tdesc').value.trim(),
    formats: document.getElementById('tfmt').value.trim(),
    prompt: document.getElementById('tp').value.trim(),
    quality: (document.getElementById('tqmode')||{}).value || '',
    duration: (document.getElementById('tdur')||{}).value || '',
    hide_prompt: true,
    active: document.getElementById('tactive').checked
  };
  if (!body.title || !body.prompt) return alert('Нужны название и промпт');
  const d = await api('/api/admin/templates',{method:'POST',body:JSON.stringify(body)});
  if (!d.ok) return alert(d.error||'Ошибка');
  newTpl();
}
async function toggleTpl(id){
  const t = templates.find(x=>x.id===id);
  if (!t) return;
  const d = await api('/api/admin/templates',{method:'POST',body:JSON.stringify({
    id: t.id, title: t.title, category: t.category, model: t.model, cost: t.cost, sort: t.sort||0,
    image: t.image, description: t.description, formats: t.formats, prompt: t.prompt,
    quality: t.quality || '', duration: t.duration || '',
    hide_prompt: true, active: !t.active
  })});
  if (!d.ok) return alert(d.error||'Ошибка');
  loadTpl();
}
async function delTpl(id){ if(!confirm('Удалить шаблон?'))return; await api('/api/admin/templates/delete',{method:'POST',body:JSON.stringify({id})}); loadTpl(); }
async function tplLink(id){
  try {
    const d = await api('/api/admin/templates/link',{method:'POST',body:JSON.stringify({id})});
    if (!d.url) { alert(d.error||'Ссылка не собрана'); return; }
    try { await navigator.clipboard.writeText(d.url); alert('Ссылка скопирована:\n'+d.url); }
    catch (e) { prompt('Ссылка на шаблон', d.url); }
  } catch (e) { alert(e.message); }
}
async function tplChannel(id){
  if (!confirm('Опубликовать шаблон в канале? Текст задания в пост не попадёт.')) return;
  try {
    const d = await api('/api/admin/templates/channel',{method:'POST',body:JSON.stringify({id})});
    alert(d.ok ? 'Шаблон опубликован в канале.' : (d.error||'Не удалось опубликовать'));
  } catch (e) { alert(e.message); }
}

/* ---- Модели ---- */
function modelRow(m){
  return '<div class="mrow" data-key="'+m.key+'" data-provider="'+esc(m.provider||'')+'">'+
    '<div><div class="mname">'+esc(m.name)+'</div><div class="note">'+esc((groupsData[m.group]||m.group||'')+' · '+m.key)+'</div></div>'+
    '<div><label style="margin:0">Цена</label><input type="number" class="f-cost" value="'+m.cost+'"></div>'+
    (m.provider==='giga'
      ? '<div class="lim"><label style="margin:0">В день</label><input type="number" min="0" class="f-limit" placeholder="без лимита" value="'+(m.limit==null?'':m.limit)+'"></div>'
      : '<div class="lim"><label style="margin:0">В день</label><input class="f-limit" disabled value="—"></div>')+
    '<div><label style="margin:0">Вкл</label><input type="checkbox" class="f-en" '+(m.enabled?'checked':'')+' style="width:auto;height:22px"></div>'+
    '</div>';
}
async function loadModels(){
  const el = document.getElementById('section-models');
  const d = await api('/api/admin/models');
  modelsData = d.models||[]; groupsData = d.groups||{}; providersData = d.providers||{};
  let html = '<div class="card"><h3>Модели</h3><p class="note">Модели разложены по сервису, откуда идёт запрос. Если сервис упал, нажмите «Выключить» у его блока и сохраните: эти модели пропадут из бота, кабинета и шаблонов. «Включить» возвращает их. Цена сохраняется. 0 — бесплатно. У моделей с режимами цена задаёт базовый запуск. Для GigaChat поле «В день» — потолок, пустое поле снимает лимит.</p><p class="note">Kie сейчас '+(d.kie?'<b class="ok">подключён</b>.':'<b class="bad">без ключа</b>, раздел и так скрыт.')+'</p>'+(modelsMsg?'<p class="ok">'+esc(modelsMsg)+'</p>':'');
  const order = Object.keys(providersData);
  const used = {};
  function block(id, title, list){
    if (!list.length) return '';
    const on = list.filter(m=>m.enabled).length;
    return '<div class="note" style="margin:16px 0 6px"><b>'+esc(title)+'</b> · включено '+on+' из '+list.length+'</div>'+
      '<div class="row" style="margin-bottom:6px"><button type="button" class="ghost" onclick="setService(\''+esc(id)+'\', false)">Выключить</button>'+
      '<button type="button" class="ghost" onclick="setService(\''+esc(id)+'\', true)">Включить</button></div>'+
      list.map(modelRow).join('');
  }
  order.forEach(id=>{
    const list = modelsData.filter(m=>m.provider===id);
    list.forEach(m=>{ used[m.key]=1; });
    html += block(id, serviceName(id), list);
  });
  const rest = modelsData.filter(m=>!used[m.key]);
  html += block('', 'Другой сервис', rest);
  html += '<div class="row" style="margin-top:12px"><button onclick="saveModels()">Сохранить модели</button></div><p id="mmsg"></p></div>';
  el.innerHTML = html;
}
function setService(provider, on){
  document.querySelectorAll('#section-models .mrow').forEach(row=>{
    if ((row.dataset.provider||'')===provider) row.querySelector('.f-en').checked = on;
  });
}
async function saveModels(){
  const models = {};
  document.querySelectorAll('#section-models .mrow').forEach(row=>{
    const key = row.dataset.key;
    const limEl = row.querySelector('.f-limit');
    models[key] = {
      cost: row.querySelector('.f-cost').value,
      enabled: row.querySelector('.f-en').checked
    };
    if (limEl && !limEl.disabled) models[key].limit = limEl.value.trim()==='' ? null : Number(limEl.value);
  });
  const d = await api('/api/admin/models',{method:'POST',body:JSON.stringify({models})});
  if (!d.ok) { modelsMsg = ''; alert(d.error||'Ошибка'); return; }
  modelsMsg = 'Сохранено';
  await loadModels();
}

/* ---- Пакеты ---- */
async function loadJournal(){
  const el = document.getElementById('section-journal');
  el.innerHTML = '<div class="card">Загрузка…</div>';
  try{
    const d = await api('/api/admin/journal');
    const items = d.items || [];
    const rows = items.map(it=>{
      const t = it.created_at ? new Date(it.created_at).toLocaleString('ru-RU') : '';
      const kind = KINDNAME[it.kind] || it.kind;
      return '<tr><td>'+esc(t)+'</td><td>'+esc(kind)+'</td><td>'+esc(it.message)+'</td></tr>';
    }).join('');
    el.innerHTML = '<div class="card"><h3>Журнал</h3><p class="note">Шаблоны пишутся отдельно: старт, размер фото, модель и ответ сервиса, если фото или генерация не прошли. Текст запроса сюда не попадает. «Недостаточно кредитов» не пишется.</p>'+
      (rows?'<table><tr><th>Когда</th><th></th><th>Событие</th></tr>'+rows+'</table>':'<p class="note">Пока пусто. После перезапуска здесь появится «Бот запущен».</p>')+
      '<div class="row" style="margin-top:12px"><button class="ghost" onclick="loadJournal()">Обновить</button></div></div>';
  }catch(e){ el.innerHTML = '<div class="card"><p class="bad">'+esc(e.message)+'</p></div>'; }
}

async function loadPackages(){
  const el = document.getElementById('section-packages');
  const d = await api('/api/admin/packages'); packagesData = d.packages||[];
  renderPackages();
}
function renderPackages(){
  const el = document.getElementById('section-packages');
  el.innerHTML = '<div class="card"><h3>Пакеты пополнения</h3><div id="pkgrows">'+
    packagesData.map((p,i)=>pkgRow(p,i)).join('')+'</div>'+
    '<div class="row" style="margin-top:8px"><button class="ghost" onclick="addPkg()">+ Пакет</button><button onclick="savePackages()">Сохранить пакеты</button></div><p id="pmsg"></p></div>';
}
function pkgRow(p,i){
  return '<div class="row" data-i="'+i+'"><input class="p-title" placeholder="Название" value="'+esc(p.title||'')+'">'+
    '<input class="p-credits" type="number" placeholder="Кредиты" value="'+(p.credits||'')+'">'+
    '<input class="p-price" type="number" placeholder="Цена ₽" value="'+(p.price||'')+'">'+
    '<button class="danger" onclick="rmPkg('+i+')" style="flex:0 0 auto">✕</button></div>';
}
function collectPkg(){
  const arr=[];
  document.querySelectorAll('#pkgrows .row').forEach(r=>{
    arr.push({ title:r.querySelector('.p-title').value, credits:r.querySelector('.p-credits').value, price:r.querySelector('.p-price').value });
  });
  return arr;
}
function addPkg(){ packagesData = collectPkg(); packagesData.push({title:'',credits:'',price:''}); renderPackages(); }
function rmPkg(i){ packagesData = collectPkg(); packagesData.splice(i,1); renderPackages(); }
async function savePackages(){
  const d = await api('/api/admin/packages',{method:'POST',body:JSON.stringify({packages:collectPkg()})});
  if (d.ok){ packagesData = d.packages||[]; renderPackages(); document.getElementById('pmsg').textContent='Сохранено'; }
  else alert(d.error||'Ошибка');
}

/* ---- Поддержка ---- */
async function loadTickets(status){
  const el = document.getElementById('section-tickets');
  const d = await api('/api/admin/tickets?status='+encodeURIComponent(status||'open'));
  const list = d.tickets||[];
  el.innerHTML = '<div class="card"><div class="row">'+
    ['open','answered','all'].map(s=>'<button class="'+(s===status?'':'ghost')+'" onclick="loadTickets(\''+s+'\')">'+({open:'Открытые',answered:'Отвеченные',all:'Все'}[s])+'</button>').join('')+'</div></div>'+
    (list.length?list.map(t=>'<div class="card"><div class="note">#'+t.id+' · '+esc(t.username||t.user_id)+' · '+esc(t.source)+' · '+(t.status==='open'?'<span class="bad">открыт</span>':'<span class="ok">отвечен</span>')+'</div>'+
      '<p>'+esc(t.message)+'</p>'+(t.answer?('<p class="note">Ответ: '+esc(t.answer)+'</p>'):('<textarea id="ans-'+t.id+'" placeholder="Ответ клиенту"></textarea><div class="row" style="margin-top:8px"><button onclick="answer('+t.id+')">Ответить</button></div>'))+
      '</div>').join(''):'<div class="card"><div class="note">Нет обращений</div></div>');
}
async function answer(id){
  const ta = document.getElementById('ans-'+id);
  const answer = (ta&&ta.value||'').trim();
  if (!answer) return alert('Введите ответ');
  const d = await api('/api/admin/tickets/answer',{method:'POST',body:JSON.stringify({id,answer})});
  if (d.ok) loadTickets('open'); else alert(d.error||'Ошибка');
}

/* ---- Рассылка ---- */
function renderBroadcast(){
  document.getElementById('section-broadcast').innerHTML =
    '<div class="card"><h3>Рассылка</h3><p class="note">Сообщение получат все клиенты, кроме чёрного списка. Поддерживается Markdown.</p>'+
    '<textarea id="bcast" placeholder="Текст рассылки"></textarea>'+
    '<div class="row" style="margin-top:8px"><button onclick="sendBroadcast()">Отправить всем</button></div><p id="bmsg"></p></div>';
}
async function sendBroadcast(){
  const text = document.getElementById('bcast').value.trim();
  if (!text) return alert('Введите текст');
  if (!confirm('Отправить рассылку всем клиентам?')) return;
  document.getElementById('bmsg').textContent = 'Отправка…';
  const d = await api('/api/admin/broadcast',{method:'POST',body:JSON.stringify({text})});
  document.getElementById('bmsg').textContent = d.ok?('Готово: доставлено '+d.sent+' из '+d.total+(d.failed?(', ошибок '+d.failed):'')):(d.error||'Ошибка');
}

/* ---- Настройки ---- */
async function loadSettings(){
  const el = document.getElementById('section-settings');
  const d = await api('/api/admin/general'); generalData = d.general||{};
  const models = d.models||[];
  el.innerHTML = '<div class="card"><h3>Общие настройки</h3>'+
    '<label>Приветственный бонус (кредитов новым клиентам)</label><input id="g-bonus" type="number" value="'+(generalData.start_bonus||0)+'">'+
    '<label>Модель по умолчанию</label><select id="g-model">'+models.map(m=>'<option value="'+m.key+'"'+(m.key===generalData.default_model?' selected':'')+'>'+esc(m.short||m.key)+'</option>').join('')+'</select>'+
    '<label>Ссылка на сайт (кнопка в кабинете)</label><input id="g-site" value="'+esc(generalData.site_url||'')+'">'+
    '<label>Поддержка включена</label><select id="g-support"><option value="1"'+(generalData.support_enabled!==false?' selected':'')+'>Да</option><option value="0"'+(generalData.support_enabled===false?' selected':'')+'>Нет</option></select>'+
    '<label>Текст справки</label><textarea id="g-help" style="min-height:140px">'+esc(generalData.help_text||'')+'</textarea>'+
    '<div class="row" style="margin-top:12px"><button onclick="saveSettings()">Сохранить настройки</button></div><p id="gmsg"></p></div>';
}
async function saveSettings(){
  const general = {
    start_bonus: +document.getElementById('g-bonus').value||0,
    default_model: document.getElementById('g-model').value,
    site_url: document.getElementById('g-site').value.trim(),
    support_enabled: document.getElementById('g-support').value==='1',
    help_text: document.getElementById('g-help').value.trim()
  };
  const d = await api('/api/admin/general',{method:'POST',body:JSON.stringify({general})});
  document.getElementById('gmsg').textContent = d.ok?'Сохранено':(d.error||'Ошибка');
}
