<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Админ · НейроЯга Бот</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&family=Unbounded:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0614;--card:#140c24;--text:#f3efff;--mut:#a79cc4;--accent:#b366ff;--pink:#ff2d95}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Manrope,sans-serif;padding:16px}
h1{font-family:Unbounded,sans-serif;font-size:20px;margin:0 0 16px}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;border:1px solid rgba(255,255,255,.06)}
input,button{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:#1c1233;color:inherit}
button{background:linear-gradient(135deg,#b366ff,#ff2d95);border:0;font-weight:700;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid rgba(255,255,255,.06)}
th{color:var(--mut);font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.row input{flex:1;min-width:120px}
.ok{color:#3ee08f}
.bad{color:#ff6b8a}
</style>
</head>
<body>
<h1>Админ-панель бота</h1>

<div class="card" id="login">
  <div class="row">
    <input id="pass" type="password" placeholder="Пароль">
    <button onclick="login()">Войти</button>
  </div>
  <p id="err" class="bad"></p>
</div>

<div id="panel" style="display:none">
  <div class="card">
    <div class="row">
      <input id="q" placeholder="Поиск user_id">
      <button onclick="load()">Найти</button>
      <button onclick="load('')">Все</button>
    </div>
    <div id="list">Загрузка...</div>
  </div>

  <div class="card" id="edit" style="display:none">
    <h3>Пользователь <span id="uid"></span></h3>
    <div class="row">
      <input id="delta" type="number" placeholder="+100 или -50">
      <input id="reason" placeholder="Причина">
      <button onclick="changeBalance()">Применить</button>
    </div>
    <div class="row" style="margin-top:10px">
      <button onclick="toggleBlock()">В чёрный список / Убрать</button>
    </div>
    <p id="msg"></p>
  </div>
</div>

<script>
const PASS = 'admin123';
let token = sessionStorage.getItem('botadmin') || '';

function login() {
  if (document.getElementById('pass').value === PASS) {
    sessionStorage.setItem('botadmin', '1');
    document.getElementById('login').style.display = 'none';
    document.getElementById('panel').style.display = 'block';
    load();
  } else document.getElementById('err').textContent = 'Неверный пароль';
}
if (token) { document.getElementById('login').style.display='none'; document.getElementById('panel').style.display='block'; load(); }

async function load(q='') {
  const r = await fetch('/api/admin/users?q='+encodeURIComponent(q));
  const d = await r.json();
  document.getElementById('list').innerHTML = '<table><tr><th>ID</th><th>Баланс</th><th>Модель</th><th>Статус</th><th></th></tr>' +
    (d.users||[]).map(u=>`<tr>
      <td>${u.user_id}</td>
      <td class="ok">${u.balance}</td>
      <td>${u.current_model||'—'}</td>
      <td>${u.blocked?'<span class="bad">ЧС</span>':'—'}</td>
      <td><button onclick="edit('${u.user_id}')">Изменить</button></td>
    </tr>`).join('') + '</table>';
}

function edit(id) {
  document.getElementById('edit').style.display = 'block';
  document.getElementById('uid').textContent = id;
  document.getElementById('edit').dataset.uid = id;
}

async function changeBalance() {
  const uid = document.getElementById('edit').dataset.uid;
  const delta = +document.getElementById('delta').value;
  if (!delta) return alert('Укажите сумму');
  const r = await fetch('/api/admin/balance', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:uid,delta})});
  const d = await r.json();
  document.getElementById('msg').textContent = d.ok ? `Баланс: ${d.balance}` : (d.error||'Ошибка');
  if (d.ok) load();
}

async function toggleBlock() {
  const uid = document.getElementById('edit').dataset.uid;
  const r = await fetch('/api/admin/block', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:uid})});
  const d = await r.json();
  document.getElementById('msg').textContent = d.ok ? (d.blocked?'В чёрном списке':'Убран из ЧС') : 'Ошибка';
  if (d.ok) load();
}
</script>
</body>
</html>
