<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Админ-панель бота</title>
<style>
*{box-sizing:border-box}
:root{--bg:#0b0614;--card:#1c1233;--tx:#f3efff;--mut:#a79cc4;--accent:#9d4dff;--ok:#3ee08f}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,sans-serif;padding:20px}
.wrap{max-width:1100px;margin:0 auto}
h1{margin:0 0 20px;font-size:22px}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:16px}
input,button{font:inherit;padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:#140c24;color:inherit}
button{background:var(--accent);border:0;font-weight:700;cursor:pointer}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px;border-bottom:1px solid rgba(255,255,255,.08)}
th{color:var(--mut);font-size:13px}
.ok{color:var(--ok)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.row input{flex:1;min-width:140px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Админ-панель бота</h1>

  <div class="card" id="login">
    <div class="row">
      <input id="pass" type="password" placeholder="Пароль админа">
      <button onclick="login()">Войти</button>
    </div>
    <p id="err" style="color:#ff9fb8"></p>
  </div>

  <div id="panel" style="display:none">
    <div class="card">
      <div class="row">
        <input id="q" placeholder="Поиск по user_id">
        <button onclick="loadUsers()">Найти</button>
        <button onclick="loadUsers('')">Все</button>
      </div>
      <div id="users">Загрузка...</div>
    </div>

    <div class="card" id="edit" style="display:none">
      <h3>Пользователь <span id="uid"></span></h3>
      <div class="row">
        <input id="delta" type="number" placeholder="Кредиты (+100 или -50)">
        <input id="reason" placeholder="Причина">
        <button onclick="updateBalance()">Применить</button>
      </div>
      <p id="msg"></p>
    </div>
  </div>
</div>

<script>
const ADMIN_PASS = 'admin123'; // поменяй на свой
let token = sessionStorage.getItem('bot_admin') || '';

function login() {
  const p = document.getElementById('pass').value;
  if (p === ADMIN_PASS) {
    token = 'ok';
    sessionStorage.setItem('bot_admin', token);
    document.getElementById('login').style.display = 'none';
    document.getElementById('panel').style.display = 'block';
    loadUsers();
  } else {
    document.getElementById('err').textContent = 'Неверный пароль';
  }
}

if (token) {
  document.getElementById('login').style.display = 'none';
  document.getElementById('panel').style.display = 'block';
  loadUsers();
}

async function loadUsers(q = '') {
  const res = await fetch('/api/admin/users?q=' + encodeURIComponent(q));
  const data = await res.json();
  const html = '<table><tr><th>User ID</th><th>Баланс</th><th>Модель</th><th>Создан</th><th></th></tr>' +
    (data.users || []).map(u => `
      <tr>
        <td>${u.user_id}</td>
        <td class="ok">${u.balance}</td>
        <td>${u.current_model || '—'}</td>
        <td>${u.created_at ? new Date(u.created_at).toLocaleString('ru') : '—'}</td>
        <td><button onclick="editUser('${u.user_id}')">Изменить</button></td>
      </tr>`).join('') + '</table>';
  document.getElementById('users').innerHTML = html || '<p>Нет пользователей</p>';
}

function editUser(id) {
  document.getElementById('edit').style.display = 'block';
  document.getElementById('uid').textContent = id;
  document.getElementById('edit').dataset.uid = id;
}

async function updateBalance() {
  const uid = document.getElementById('edit').dataset.uid;
  const delta = parseInt(document.getElementById('delta').value, 10);
  const reason = document.getElementById('reason').value;
  if (!delta) return alert('Укажите количество');
  const res = await fetch('/api/admin/balance', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ userId: uid, delta, reason })
  });
  const data = await res.json();
  document.getElementById('msg').textContent = data.ok ? `Готово. Новый баланс: ${data.balance}` : (data.error || 'Ошибка');
  if (data.ok) loadUsers();
}
</script>
</body>
</html>
