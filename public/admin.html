<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Админ · НейроЯга</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Unbounded:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0614;--card:#140c24;--text:#f3efff;--mut:#a79cc4;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--text);font:15px/1.45 Manrope,sans-serif;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));max-width:960px}
h1{font-family:Unbounded,sans-serif;font-size:22px;margin:0 0 4px}
h1 i{font-style:normal;background:linear-gradient(135deg,#00ffe0,#b366ff,#ff2d95);-webkit-background-clip:text;background-clip:text;color:transparent}
h3{margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#1c1233;outline:none}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 4px}
button{cursor:pointer;border:0;border-radius:12px;padding:10px 14px;font-weight:800;background:linear-gradient(135deg,#b366ff,#ff2d95);color:#fff}
.ghost{background:transparent;border:1px solid var(--line)}
.danger{background:transparent;border:1px solid rgba(255,80,120,.5);color:#ffb3c7}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.row>*{flex:1;min-width:120px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top;word-break:break-word}
th{color:var(--mut);font-size:12px}
.tabs{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap;overflow-x:auto}
.tabs button{padding:8px 12px}
.tabs button.off{background:transparent;border:1px solid var(--line)}
.ok{color:#3ee08f;font-weight:800}.bad{color:#ff8fb0;font-weight:800}
.ava{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#1c1233;display:inline-flex;align-items:center;justify-content:center;font-weight:800;vertical-align:middle;margin-right:8px}
.note{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:#1c1233;border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .n{font-size:24px;font-weight:800}
.stat .l{color:var(--mut);font-size:12px}
.pill{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;margin-right:4px}
.mrow{display:grid;grid-template-columns:minmax(140px,1fr) 90px 120px 70px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.mrow .mname{font-weight:700}
.mrow input{padding:7px 9px}
.thumb{width:54px;height:54px;object-fit:cover;border-radius:8px;background:#1c1233}
.agallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.acard{background:#140c24;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.acard.off{opacity:.55}
.acard img,.acard .ph{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:center top;display:block;background:linear-gradient(150deg,#22164a,#0d2b3a)}
.abody{padding:10px 12px 12px}
.abody em{display:inline-block;margin-top:6px;font-style:normal;font-weight:800;color:#00d4ff}
.drop{display:block;margin-top:8px;border:1px dashed rgba(0,212,255,.55);border-radius:18px;background:#120a22;cursor:pointer;overflow:hidden;text-align:center}
.drop input{display:none}
.drop .pad{padding:28px 16px;font-weight:800}
.drop img{width:100%;max-height:360px;object-fit:cover;object-position:center top;display:block}
details{margin-top:12px}
details summary{cursor:pointer;color:var(--mut);font-weight:700}
.hero{width:100%;max-height:280px;object-fit:cover;border-radius:14px;background:#0b0614;margin-top:8px}
.filebtn{display:block;text-align:center;border:1px dashed rgba(255,255,255,.28);border-radius:14px;padding:14px;margin-top:8px;font-weight:800;cursor:pointer}
.filebtn input{display:none}
.check{display:flex;align-items:flex-start;gap:8px;margin-top:10px;color:var(--text);font-size:14px}
.check input{width:auto;margin-top:2px}
.door{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.door button{min-height:108px;font-size:18px;border-radius:18px}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.place{font-family:Unbounded,sans-serif;font-size:18px;margin:0}
@media(max-width:640px){.mrow{grid-template-columns:1fr 1fr}.door{grid-template-columns:1fr}}
</style>
</head>
<body>
<h1>Админ <i>НейроЯга</i></h1>
<p class="note">После входа выберите Telegram или ВКонтакте. У каждого свои клиенты, баланс, модели и шаблоны.</p>

<div class="card" id="login">
  <div class="row"><input id="pass" type="password" placeholder="Пароль администратора"><button onclick="login()">Войти</button></div>
  <p id="lerr" class="bad"></p>
</div>

<div class="card" id="door" style="display:none">
  <h3>Куда войти</h3>
  <p class="note">Это разные кабинеты. Клиент из Telegram не попадёт в список ВК, и наоборот.</p>
  <div class="door">
    <button type="button" onclick="enterPlace('tg')">Telegram</button>
    <button type="button" class="ghost" onclick="enterPlace('vk')">ВКонтакте</button>
  </div>
</div>

<div id="panel" style="display:none">
  <div class="head">
    <div>
      <div class="place" id="placeTitle">Telegram</div>
      <p class="note" id="placeNote"></p>
    </div>
    <div class="row" style="margin:0;flex:0 0 auto">
      <button class="ghost" type="button" onclick="showDoor()">Другой вход</button>
      <button class="ghost" type="button" onclick="logout()">Выйти</button>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="section-stats"></div>
  <div id="section-rate"></div>
  <div id="section-donut"></div>
  <div id="section-users"></div>
  <div id="section-tpl"></div>
  <div id="section-models"></div>
  <div id="section-journal"></div>
  <div id="section-packages"></div>
  <div id="section-tickets"></div>
  <div id="section-broadcast"></div>
  <div id="section-settings"></div>
</div>

<script>
const TABS = [
  ['stats','Статистика'],['users','Клиенты'],['tpl','Шаблоны'],['models','Модели'],
  ['packages','Пакеты'],['tickets','Поддержка'],['broadcast','Рассылка'],['journal','Журнал'],['settings','Настройки']
];
let token = sessionStorage.getItem('ny_admin_token') || null;
let place = sessionStorage.getItem('ny_admin_place') || '';
let cur = 'stats';
let users=[], templates=[], modelsData=[], groupsData={}, providersData={}, packagesData=[], generalData={};
const KINDNAME = {sys:'система', pay:'оплата', kie:'Kie', gen:'сбой', tpl:'шаблон'};
let tplEdit = null, tplImage = '', tplImageTouched = false, modelsMsg = '';
let rateGroup = sessionStorage.getItem('ny_admin_group') || '';
let donutGroup = sessionStorage.getItem('ny_admin_donut') || '';

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function tgInit(){ try{ return (window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.initData)||''; }catch(e){ return ''; } }

async function api(path, opts){
  opts = opts||{};
  opts.headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  if (token) opts.headers['Authorization'] = 'Bearer '+token;
  const r = await fetch(path, opts);
  if (r.status===401){ logout(); throw new Error('Требуется вход'); }
  return r.json();
}

async function login(){
  const pass = document.getElementById('pass').value;
  const body = { password: pass };
  const init = tgInit(); if (init) body.initData = init;
  try{
    const r = await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d = await r.json();
    if (!r.ok || !d.token) throw new Error(d.error||'Неверный пароль');
    token = d.token; sessionStorage.setItem('ny_admin_token', token);
    place = ''; sessionStorage.removeItem('ny_admin_place');
    showPanel();
  }catch(e){ document.getElementById('lerr').textContent = e.message; }
}
function logout(){
  token=null; place='';
  sessionStorage.removeItem('ny_admin_token');
  sessionStorage.removeItem('ny_admin_place');
  document.getElementById('login').style.display='block';
  document.getElementById('panel').style.display='none';
  document.getElementById('door').style.display='none';
}
function placeName(){ return place==='vk' ? 'ВКонтакте' : 'Telegram'; }
function showDoor(){
  document.getElementById('login').style.display='none';
  document.getElementById('panel').style.display='none';
  document.getElementById('door').style.display='block';
}
function enterPlace(next){
  place = next==='vk' ? 'vk' : 'tg';
  sessionStorage.setItem('ny_admin_place', place);
  document.getElementById('door').style.display='none';
  document.getElementById('login').style.display='none';
  document.getElementById('panel').style.display='block';
  document.getElementById('placeTitle').textContent = placeName();
  document.getElementById('placeNote').textContent = place==='vk'
    ? 'У каждого сообщества свой рейтинг и свой список донов. Клиенты, баланс, модели и рассылка общие.'
    : 'Клиенты, баланс, модели и шаблоны только Telegram.';
  renderTabs();
  go('stats');
}

function currentTabs(){
  const tabs = TABS.slice();
  if (place==='vk') tabs.splice(1, 0, ['rate','Рейтинг'], ['donut','Донат']);
  return tabs;
}
function rateFace(row){
  const photo = String(row.photo||'');
  if (/^https:\/\/([a-z0-9-]+\.)?(userapi\.com|vk\.com|vkuser\.net)\//i.test(photo)) return '<img class="ava" src="'+esc(photo)+'" alt="">';
  return '<span class="ava">'+esc((row.name||'?').trim().charAt(0))+'</span>';
}
function renderTabs(){
  document.getElementById('tabs').innerHTML = currentTabs().map(([k,l])=>'<button class="'+(k===cur?'':'off')+'" onclick="go(\''+k+'\')">'+l+'</button>').join('');
}
function go(k){ cur=k; renderTabs(); currentTabs().forEach(([t])=>{ document.getElementById('section-'+t).style.display = t===k?'block':'none'; }); loadSection(k); }

async function showPanel(){
  document.getElementById('login').style.display='none';
  try{ await api('/api/admin/me'); }catch(e){ return; }
  if (place==='vk' || place==='tg') enterPlace(place);
  else showDoor();
}

async function loadSection(k){
  if (k==='stats') return loadStats();
  if (k==='rate') return loadRate();
  if (k==='donut') return loadDonut();
  if (k==='users') return loadUsers('');
  if (k==='tpl') return loadTpl();
  if (k==='models') return loadModels();
  if (k==='journal') return loadJournal();
  if (k==='packages') return loadPackages();
  if (k==='tickets') return loadTickets('open');
  if (k==='broadcast') return renderBroadcast();
  if (k==='settings') return loadSettings();
}

function communityTitle(item){
  return item && item.name ? item.name : ('Сообщество '+(item && item.id || ''));
}
function renderCommunities(list){
  if (!list.length) return '<div class="card"><h3>Сообщества</h3><p class="note">Ключи сообществ не заданы.</p></div>';
  return '<div class="card"><h3>Сообщества</h3><p class="note">Рейтинг у каждого сообщества свой. Аудит и клуб есть только во втором. Клиенты, баланс и рассылка общие.</p>'+
    list.map(item=>{
      const tools = ['кабинет', 'модели'];
      if (item.audit) tools.push('аудит');
      if (item.club) tools.push('клуб');
      return '<div class="stat" style="margin-top:8px"><div class="n" style="font-size:16px">'+esc(communityTitle(item))+'</div>'+
        '<div class="l">'+esc(item.id)+' · '+(item.online?'<span class="ok">подключён</span>':'<span class="bad">нет связи</span>')+'</div>'+
        (item.events?'<div class="note">События рейтинга: '+esc(item.events)+'</div>':'<div class="note">События рейтинга появятся после подключения.</div>')+
        (item.hint?'<div class="note">'+esc(item.hint)+'</div>':'')+
        '<div class="note">В чате: '+tools.join(', ')+'</div>'+
        '<div class="row" style="margin-top:8px"><button class="ghost" type="button" onclick="openRate(\''+esc(item.id)+'\')">Рейтинг</button><button class="ghost" type="button" onclick="openDonut(\''+esc(item.id)+'\')">Донаты</button></div></div>';
    }).join('')+'</div>';
}
function openRate(id){
  rateGroup = String(id||'');
  sessionStorage.setItem('ny_admin_group', rateGroup);
  go('rate');
}
function openDonut(id){
  donutGroup = String(id||'');
  sessionStorage.setItem('ny_admin_donut', donutGroup);
  go('donut');
}
const DONUT_KIND = { create:'подписка', prolong:'продление', cancel:'отписка', expire:'срок истёк' };
function donutWhen(value){
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return '';
  return date.toLocaleString('ru-RU', { timeZone: 'Europe/Moscow', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
}
async function loadDonut(){
  const el = document.getElementById('section-donut');
  el.innerHTML = '<div class="card">Смотрю донаты…</div>';
  try {
    const pack = await api('/api/admin/vk/communities');
    const list = pack.communities || [];
    if (!list.some(item => item.id === donutGroup)) donutGroup = list[0] ? list[0].id : '';
    const data = await api('/api/admin/vk/donut?group='+encodeURIComponent(donutGroup));
    if (data.error) throw new Error(data.error);
    const report = data.report || {};
    const events = data.events || [];
    const donors = report.donors || [];
    const donorIds = new Set(donors.map(item => Number(item.id)));
    const left = [];
    const seenLeft = new Set();
    events.forEach(item => {
      if (item.kind !== 'cancel' && item.kind !== 'expire') return;
      if (donorIds.has(Number(item.userId)) || seenLeft.has(item.userId)) return;
      seenLeft.add(item.userId);
      left.push(item);
    });
    const joins = events.filter(item => item.kind === 'create').length;
    const renews = events.filter(item => item.kind === 'prolong').length;
    const drops = events.filter(item => item.kind === 'cancel' || item.kind === 'expire').length;
    const others = report.donorError ? '—' : Math.max(0, (report.members || 0) - (report.donorTotal || 0));
    const switcher = list.map(item => '<button type="button" class="'+(item.id===donutGroup?'':'ghost')+'" onclick="openDonut(\''+esc(item.id)+'\')">'+esc(communityTitle(item))+'</button>').join('');
    const person = item => rateFace(item)+esc(item.name || ('ВК '+item.id));
    el.innerHTML = '<div class="card"><h3>Донат · '+esc(report.name || communityTitle({id:report.id}))+'</h3><div class="row">'+switcher+'</div>'+
      '<div class="grid">'+
      '<div class="stat"><div class="n">'+(report.members||0)+'</div><div class="l">Участники</div></div>'+
      '<div class="stat"><div class="n">'+(report.donorTotal||0)+'</div><div class="l">Доны сейчас</div></div>'+
      '<div class="stat"><div class="n">'+others+'</div><div class="l">Не доны</div></div>'+
      '<div class="stat"><div class="n">'+(report.weekPoints||0)+'</div><div class="l">Баллы · '+esc(report.week||'')+'</div></div>'+
      '<div class="stat"><div class="n">'+(report.weekPeople||0)+'</div><div class="l">Людей в рейтинге</div></div>'+
      '<div class="stat"><div class="n">'+joins+'</div><div class="l">Новые подписки</div></div>'+
      '<div class="stat"><div class="n">'+renews+'</div><div class="l">Продления</div></div>'+
      '<div class="stat"><div class="n">'+drops+'</div><div class="l">Отписки</div></div>'+
      '</div>'+
      (report.donorError?'<p class="bad">'+esc(report.donorError)+'</p>':'')+
      '<p class="note">Доны — живой список ВК. Подписки и отписки копятся с этого обновления: более ранние отписки ВК списком не отдаёт. Не доны — участники минус текущие доны.</p></div>'+
      '<div class="card"><h3>Доны сейчас</h3><table><tr><th>Человек</th><th>Номер</th></tr>'+
      donors.map(item => '<tr><td>'+person({name:item.name, photo:item.photo})+'</td><td>'+esc(item.id)+'</td></tr>').join('')+
      (donors.length?'':'<tr><td colspan="2" class="note">Сейчас донов нет или список ещё не открылся.</td></tr>')+
      '</table></div>'+
      '<div class="card"><h3>Отписались</h3><table><tr><th>Человек</th><th>Когда</th><th></th></tr>'+
      left.map(item => '<tr><td>'+person(item)+'</td><td>'+esc(donutWhen(item.at))+'</td><td>'+esc(DONUT_KIND[item.kind]||item.kind)+'</td></tr>').join('')+
      (left.length?'':'<tr><td colspan="3" class="note">Пока никто не отписался после запуска учёта.</td></tr>')+
      '</table></div>'+
      '<div class="card"><h3>Журнал подписок</h3><table><tr><th>Человек</th><th>Событие</th><th>Когда</th></tr>'+
      events.map(item => '<tr><td>'+person(item)+'</td><td>'+esc(DONUT_KIND[item.kind]||item.kind)+(item.amount?' · '+item.amount+' ₽':'')+'</td><td>'+esc(donutWhen(item.at))+'</td></tr>').join('')+
      (events.length?'':'<tr><td colspan="3" class="note">Новых событий доната ещё не было.</td></tr>')+
      '</table></div>';
  } catch (e) {
    el.innerHTML = '<div class="card bad">'+esc(e.message)+'</div>';
  }
}
async function loadRate(){
  const el = document.getElementById('section-rate');
  el.innerHTML = '<div class="card">Считаю баллы…</div>';
  try {
    const pack = await api('/api/admin/vk/communities');
    const list = pack.communities || [];
    if (!list.some(item => item.id === rateGroup)) rateGroup = list[0] ? list[0].id : '';
    const current = list.find(item => item.id === rateGroup) || null;
    const d = await api('/api/admin/vk/rating?group='+encodeURIComponent(rateGroup));
    const rows = d.rows || [];
    const switcher = list.map(item=>'<button type="button" class="'+(item.id===rateGroup?'':'ghost')+'" onclick="openRate(\''+esc(item.id)+'\')">'+esc(communityTitle(item))+'</button>').join('');
    el.innerHTML = renderCommunities(list)+
      '<div class="card"><h3>Рейтинг · '+esc(communityTitle(current))+'</h3>'+
      '<div class="row">'+switcher+'</div>'+
      '<p class="note">'+esc(d.week||'')+'</p>'+
      '<p class="note">'+esc(d.rules||'')+' Лайк, комментарий и репост приводят новых людей. Запрос боту приносит только оплату, поэтому за него балл один. В понедельник список начинается заново. Кредиты сами не приходят: впишите сумму и начислите человеку.</p>'+
      '<table><tr><th></th><th>Подписчик</th><th>Баллы</th><th>Лайки</th><th>Коммент.</th><th>Репосты</th><th>Бот</th><th>Кредиты</th></tr>'+
      rows.map((row, i)=>'<tr><td>'+(i+1)+'</td><td>'+rateFace(row)+esc(row.name)+'</td><td class="ok">'+row.points+'</td><td>'+row.likes+'</td><td>'+row.comments+'</td><td>'+row.reposts+'</td><td>'+row.bot+'</td>'+
        '<td><div class="row" style="margin:0"><input id="cr'+esc(row.userId)+'" type="number" placeholder="100"><button onclick="grantRate(\''+esc(row.userId)+'\')">Начислить</button></div><p id="crm'+esc(row.userId)+'" class="note"></p></td></tr>').join('')+
      (rows.length?'':'<tr><td colspan="8" class="note">На этой неделе пока нет активности.</td></tr>')+
      '</table></div>';
  } catch (e) {
    el.innerHTML = '<div class="card bad">'+esc(e.message)+'</div>';
  }
}
async function grantRate(id){
  const input = document.getElementById('cr'+id);
  const delta = parseInt(input && input.value, 10);
  const msg = document.getElementById('crm'+id);
  if (!delta) { if (msg) msg.textContent = 'Укажите сумму'; return; }
  const d = await api('/api/admin/balance',{method:'POST',body:JSON.stringify({userId:id,delta,reason:'Рейтинг · неделя'})});
  if (msg) msg.textContent = d.ok ? ('Начислено. Баланс: '+d.balance) : (d.error||'Не получилось');
}

/* ---- Статистика ---- */
async function loadStats(){
  const el = document.getElementById('section-stats');
  el.innerHTML = '<div class="card">Загрузка…</div>';
  try{
    const {stats} = await api('/api/admin/stats?platform='+place);
    let communities = '';
    if (place==='vk') {
      try {
        const pack = await api('/api/admin/vk/communities');
        communities = renderCommunities(pack.communities || []);
      } catch (err) {}
    }
    const cells = [
      ['Клиенты '+placeName(), stats.users_total],['Активны за сутки', stats.active_day],
      ['Новые за сутки', stats.new_day],['В чёрном списке', stats.users_blocked],
      ['Кредитов на балансах', stats.balance_total],['Генераций всего', stats.gens_total],
      ['Потрачено кредитов', stats.spent_total],['Начислено всего', stats.credited_total],
      ['Открытых обращений', stats.tickets_open]
    ];
    el.innerHTML = communities+'<div class="card"><h3>Статистика · '+placeName()+'</h3><div class="grid">'+

const TCATS = [['image','Картинки'],['fix','Улучшение фото'],['chat','Текст'],['video','Видео'],['audio','Голос']];
function fileToJpeg(file, max, quality){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * scale));
      const h = Math.max(1, Math.round(img.height * scale));
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Не удалось прочитать фото')); };
    img.src = url;
  });
}
function safeImg(u){
  const s = String(u||'');
  if (/^https?:\/\//i.test(s)) return s;
  if (/^data:image\/(jpeg|jpg|png|webp);base64,/i.test(s)) return s;
  return '';
}
function serviceName(id){ return providersData[id] || id || 'Другой сервис'; }
function modelOptions(current){
  const list = (place==='vk' ? modelsData.filter(m=>m.vkEnabled!==false) : modelsData).slice();
  if (current && !list.some(m=>m.key===current)) list.unshift({key:current, name:current+' (как сохранено)', cost:null, provider:''});
  if (!list.length) list.push({key:'nanobanana', name:'Картинка', cost:20, provider:'google', group:'image'});
  const order = Object.keys(providersData);
  const used = {};
  let html = '';
  function opts(rows){
    return rows.map(m=>'<option value="'+esc(m.key)+'"'+(m.key===current?' selected':'')+'>'+esc(m.name)+(groupsData[m.group]?' · '+esc(groupsData[m.group]):'')+(m.cost!=null?' · '+m.cost+' кр':'')+'</option>').join('');
  }
  order.forEach(id=>{
    const rows = list.filter(m=>m.provider===id);
    if (!rows.length) return;
    rows.forEach(m=>{ used[m.key]=1; });
    html += '<optgroup label="'+esc(serviceName(id))+'">'+opts(rows)+'</optgroup>';
  });
  const rest = list.filter(m=>!used[m.key]);
  if (rest.length) html += '<optgroup label="Как сохранено">'+opts(rest)+'</optgroup>';
  return html;
}
function modeCost(model, qualityId, duration){
  if (!model) return '';
  const list = model.qualities || [];
  if (list.length) {
    const q = list.find(x=>x.id===qualityId) || list.find(x=>x.id===model.quality) || list[0];
    if (!q) return model.cost;
    if (q.perSec) return q.cost * (Number(duration) || (model.durations && model.durations[0]) || 1);
    return q.cost;
  }
  const prices = model.durationPrices || {};
  if (duration != null && prices[String(duration)] != null) return prices[String(duration)];
  if (model.perSec && duration) return (model.rate || model.cost) * Number(duration);
  return model.cost;
}
function modeBlock(model, selectedQuality, selectedDuration){
  if (!model) return '';
  let html = '';
  const list = model.qualities || [];
  if (list.length > 1) {
    const cur = list.some(q=>q.id===selectedQuality) ? selectedQuality : (model.quality || list[0].id);
    html += '<label>Режим. Здесь дешёвый и обычный вариант одной модели</label><select id="tqmode">'+
      list.map(q=>'<option value="'+esc(q.id)+'"'+(q.id===cur?' selected':'')+'>'+esc(q.name)+' · '+q.cost+(q.perSec?' кр/сек':' кр')+(q.desc?' · '+esc(q.desc):'')+'</option>').join('')+
      '</select>';
  }
  const durs = model.durations || [];
  if (durs.length > 1) {
    const cur = durs.map(Number).includes(Number(selectedDuration)) ? Number(selectedDuration) : Number(durs[0]);
    const qid = list.some(q=>q.id===selectedQuality) ? selectedQuality : (model.quality || (list[0] && list[0].id));
    html += '<label>Длина</label><select id="tdur">'+
      durs.map(d=>'<option value="'+d+'"'+(Number(d)===cur?' selected':'')+'>'+d+' сек · '+modeCost(model, qid, d)+' кр</option>').join('')+
      '</select>';
  }
  return html;
}

  } catch (e) { alert(e.message); }

  modelsData = d.models||[]; groupsData = d.groups||{}; providersData = d.providers||{};
  const lead = place==='vk'
    ? 'Галочка включает модель только в чате и кабинете ВК. Цена общая с Telegram: если изменить её здесь, она изменится и там. Выключение в Telegram эту галочку само не снимает.'
    : 'Галочка включает модель в Telegram. Во ВК включение отдельное: его меняют, войдя в админку ВКонтакте. Цена общая для обоих чатов.';
  let html = '<div class="card"><h3>Модели · '+placeName()+'</h3><p class="note">'+lead+' Если сервис упал, нажмите «Выключить» у его блока и сохраните. 0 — бесплатно. У моделей с режимами цена задаёт базовый запуск. Для GigaChat поле «В день» — потолок, пустое поле снимает лимит.</p><p class="note">Kie сейчас '+(d.kie?'<b class="ok">подключён</b>.':'<b class="bad">без ключа</b>, раздел и так скрыт.')+'</p>'+(modelsMsg?'<p class="ok">'+esc(modelsMsg)+'</p>':'');
  const order = Object.keys(providersData);
  const used = {};
  function block(id, title, list){
    if (!list.length) return '';
    const on = list.filter(m=> place==='vk' ? m.vkEnabled!==false : m.enabled).length;
    return '<div class="note" style="margin:16px 0 6px"><b>'+esc(title)+'</b> · включено '+on+' из '+list.length+'</div>'+
      '<div class="row" style="margin-bottom:6px"><button type="button" class="ghost" onclick="setService(\''+esc(id)+'\', false)">Выключить</button>'+
      '<button type="button" class="ghost" onclick="setService(\''+esc(id)+'\', true)">Включить</button></div>'+
      list.map(modelRow).join('');
  }
  order.forEach(id=>{
    const list = modelsData.filter(m=>m.provider===id);
    list.forEach(m=>{ used[m.key]=1; });
    html += block(id, serviceName(id), list);
  });
  const rest = modelsData.filter(m=>!used[m.key]);
  html += block('', 'Другой сервис', rest);
  html += '<div class="row" style="margin-top:12px"><button onclick="saveModels()">Сохранить модели</button></div><p id="mmsg"></p></div>';
  el.innerHTML = html;
}
function setService(provider, on){
  document.querySelectorAll('#section-models .mrow').forEach(row=>{
    if ((row.dataset.provider||'')===provider) row.querySelector('.f-en').checked = on;
  });
}
async function saveModels(){
  const models = {};
  const flags = {};
  document.querySelectorAll('#section-models .mrow').forEach(row=>{
    const key = row.dataset.key;
    const limEl = row.querySelector('.f-limit');
    const item = { cost: row.querySelector('.f-cost').value };
    if (place!=='vk') item.enabled = row.querySelector('.f-en').checked;
    if (limEl && !limEl.disabled) item.limit = limEl.value.trim()==='' ? null : Number(limEl.value);
    models[key] = item;
    flags[key] = { enabled: row.querySelector('.f-en').checked };
  });
  const d = place==='vk'
    ? await api('/api/admin/models',{method:'POST',body:JSON.stringify({models, pricesOnly:true})})
    : await api('/api/admin/models',{method:'POST',body:JSON.stringify({models})});
  if (!d.ok) { modelsMsg = ''; alert(d.error||'Ошибка'); return; }
  if (place==='vk') {
    const v = await api('/api/admin/vk/models',{method:'POST',body:JSON.stringify({models:flags})});
    if (!v.ok) { modelsMsg = ''; alert(v.error||'Модели ВК не сохранились'); return; }
  }
  modelsMsg = 'Сохранено';
  await loadModels();
}

/* ---- Пакеты ---- */
async function loadJournal(){
  const el = document.getElementById('section-journal');
  el.innerHTML = '<div class="card">Загрузка…</div>';
  try{
    const d = await api('/api/admin/journal');
    const items = d.items || [];
    const rows = items.map(it=>{
      const t = it.created_at ? new Date(it.created_at).toLocaleString('ru-RU') : '';
      const kind = KINDNAME[it.kind] || it.kind;
      return '<tr><td>'+esc(t)+'</td><td>'+esc(kind)+'</td><td>'+esc(it.message)+'</td></tr>';
    }).join('');
    el.innerHTML = '<div class="card"><h3>Журнал</h3><p class="note">Общий журнал обоих чатов. Шаблоны пишутся отдельно: старт, размер фото, модель и ответ сервиса, если фото или генерация не прошли. Текст запроса сюда не попадает.</p>'+
      (rows?'<table><tr><th>Когда</th><th></th><th>Событие</th></tr>'+rows+'</table>':'<p class="note">Пока пусто. После перезапуска здесь появится «Бот запущен».</p>')+
      '<div class="row" style="margin-top:12px"><button class="ghost" onclick="loadJournal()">Обновить</button></div></div>';
  }catch(e){ el.innerHTML = '<div class="card"><p class="bad">'+esc(e.message)+'</p></div>'; }
}

async function loadPackages(){
  const el = document.getElementById('section-packages');
  const d = await api('/api/admin/packages'); packagesData = d.packages||[];
  renderPackages();
}
function renderPackages(){
  const el = document.getElementById('section-packages');
  el.innerHTML = '<div class="card"><h3>Пакеты · '+placeName()+'</h3><p class="note">Пакеты одни: их видят и в Telegram, и во ВК. Изменение здесь меняет оплату в обоих чатах.</p><div id="pkgrows">'+
    packagesData.map((p,i)=>pkgRow(p,i)).join('')+'</div>'+
    '<div class="row" style="margin-top:8px"><button class="ghost" onclick="addPkg()">+ Пакет</button><button onclick="savePackages()">Сохранить пакеты</button></div><p id="pmsg"></p></div>';
}
function pkgRow(p,i){
  return '<div class="row" data-i="'+i+'"><input class="p-title" placeholder="Название" value="'+esc(p.title||'')+'">'+
    '<input class="p-credits" type="number" placeholder="Кредиты" value="'+(p.credits||'')+'">'+
    '<input class="p-price" type="number" placeholder="Цена ₽" value="'+(p.price||'')+'">'+
    '<button class="danger" onclick="rmPkg('+i+')" style="flex:0 0 auto">✕</button></div>';
}
function collectPkg(){
  const arr=[];
  document.querySelectorAll('#pkgrows .row').forEach(r=>{
    arr.push({ title:r.querySelector('.p-title').value, credits:r.querySelector('.p-credits').value, price:r.querySelector('.p-price').value });
  });
  return arr;
}
function addPkg(){ packagesData = collectPkg(); packagesData.push({title:'',credits:'',price:''}); renderPackages(); }
function rmPkg(i){ packagesData = collectPkg(); packagesData.splice(i,1); renderPackages(); }
async function savePackages(){
  const d = await api('/api/admin/packages',{method:'POST',body:JSON.stringify({packages:collectPkg()})});
  if (d.ok){ packagesData = d.packages||[]; renderPackages(); document.getElementById('pmsg').textContent='Сохранено'; }
  else alert(d.error||'Ошибка');
}

/* ---- Поддержка ---- */
async function loadTickets(status){
  const el = document.getElementById('section-tickets');
  const d = await api('/api/admin/tickets?platform='+place+'&status='+encodeURIComponent(status||'open'));
  const list = d.tickets||[];
  el.innerHTML = '<div class="card"><h3>Поддержка · '+placeName()+'</h3><div class="row">'+
    ['open','answered','all'].map(s=>'<button class="'+(s===status?'':'ghost')+'" onclick="loadTickets(\''+s+'\')">'+({open:'Открытые',answered:'Отвеченные',all:'Все'}[s])+'</button>').join('')+'</div></div>'+
    (list.length?list.map(t=>'<div class="card"><div class="note">#'+t.id+' · '+esc(ticketWho(t))+' · '+(t.status==='open'?'<span class="bad">открыт</span>':'<span class="ok">отвечен</span>')+'</div>'+
      '<p>'+esc(t.message)+'</p>'+(t.answer?('<p class="note">Ответ: '+esc(t.answer)+'</p>'):('<textarea id="ans-'+t.id+'" placeholder="Ответ клиенту"></textarea><div class="row" style="margin-top:8px"><button onclick="answer('+t.id+')">Ответить</button></div>'))+
      '</div>').join(''):'<div class="card"><div class="note">Нет обращений</div></div>');
}
function ticketWho(t){
  const id = String(t.user_id);
  if (id.startsWith('-') || Number(id) < 0) return 'ВКонтакте '+id.replace(/^-/, '');
  const name = String(t.username || '');
  return name ? (name.charAt(0)==='@' ? name : '@'+name) : id;
}
async function answer(id){
  const ta = document.getElementById('ans-'+id);
  const answer = (ta&&ta.value||'').trim();
  if (!answer) return alert('Введите ответ');
  const d = await api('/api/admin/tickets/answer',{method:'POST',body:JSON.stringify({id,answer})});
  if (d.ok) loadTickets('open'); else alert(d.error||'Ошибка');
}

/* ---- Рассылка ---- */
function renderBroadcast(){
  const vk = place==='vk';
  document.getElementById('section-broadcast').innerHTML =
    '<div class="card"><h3>Рассылка · '+placeName()+'</h3><p class="note">'+(vk
      ? 'Рассылка общая для обоих сообществ. «Подписавшимся» — только тем, кто нажал «Подписаться». «Всем клиентам» — всем, кто уже открывал бота, кроме чёрного списка. Рейтинг при этом остаётся у каждого сообщества свой.'
      : 'Сообщение получат клиенты Telegram, кроме чёрного списка. Поддерживается Markdown.')+'</p>'+
    '<textarea id="bcast" placeholder="Текст рассылки"></textarea>'+
    '<div class="row" style="margin-top:8px">'+(vk
      ? '<button onclick="sendBroadcast(true)">Подписавшимся</button><button class="ghost" onclick="sendBroadcast(false)">Всем клиентам</button>'
      : '<button onclick="sendBroadcast(false)">Отправить клиентам Telegram</button>')+
    '</div><p id="bmsg"></p></div>';
}
async function sendBroadcast(subscribers){
  const text = document.getElementById('bcast').value.trim();
  if (!text) return alert('Введите текст');
  const who = subscribers ? 'подписавшимся' : ('клиентам '+placeName());
  if (!confirm('Отправить рассылку '+who+'?')) return;
  document.getElementById('bmsg').textContent = 'Отправка…';
  const body = { text: text, platform: place };
  if (subscribers) body.subscribers = true;
  const d = await api('/api/admin/broadcast',{method:'POST',body:JSON.stringify(body)});
  document.getElementById('bmsg').textContent = d.ok?('Готово: доставлено '+d.sent+' из '+d.total+(d.failed?(', ошибок '+d.failed):'')):(d.error||'Ошибка');
}

/* ---- Настройки ---- */
async function loadSettings(){
  const el = document.getElementById('section-settings');
  const d = await api('/api/admin/general?platform='+place); generalData = d.general||{};
  const models = d.models||[];
  const help = place==='vk'
    ? '<p class="note">Справка в чате ВК здесь не меняется. Приветственный бонус, модель по умолчанию, сайт и поддержка общие для обоих чатов. В списке только модели, включённые во ВК.</p>'
    : '<label>Текст справки в Telegram</label><textarea id="g-help" style="min-height:140px">'+esc(generalData.help_text||'')+'</textarea>';
  el.innerHTML = '<div class="card"><h3>Настройки · '+placeName()+'</h3>'+
    '<label>Приветственный бонус новым клиентам, кредитов</label><input id="g-bonus" type="number" value="'+(generalData.start_bonus||0)+'">'+
    '<label>Модель по умолчанию</label><select id="g-model">'+models.map(m=>'<option value="'+m.key+'"'+(m.key===generalData.default_model?' selected':'')+'>'+esc(m.short||m.key)+'</option>').join('')+'</select>'+
    '<label>Ссылка на сайт</label><input id="g-site" value="'+esc(generalData.site_url||'')+'">'+
    '<label>Поддержка включена</label><select id="g-support"><option value="1"'+(generalData.support_enabled!==false?' selected':'')+'>Да</option><option value="0"'+(generalData.support_enabled===false?' selected':'')+'>Нет</option></select>'+
    help+
    '<div class="row" style="margin-top:12px"><button onclick="saveSettings()">Сохранить настройки</button></div><p id="gmsg"></p></div>';
}
async function saveSettings(){
  const general = {
    start_bonus: +document.getElementById('g-bonus').value||0,
    default_model: document.getElementById('g-model').value,
    site_url: document.getElementById('g-site').value.trim(),
    support_enabled: document.getElementById('g-support').value==='1'
  };
  const help = document.getElementById('g-help');
  if (help) general.help_text = help.value.trim();
  const d = await api('/api/admin/general',{method:'POST',body:JSON.stringify({general})});
  document.getElementById('gmsg').textContent = d.ok?'Сохранено':(d.error||'Ошибка');
}

if (token) showPanel();
document.getElementById('pass').addEventListener('keydown',e=>{ if(e.key==='Enter') login(); });
