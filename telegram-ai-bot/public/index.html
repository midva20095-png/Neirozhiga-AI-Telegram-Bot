<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Кабинет · НейроЯга</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0614;--card:#140c24;--line:rgba(255,255,255,.08);
  --text:#f3efff;--mut:#a79cc4;--ok:#3ee08f;--bad:#ff7aa2;
  --grad:linear-gradient(135deg,#00ffe0,#b366ff 55%,#ff2d95);
}
*{box-sizing:border-box}
html,body{margin:0;background:
  radial-gradient(50% 30% at 8% 0,rgba(0,255,224,.12),transparent 60%),
  radial-gradient(45% 30% at 100% 0,rgba(255,45,149,.14),transparent 55%),
  var(--bg);color:var(--text);font:15px/1.45 Manrope,system-ui,sans-serif;min-height:100%}
button,a{font:inherit}
button{cursor:pointer}
.app{max-width:560px;margin:0 auto;padding:14px 14px 28px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.logo{font-family:Unbounded,Manrope,sans-serif;font-weight:800;font-size:20px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;flex:1}
.site{text-decoration:none;color:#fff;border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:12px;padding:8px 12px;font-weight:700;font-size:13px}
.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:14px;padding-bottom:2px}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:#120a20;color:var(--mut);border-radius:12px;padding:9px 12px;font-weight:700}
.tabs button.on{background:var(--grad);color:#fff;border-color:transparent}
.card{background:rgba(20,12,36,.92);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:700}
.bal{font-family:Manrope,sans-serif;font-weight:800;font-size:52px;text-align:center;margin:6px 0 0;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:var(--mut);margin:0 0 14px}
.btn{width:100%;border:0;border-radius:14px;padding:14px;font-weight:800;color:#fff;background:var(--grad)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.row{display:flex;gap:8px}
.model,.tpl{display:flex;gap:10px;align-items:center;justify-content:space-between;background:#1c1233;border-radius:14px;padding:12px;margin-bottom:8px;border:1px solid transparent;text-align:left;width:100%;color:inherit}
.model.on{border-color:#b366ff;background:#24163d}
.name{font-weight:800}
.meta{color:var(--mut);font-size:12.5px}
.cost{color:#d7c6ff;font-weight:800;white-space:nowrap}
.item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.plus{color:var(--ok);font-weight:800}.minus{color:#ff8be0;font-weight:800}
.empty{color:var(--mut);text-align:center;padding:18px 0}
.ban{background:rgba(255,80,120,.12);border:1px solid rgba(255,80,120,.4);border-radius:14px;padding:14px;color:#ffb3c7}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="logo">НейроЯга AI</div>
    <a class="site" href="https://babayagaland.ru" target="_blank" rel="noopener">На сайт</a>
  </div>
  <div class="tabs" id="tabs">
    <button data-t="home" class="on">Кабинет</button>
    <button data-t="models">Модели</button>
    <button data-t="tpl">Шаблоны</button>
    <button data-t="hist">История</button>
  </div>
  <div id="view"></div>
</div>
<script>
const MODELS = [
  {g:'Текст', items:[
    ['flash','Gemini Flash','Быстрый текст',4],
    ['flash_25','Gemini 2.5 Flash','Ещё быстрее',4],
    ['pro','Gemini Pro','Аналитика и код',15]
  ]},
  {g:'Картинки', items:[
    ['nanobanana','Nano Banana','Арт и фото',20],
    ['nanobanana_pro','Nano Banana Pro','Про-фото',50],
    ['qwen-image-3-0','Qwen Image 3.0','Арт',45],
    ['seedream-4-5','Seedream 4.5','Продвинутый арт',20],
    ['recraft-v4-1','Recraft V4.1','Вектор и растр',20],
    ['runway-gen4-image','Runway Gen4','Реализм',80]
  ]},
  {g:'Улучшить фото', items:[
    ['phota-enhance','Phota Enhance','Улучшение',220],
    ['p-image-upscale','Pruna Upscale','Резкость',10]
  ]},
  {g:'Видео', items:[
    ['sora-2','Sora 2.0','Анимация',150],
    ['seedance-1-5-pro','Seedance 1.5 Pro','Видео из фото',120],
    ['pruna-ai-p-video-2-pro','Pruna Video','Генерация видео',70]
  ]},
  {g:'Голос', items:[
    ['qwen3-tts-flash','Qwen TTS Flash','Быстрая озвучка',100],
    ['qwen3-tts','Qwen TTS','Озвучка',100]
  ]}
];
const CAT = {chat:'Чат', image:'Картинки', video:'Видео', audio:'Голос', template:'Шаблон'};
let tab = 'home';
let me = null;
let templates = [];
let userId = null;

function tg(){ return window.Telegram && window.Telegram.WebApp; }
function parseUser(raw){
  if (!raw) return null;
  const attempts = [raw];
  try { attempts.push(decodeURIComponent(raw)); } catch (e) {}
  for (const src of attempts) {
    try {
      const p = new URLSearchParams(src);
      const u = JSON.parse(p.get('user') || 'null');
      if (u && u.id) return u.id;
    } catch (e) {}
  }
  return null;
}
function detectUser(){
  const w = tg();
  if (w && w.initDataUnsafe && w.initDataUnsafe.user && w.initDataUnsafe.user.id) return w.initDataUnsafe.user.id;
  if (w && w.initData) { const id = parseUser(w.initData); if (id) return id; }
  const hash = (location.hash || '').replace(/^#/, '');
  const hp = new URLSearchParams(hash);
  const fromHash = parseUser(hp.get('tgWebAppData') || hash);
  if (fromHash) return fromHash;
  const q = new URLSearchParams(location.search);
  if (q.get('userId')) return q.get('userId');
  return null;
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&','<':'<','>':'>','"':'"'}[c])); }
function n(v){ return String(Math.round(Number(v) || 0)); }
function insideTelegram(){
  const w = tg();
  if (location.hash && location.hash.indexOf('tgWebApp') !== -1) return true;
  if (w && w.initData) return true;
  if (w && w.platform && w.platform !== 'unknown') return true;
  return false;
}
function toastHaptic(){ try { tg() && tg().HapticFeedback && tg().HapticFeedback.notificationOccurred('success'); } catch(e){} }

async function load(){
  userId = detectUser();
  if (!userId && !insideTelegram()) {
    userId = 'demo';
    me = { balance: 1280, current_model: 'nanobanana', blocked: false, history: [
      { delta: -20, balance: 1280, reason: 'Шаблон «Портрет в неоне»', created_at: new Date().toISOString() },
      { delta: 500, balance: 1300, reason: 'Пополнение', created_at: new Date(Date.now()-86400000).toISOString() }
    ]};
    templates = [
      {id:1,title:'Портрет в неоне',category:'image',prompt:'портрет',model:'nanobanana',cost:20},
      {id:2,title:'Обложка для поста',category:'image',prompt:'обложка',model:'nanobanana_pro',cost:50},
      {id:3,title:'Короткий сценарий',category:'chat',prompt:'сценарий',model:'flash',cost:4},
      {id:4,title:'Промпт для видео',category:'video',prompt:'видео',model:'pro',cost:15}
    ];
    draw();
    return;
  }
  try {
    const r = await fetch('/api/me?userId=' + encodeURIComponent(userId));
    me = await r.json();
    if (me.error) throw new Error(me.error);
  } catch (e) {
    me = { error: true, balance: 0, history: [], current_model: 'flash' };
  }
  try {
    const t = await fetch('/api/templates');
    const d = await t.json();
    templates = d.templates || [];
  } catch (e) { templates = []; }
  draw();
}

function draw(){
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  const box = document.getElementById('view');
  if (!userId) {
    box.innerHTML = '<div class="card"><div class="k">Кабинет</div><p class="empty">Откройте кабинет кнопкой «Личный кабинет» внутри бота — так Telegram передаёт ваш аккаунт.</p><a class="btn" style="display:block;text-align:center;text-decoration:none" href="https://babayagaland.ru/kabinet">Кабинет на сайте</a></div>';
    return;
  }
  if (me && me.blocked) {
    box.innerHTML = '<div class="ban">Аккаунт в чёрном списке. Генерации отключены. Напишите в поддержку бота.</div>';
    return;
  }
  if (tab === 'home') box.innerHTML = home();
  else if (tab === 'models') box.innerHTML = models();
  else if (tab === 'tpl') box.innerHTML = tpls();
  else box.innerHTML = hist();
  bind();
}
function home(){
  const model = (me && me.current_model) || 'flash';
  const title = findModel(model);
  return '<div class="card"><div class="k">Баланс</div><div class="bal">' + n(me && me.balance) + '</div><div class="sub">кредитов</div><button class="btn" id="buy">Пополнить баланс</button></div>' +
    '<div class="card"><div class="k">Сейчас выбрано</div><p style="margin:8px 0 12px"><b>' + esc(title) + '</b></p><div class="row"><button class="btn ghost" data-go="models">Сменить модель</button><button class="btn ghost" data-go="tpl">Шаблоны</button></div></div>' +
    '<div class="card"><div class="k">Сайт</div><p class="meta" style="margin:8px 0 12px">Полный кабинет, лента и чат — на сайте НейроЯги.</p><a class="btn" style="display:block;text-align:center;text-decoration:none" href="https://babayagaland.ru" target="_blank">Открыть babayagaland.ru</a></div>';
}
function findModel(key){
  for (const g of MODELS) for (const it of g.items) if (it[0] === key) return it[1];
  return key;
}
function models(){
  const cur = (me && me.current_model) || 'flash';
  return MODELS.map(g => '<div class="card"><div class="k">' + esc(g.g) + '</div>' + g.items.map(it =>
    '<button class="model' + (it[0]===cur?' on':'') + '" data-model="' + esc(it[0]) + '"><div><div class="name">' + esc(it[1]) + '</div><div class="meta">' + esc(it[2]) + '</div></div><div class="cost">' + it[3] + ' кр</div></button>'
  ).join('') + '</div>').join('');
}
function tpls(){
  if (!templates.length) return '<div class="card"><div class="empty">Шаблонов пока нет. Добавьте их в админке: /admin</div></div>';
  return '<div class="card"><div class="k">Шаблоны</div><p class="meta" style="margin:6px 0 10px">Нажмите — бот запустит промпт выбранной моделью и спишет кредиты.</p>' +
    templates.map(t => '<button class="tpl" data-tpl="' + t.id + '"><div><div class="name">' + esc(t.title) + '</div><div class="meta">' + esc(CAT[t.category] || t.category) + ' · ' + esc(findModel(t.model)) + '</div></div><div class="cost">' + n(t.cost) + ' кр</div></button>').join('') +
    '</div>';
}
function hist(){
  const rows = (me && me.history) || [];
  if (!rows.length) return '<div class="card"><div class="k">История</div><div class="empty">Операций ещё нет</div></div>';
  return '<div class="card"><div class="k">История</div>' + rows.map(h => {
    const d = new Date(h.created_at);
    const when = isNaN(d) ? '' : d.toLocaleString('ru-RU', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
    const sign = Number(h.delta) >= 0;
    return '<div class="item"><div><b>' + esc(h.reason || (sign ? 'Начисление' : 'Списание')) + '</b><div class="meta">' + esc(when) + ' · остаток ' + n(h.balance) + '</div></div><div class="' + (sign?'plus':'minus') + '">' + (sign?'+':'') + n(h.delta) + '</div></div>';
  }).join('') + '</div>';
}
function bind(){
  const buy = document.getElementById('buy');
  if (buy) buy.onclick = function(){
    const w = tg();
    if (w && w.sendData) { w.sendData(JSON.stringify({action:'buy_credits'})); w.close(); return; }
    location.href = 'https://babayagaland.ru/kabinet?pay=1';
  };
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { tab = b.dataset.go; draw(); });
  document.querySelectorAll('[data-model]').forEach(b => b.onclick = () => setModel(b.dataset.model));
  document.querySelectorAll('[data-tpl]').forEach(b => b.onclick = () => runTpl(Number(b.dataset.tpl)));
}
async function setModel(model){
  if (userId !== 'demo') {
    await fetch('/api/set-model', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({userId, model})});
  }
  if (me) me.current_model = model;
  toastHaptic();
  draw();
}
function runTpl(id){
  const t = templates.find(x => x.id === id);
  if (!t) return;
  const w = tg();
  const payload = {action:'run_template', id: t.id, prompt: t.prompt, model: t.model, title: t.title};
  if (w && w.sendData) { w.sendData(JSON.stringify(payload)); w.close(); return; }
  alert('Запуск шаблона работает из кнопки бота «Личный кабинет».');
}
document.getElementById('tabs').onclick = function(e){
  const b = e.target.closest('button');
  if (!b) return;
  tab = b.dataset.t;
  draw();
};
const w = tg();
if (w) { try { w.ready(); w.expand(); w.setHeaderColor('#0b0614'); w.setBackgroundColor('#0b0614'); } catch(e){} }
let tries = 0;
function boot(){
  load();
  if (!userId && tries < 15) { tries++; setTimeout(boot, 300); }
}
boot();
</script>
</body>
</html>
